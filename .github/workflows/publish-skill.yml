name: Publish skill image

# Publish exactly one skill with a tag shaped as:
#   skill-<directory>-v<semver>
# Example: skill-github-v1.2.0 publishes axiomstudio/skill-github:1.2.0.
on:
  push:
    tags:
      - 'skill-*-v*.*.*'

concurrency:
  group: publish-skill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build-push:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Resolve and validate release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          if [[ ! "$tag" =~ ^skill-(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unsupported skill release tag: $tag" >&2
            exit 1
          fi
          skill="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          manifest="skills/$skill/skill.yaml"
          test -f "$manifest"
          grep -Eq "^[[:space:]]+id:[[:space:]]+skill-$skill$" "$manifest"
          grep -Eq "^[[:space:]]+version:[[:space:]]+$version$" "$manifest"
          grep -Eq "^[[:space:]]+package:[[:space:]]+axiomstudio/skill-$skill:$version$" "$manifest"
          echo "skill=$skill" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=axiomstudio/skill-$skill:$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test selected skill
        run: go test -count=1 ./skills/${{ steps.release.outputs.skill }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: axiomstudio
          password: ${{ secrets.DOCKERHUB_AXIOMSTUDIO_PUSH_SECRET }}

      - name: Build and push selected skill
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.release.outputs.image }}
          build-args: |
            SKILL_NAME=${{ steps.release.outputs.skill }}
            SKILL_PORT=50051
