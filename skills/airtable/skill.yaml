apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        airtable-create:
            credentials:
                - kind: airtable_api
                  name: airtable_api
            description: Airtable Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    baseId:
                        description: ID of the Airtable base
                        type: string
                    records:
                        description: Array of record objects with fields
                        type: string
                    table:
                        description: Table name
                        type: string
                required:
                    - baseId
                    - records
                    - table
                type: object
            name: airtable-create
            permissions:
                - airtable:read
                - airtable:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        airtable-delete:
            credentials:
                - kind: airtable_api
                  name: airtable_api
            description: Airtable Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    baseId:
                        description: ID of the Airtable base
                        type: string
                    recordIds:
                        description: Array of record IDs to delete
                        type: string
                    table:
                        description: Table name
                        type: string
                required:
                    - baseId
                    - recordIds
                    - table
                type: object
            name: airtable-delete
            permissions:
                - airtable:read
                - airtable:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        airtable-list:
            credentials:
                - kind: airtable_api
                  name: airtable_api
            description: Airtable List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    baseId:
                        description: ID of the Airtable base
                        type: string
                    filterByFormula:
                        description: Airtable formula to filter records
                        type: string
                    maxRecords:
                        description: Maximum number of records to return
                        type: integer
                    sort:
                        description: Array of sort options
                        type: string
                    table:
                        description: Table name to list records from
                        type: string
                    view:
                        description: View ID to use for listing
                        type: string
                required:
                    - baseId
                    - table
                type: object
            name: airtable-list
            permissions:
                - airtable:read
                - airtable:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airtable-search:
            credentials:
                - kind: airtable_api
                  name: airtable_api
            description: Airtable Search
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    baseId:
                        description: ID of the Airtable base
                        type: string
                    exactMatch:
                        default: false
                        description: Whether to match exactly
                        type: boolean
                    field:
                        description: Field name to search in
                        type: string
                    table:
                        description: Table name
                        type: string
                    value:
                        description: Value to search for
                        type: string
                required:
                    - baseId
                    - field
                    - table
                    - value
                type: object
            name: airtable-search
            permissions:
                - airtable:read
                - airtable:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airtable-update:
            credentials:
                - kind: airtable_api
                  name: airtable_api
            description: Airtable Update
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    baseId:
                        description: ID of the Airtable base
                        type: string
                    records:
                        description: Array of record objects with id and fields
                        type: string
                    table:
                        description: Table name
                        type: string
                required:
                    - baseId
                    - records
                    - table
                type: object
            name: airtable-update
            permissions:
                - airtable:read
                - airtable:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: data
    description: Airtable database operations for Atlas agents
    icon: table
    id: skill-airtable
    installers:
        - id: oci
          kind: oci
          label: Airtable Skill service image
          package: axiomstudio/skill-airtable:1.0.0
    name: Airtable Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-airtable
        resolvedVersion: 1.0.0
    tags:
        - airtable
        - database
        - no-code
        - spreadsheet
    transport:
        endpoint: skill-airtable
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
