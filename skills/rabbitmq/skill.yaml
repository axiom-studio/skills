apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        rabbitmq-binding-create:
            credentials:
                - kind: rabbitmq-credential
                  name: rabbitmq-credential
            description: Rabbitmq Binding Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    exchange:
                        description: Exchange name
                        type: string
                    queue:
                        description: Queue name
                        type: string
                    routingKey:
                        description: Routing key
                        type: string
                    url:
                        description: RabbitMQ URL
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - exchange
                    - queue
                    - routingKey
                    - url
                    - username
                type: object
            name: rabbitmq-binding-create
            permissions:
                - rabbitmq:read
                - rabbitmq:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        rabbitmq-binding-list:
            credentials:
                - kind: rabbitmq-credential
                  name: rabbitmq-credential
            description: Rabbitmq Binding List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    url:
                        description: RabbitMQ URL
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - url
                    - username
                type: object
            name: rabbitmq-binding-list
            permissions:
                - rabbitmq:read
                - rabbitmq:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        rabbitmq-consume:
            credentials:
                - kind: rabbitmq-credential
                  name: rabbitmq-credential
            description: Rabbitmq Consume
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    ack:
                        default: true
                        description: Auto-acknowledge
                        type: boolean
                    maxMessages:
                        description: Max messages to consume
                        type: integer
                    queue:
                        description: Queue name
                        type: string
                    timeout:
                        description: Consume timeout
                        type: string
                    url:
                        description: RabbitMQ URL
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - queue
                    - url
                    - username
                type: object
            name: rabbitmq-consume
            permissions:
                - rabbitmq:read
                - rabbitmq:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        rabbitmq-exchange-create:
            credentials:
                - kind: rabbitmq-credential
                  name: rabbitmq-credential
            description: Rabbitmq Exchange Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    durable:
                        default: true
                        description: Durable exchange
                        type: boolean
                    exchangeType:
                        default: direct
                        description: Exchange type (direct, topic, fanout, headers)
                        type: string
                    name:
                        description: Exchange name
                        type: string
                    url:
                        description: RabbitMQ URL
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - name
                    - url
                    - username
                type: object
            name: rabbitmq-exchange-create
            permissions:
                - rabbitmq:read
                - rabbitmq:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        rabbitmq-exchange-list:
            credentials:
                - kind: rabbitmq-credential
                  name: rabbitmq-credential
            description: Rabbitmq Exchange List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    url:
                        description: RabbitMQ URL
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - url
                    - username
                type: object
            name: rabbitmq-exchange-list
            permissions:
                - rabbitmq:read
                - rabbitmq:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        rabbitmq-publish:
            credentials:
                - kind: rabbitmq-credential
                  name: rabbitmq-credential
            description: Rabbitmq Publish
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    contentType:
                        default: text/plain
                        description: Content type
                        type: string
                    deliveryMode:
                        description: 1=transient, 2=persistent
                        type: integer
                    exchange:
                        description: Exchange name
                        type: string
                    message:
                        description: Message body
                        type: string
                    priority:
                        description: Message priority
                        type: integer
                    routingKey:
                        description: Routing key
                        type: string
                    url:
                        description: RabbitMQ URL (amqp://host:port)
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - exchange
                    - message
                    - routingKey
                    - url
                    - username
                type: object
            name: rabbitmq-publish
            permissions:
                - rabbitmq:read
                - rabbitmq:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        rabbitmq-queue-create:
            credentials:
                - kind: rabbitmq-credential
                  name: rabbitmq-credential
            description: Rabbitmq Queue Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    durable:
                        default: true
                        description: Durable queue
                        type: boolean
                    name:
                        description: Queue name
                        type: string
                    url:
                        description: RabbitMQ URL
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - name
                    - url
                    - username
                type: object
            name: rabbitmq-queue-create
            permissions:
                - rabbitmq:read
                - rabbitmq:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        rabbitmq-queue-delete:
            credentials:
                - kind: rabbitmq-credential
                  name: rabbitmq-credential
            description: Rabbitmq Queue Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    name:
                        description: Queue name
                        type: string
                    url:
                        description: RabbitMQ URL
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - name
                    - url
                    - username
                type: object
            name: rabbitmq-queue-delete
            permissions:
                - rabbitmq:read
                - rabbitmq:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        rabbitmq-queue-list:
            credentials:
                - kind: rabbitmq-credential
                  name: rabbitmq-credential
            description: Rabbitmq Queue List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    url:
                        description: RabbitMQ URL
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - url
                    - username
                type: object
            name: rabbitmq-queue-list
            permissions:
                - rabbitmq:read
                - rabbitmq:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        rabbitmq-queue-purge:
            credentials:
                - kind: rabbitmq-credential
                  name: rabbitmq-credential
            description: Rabbitmq Queue Purge
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    name:
                        description: Queue name
                        type: string
                    url:
                        description: RabbitMQ URL
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - name
                    - url
                    - username
                type: object
            name: rabbitmq-queue-purge
            permissions:
                - rabbitmq:read
                - rabbitmq:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
