apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        trello-board-get:
            credentials:
                - kind: trello-credential
                  name: trello-credential
            description: Trello Board Get
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    boardId:
                        description: Board ID
                        type: string
                required:
                    - boardId
                type: object
            name: trello-board-get
            permissions:
                - trello:read
                - trello:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        trello-board-list:
            credentials:
                - kind: trello-credential
                  name: trello-credential
            description: Trello Board List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    filter:
                        description: Filter (members, all)
                        type: string
                type: object
            name: trello-board-list
            permissions:
                - trello:read
                - trello:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        trello-card-create:
            credentials:
                - kind: trello-credential
                  name: trello-credential
            description: Trello Card Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    description:
                        description: Card description
                        type: string
                    dueDate:
                        description: Due date
                        type: string
                    labels:
                        description: Label IDs
                        type: string
                    listId:
                        description: List ID
                        type: string
