apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        helm-history:
            description: Helm History
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    namespace:
                        default: default
                        description: Namespace
                        type: string
                    releaseName:
                        description: Release name
                        type: string
                required:
                    - releaseName
                type: object
            name: helm-history
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        helm-install:
            description: Helm Install
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    chart:
                        description: Chart name or path
                        type: string
                    createNamespace:
                        default: false
                        description: Create namespace if missing
                        type: boolean
                    namespace:
                        default: default
                        description: Target namespace
                        type: string
                    releaseName:
                        description: Release name
                        type: string
                    repo:
                        description: Chart repository URL
                        type: string
                    timeout:
                        description: Timeout (e.g., 10m)
                        type: string
                    values:
                        description: Override values
                        type: object
                    valuesFile:
                        description: Values file path
                        type: string
                    version:
                        description: Chart version
                        type: string
                    wait:
                        default: true
                        description: Wait for resources
                        type: boolean
                    waitForJobs:
                        default: false
                        description: Wait for Jobs to complete
                        type: boolean
                required:
                    - chart
                    - releaseName
                type: object
            name: helm-install
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        helm-list:
            description: Helm List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    all:
                        default: false
                        description: List all releases
                        type: boolean
                    filter:
                        description: Name filter regex
                        type: string
                    namespace:
                        description: Namespace filter
                        type: string
                type: object
            name: helm-list
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        helm-pull:
            description: Helm Pull
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    chart:
                        description: Chart name or path
                        type: string
                    destination:
                        description: Destination directory
                        type: string
                    repo:
                        description: Chart repository URL
                        type: string
                    untar:
                        default: false
                        description: Untar the chart
                        type: boolean
                    version:
                        description: Chart version
                        type: string
                required:
                    - chart
                type: object
            name: helm-pull
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        helm-repo-add:
            credentials:
                - kind: helm-credential
                  name: helm-credential
            description: Helm Repo Add
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    name:
                        description: Repository name
                        type: string
                    passCredentialsAll:
                        default: false
                        description: Pass credentials to all requests
                        type: boolean
                    url:
                        description: Repository URL
                        type: string
                    username:
                        description: Username
                        type: string
                required:
                    - name
                    - url
                type: object
            name: helm-repo-add
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        helm-repo-list:
            description: Helm Repo List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    config:
                        description: Helm configuration
                        type: object
                type: object
            name: helm-repo-list
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        helm-repo-update:
            description: Helm Repo Update
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    name:
                        description: Repository name to update
                        type: string
                type: object
            name: helm-repo-update
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        helm-rollback:
            description: Helm Rollback
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    namespace:
                        default: default
                        description: Namespace
                        type: string
                    releaseName:
                        description: Release name
                        type: string
                    revision:
                        description: Revision to rollback to
                        type: integer
                    timeout:
                        description: Timeout
                        type: string
                    wait:
                        default: true
                        description: Wait for resources
                        type: boolean
                required:
                    - releaseName
                type: object
            name: helm-rollback
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        helm-search:
            description: Helm Search
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    query:
                        description: Search query
                        type: string
                    repo:
                        description: Repository name filter
                        type: string
                    version:
                        description: Version constraint
                        type: string
                required:
                    - query
                type: object
            name: helm-search
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        helm-status:
            description: Helm Status
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    namespace:
                        default: default
                        description: Namespace
                        type: string
                    releaseName:
                        description: Release name
                        type: string
                required:
                    - releaseName
                type: object
            name: helm-status
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        helm-template:
            description: Helm Template
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    chart:
                        description: Chart name or path
                        type: string
                    namespace:
                        description: Namespace
                        type: string
                    releaseName:
                        description: Release name
                        type: string
                    repo:
                        description: Chart repository URL
                        type: string
                    values:
                        description: Override values
                        type: object
                    version:
                        description: Chart version
                        type: string
                required:
                    - chart
                    - releaseName
                type: object
            name: helm-template
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        helm-uninstall:
            description: Helm Uninstall
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    keepHistory:
                        default: false
                        description: Keep release history
                        type: boolean
                    namespace:
                        default: default
                        description: Namespace
                        type: string
                    releaseName:
                        description: Release name
                        type: string
                required:
                    - releaseName
                type: object
            name: helm-uninstall
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        helm-upgrade:
            description: Helm Upgrade
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    chart:
                        description: Chart name
                        type: string
                    force:
                        default: false
                        description: Force resource updates
                        type: boolean
                    namespace:
                        default: default
                        description: Namespace
                        type: string
                    releaseName:
                        description: Release name
                        type: string
                    resetValues:
                        default: false
                        description: Reset to chart defaults
                        type: boolean
                    reuseValues:
                        default: false
                        description: Reuse existing values
                        type: boolean
                    timeout:
                        description: Timeout
                        type: string
                    values:
                        description: Override values
                        type: object
                    wait:
                        default: true
                        description: Wait for resources
                        type: boolean
                required:
                    - chart
                    - releaseName
                type: object
            name: helm-upgrade
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        helm-values:
            description: Helm Values
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    namespace:
                        default: default
                        description: Namespace
                        type: string
                    releaseName:
                        description: Release name
                        type: string
                required:
                    - releaseName
                type: object
            name: helm-values
            permissions:
                - helm:read
                - helm:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
    category: devops
    description: Helm Kubernetes package manager operations for Atlas agents
    icon: anchor
    id: skill-helm
    installers:
        - id: oci
          kind: oci
          label: Helm Skill service image
          package: axiomstudio/skill-helm:1.0.0
    name: Helm Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-helm
        resolvedVersion: 1.0.0
    tags:
        - charts
        - helm
        - kubernetes
        - package
    transport:
        endpoint: skill-helm
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
