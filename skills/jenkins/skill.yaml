apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        jenkins-build-abort:
            credentials:
                - kind: jenkins-credential
                  name: jenkins-credential
            description: Jenkins Build Abort
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    buildNumber:
                        description: Build number to abort
                        type: integer
                    jobName:
                        description: Job name
                        type: string
                    url:
                        description: Jenkins server URL
                        type: string
                required:
                    - buildNumber
                    - jobName
                    - url
                type: object
            name: jenkins-build-abort
            permissions:
                - jenkins:read
                - jenkins:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
