                additionalProperties: false
                properties:
                    fileKey:
                        description: File key
                        type: string
                required:
                    - fileKey
                type: object
            name: figma-style-list
            permissions:
                - figma:read
                - figma:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        figma-team-projects:
            credentials:
                - kind: figma_token
                  name: figma_token
            description: Figma Team Projects
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    teamId:
                        description: Team ID
                        type: string
                required:
                    - teamId
                type: object
            name: figma-team-projects
            permissions:
                - figma:read
                - figma:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
