apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        figma-comment-create:
            credentials:
                - kind: figma_token
                  name: figma_token
            description: Figma Comment Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    clientId:
                        description: Client user ID
                        type: string
                    fileKey:
                        description: File key
                        type: string
                    message:
                        description: Comment message
                        type: string
                    nodeId:
                        description: Node ID to comment on
                        type: string
                required:
                    - fileKey
                    - message
                type: object
            name: figma-comment-create
            permissions:
                - figma:read
                - figma:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        figma-comment-list:
            credentials:
                - kind: figma_token
                  name: figma_token
            description: Figma Comment List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    fileKey:
                        description: File key
                        type: string
                required:
                    - fileKey
                type: object
            name: figma-comment-list
            permissions:
                - figma:read
                - figma:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        figma-file-export:
            credentials:
                - kind: figma_token
                  name: figma_token
            description: Figma File Export
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    fileKey:
                        description: File key
                        type: string
                    format:
                        default: png
                        description: Export format (png, svg, jpg)
                        type: string
                    nodeId:
                        description: Node ID to export
                        type: string
                    scale:
                        default: 1
                        description: Scale factor
                        type: number
                required:
                    - fileKey
                    - nodeId
                type: object
            name: figma-file-export
            permissions:
                - figma:read
                - figma:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        figma-file-get:
            credentials:
                - kind: figma_token
                  name: figma_token
            description: Figma File Get
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    depth:
                        default: 0
                        description: Node depth
                        type: integer
                    fileKey:
                        description: File key
                        type: string
                required:
                    - fileKey
                type: object
            name: figma-file-get
            permissions:
                - figma:read
                - figma:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        figma-file-list:
            credentials:
                - kind: figma_token
                  name: figma_token
            description: Figma File List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    projectId:
                        description: Project ID
                        type: string
                required:
                    - projectId
                type: object
            name: figma-file-list
            permissions:
                - figma:read
                - figma:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        figma-project-files:
            credentials:
                - kind: figma_token
                  name: figma_token
            description: Figma Project Files
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    projectId:
                        description: Project ID
                        type: string
                required:
                    - projectId
                type: object
            name: figma-project-files
            permissions:
                - figma:read
                - figma:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        figma-style-list:
            credentials:
                - kind: figma_token
                  name: figma_token
            description: Figma Style List
            idempotency: supported
