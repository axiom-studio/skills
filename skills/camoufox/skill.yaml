apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        camoufox-health:
            name: camoufox-health
            description: Report governed Camoufox automation readiness without exposing target, profile, or proxy configuration.
            inputSchema: {type: object, additionalProperties: false}
            permissions: [browser:session]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
        camoufox-start:
            name: camoufox-start
            description: Start an isolated persistent Camoufox session against one configured target using opaque profile and egress identities.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    targetId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    path: {type: string, pattern: '^/', maxLength: 2048, default: /}
                    profileId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    proxyPoolId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                required: [sessionId, targetId, profileId, proxyPoolId]
            permissions: [browser:session, network:http]
            idempotency: none
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
            timeout: 45000000000
        camoufox-snapshot:
            name: camoufox-snapshot
            description: Capture a compact viewport-focused semantic snapshot and typed access challenges from the current page. Optionally attach a bounded screenshot for a vision-capable model.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    includeScreenshot: {type: boolean, default: false}
                required: [sessionId]
            permissions: [browser:observe]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
        camoufox-click:
            name: camoufox-click
            description: Click one exact current snapshot reference without committing a stable external business operation.
            inputSchema: &interaction_input
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
                    generation: {type: integer, minimum: 1}
                    x: {type: number, minimum: 0, maximum: 10000}
                    'y': {type: number, minimum: 0, maximum: 10000}
                    intent: {type: string, minLength: 3, maxLength: 500}
                    writeAuthorized: {type: boolean}
                    idempotencyKey: {type: string, minLength: 8, maxLength: 128}
                required: [sessionId, intent, writeAuthorized, idempotencyKey]
                oneOf:
                    - required: [target]
                    - required: [generation, x, 'y']
            permissions: [browser:interact, network:http]
            externalOperationPolicy: forbidden
            idempotency: required
            retry: {maxAttempts: 1}
            risk: external
            sideEffect: external
        camoufox-commit:
            name: camoufox-commit
            description: Click the final control that commits one approved, stable, externally observable operation.
            inputSchema: *interaction_input
            permissions: [browser:interact, network:http]
            externalOperationPolicy: required
            idempotency: required
            retry: {maxAttempts: 1}
            risk: external
            sideEffect: external
        camoufox-fill:
            name: camoufox-fill
            description: Click and type into one exact current non-secret control with human cadence.
            inputSchema: &fill_input
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
                    value: {type: string, maxLength: 20000}
                    intent: {type: string, minLength: 3, maxLength: 500}
                    writeAuthorized: {type: boolean}
                    idempotencyKey: {type: string, minLength: 8, maxLength: 128}
                required: [sessionId, target, value, intent, writeAuthorized, idempotencyKey]
            permissions: [browser:interact]
            externalOperationPolicy: forbidden
            idempotency: required
            retry: {maxAttempts: 1}
            risk: external
            sideEffect: external
            semanticArguments: {body: value, target: target}
        camoufox-fill-secret:
            name: camoufox-fill-secret
            description: Fill one exact login control from an authorized credential binding without exposing the value.
            credentials:
                - {kind: http_basic_auth, name: username}
                - {kind: http_basic_auth, name: password}
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
                    credentialField: {type: string, enum: [username, password]}
                    intent: {type: string, minLength: 3, maxLength: 500}
                    writeAuthorized: {type: boolean}
                    idempotencyKey: {type: string, minLength: 8, maxLength: 128}
                required: [sessionId, target, credentialField, intent, writeAuthorized, idempotencyKey]
            permissions: [browser:interact, credential:use]
            externalOperationPolicy: forbidden
            idempotency: required
            retry: {maxAttempts: 1}
            risk: external
            sideEffect: external
            semanticArguments: {target: target}
        camoufox-select:
            name: camoufox-select
            description: Set one exact native select control to a value or visible label.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
                    value: {type: string, maxLength: 1000}
                    intent: {type: string, minLength: 3, maxLength: 500}
                    writeAuthorized: {type: boolean}
                    idempotencyKey: {type: string, minLength: 8, maxLength: 128}
                required: [sessionId, target, value, intent, writeAuthorized, idempotencyKey]
            permissions: [browser:interact]
            externalOperationPolicy: forbidden
            idempotency: required
            retry: {maxAttempts: 1}
            risk: external
            sideEffect: external
            semanticArguments: {target: target}
        camoufox-scroll:
            name: camoufox-scroll
            description: Scroll the page by a bounded pixel delta via a real mouse-wheel event to reveal lazy content.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    dx: {type: number, default: 0}
                    dy: {type: number, default: 0}
                required: [sessionId]
            permissions: [browser:observe]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
        camoufox-screenshot:
            name: camoufox-screenshot
            description: Capture a bounded PNG screenshot of the current viewport or full page as evidence.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    fullPage: {type: boolean, default: false}
                required: [sessionId]
            permissions: [browser:observe]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
        camoufox-report:
            name: camoufox-report
            description: Return accepted, challenged, or blocked outcome evidence without revealing profile, proxy, cookie, or credential values.
            inputSchema: &session_input
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                required: [sessionId]
            permissions: [browser:observe, security:report]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
        camoufox-close:
            name: camoufox-close
            description: Close an isolated automation session while preserving its configured browser profile.
            inputSchema: *session_input
            permissions: [browser:session]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: write
            sideEffect: none
    category: security
    description: Governed Camoufox stealth browser automation using opaque authorized targets, OS-level fingerprint profiles, and rotating egress identities.
    icon: shield
    id: skill-camoufox
    installers:
        - id: oci
          kind: oci
          label: Camoufox Skill service image with pinned Camoufox and Firefox
          package: axiomstudio/skill-camoufox:1.0.6
    name: Camoufox Skill
    prompt:
        allowedTools:
            - camoufox-health
            - camoufox-start
            - camoufox-snapshot
            - camoufox-click
            - camoufox-commit
            - camoufox-fill
            - camoufox-fill-secret
            - camoufox-select
            - camoufox-scroll
            - camoufox-screenshot
            - camoufox-report
            - camoufox-close
        instructions: Use only configured target, profile, and proxy-pool identifiers. Take a new snapshot after every interaction. Use camoufox-commit only for the final approved external operation. A third-party access challenge requires human completion; pause automation when one is reported.
        userInvocable: true
    requirements:
        compute:
            limits: {cpu: 2000m, memory: 2Gi}
            requests: {cpu: 250m, memory: 512Mi}
        operatingSystems: [linux]
        storage:
            - name: camoufox-profile
              durability: persistent
              minimumCapacity: 2Gi
              mountPath: /var/lib/openseal-camoufox
              retention: retain
              writableGroup: 1000
    source:
        format: axiom.skill/v1
        homepage: https://github.com/daijro/camoufox
        license: MIT
        publisher: Axiom Studio
        reference: skill-camoufox
        resolvedVersion: 1.0.6
    tags: [anti-detect, browser, camoufox, firefox, stealth]
    transport:
        endpoint: skill-camoufox
        kind: tool
    version: 1.0.6
kind: SkillDefinition
