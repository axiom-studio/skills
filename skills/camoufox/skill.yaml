apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        camoufox-health:
            name: camoufox-health
            description: Report governed Camoufox automation readiness without exposing target, profile, or proxy configuration.
            inputSchema: {type: object, additionalProperties: false}
            permissions: [browser:session]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
        camoufox-start:
            name: camoufox-start
            description: Start an isolated persistent Camoufox session against one configured target using opaque profile and egress identities.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    path: {type: string, pattern: '^/', maxLength: 2048, default: /}
            outputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    url: {type: string, pattern: '^https?://', maxLength: 2048}
                    status: {type: string, enum: [active]}
                required: [sessionId, url, status]
            permissions: [browser:session, network:http]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
            finalizerAction: camoufox-close
            timeout: 45000000000
        camoufox-navigate:
            name: camoufox-navigate
            description: Navigate an active session to an HTTP(S) URL while preserving its browser context and cookies; optionally opt into a configured target/path guard.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    url: {type: string, pattern: '^https?://', maxLength: 2048}
                    targetId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    path: {type: string, pattern: '^/', maxLength: 2048, default: /}
                required: [sessionId]
                oneOf:
                    - required: [url]
                    - required: [targetId]
            permissions: [browser:session, network:http]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
            timeout: 45000000000
        camoufox-snapshot:
            name: camoufox-snapshot
            description: Capture a compact viewport-focused semantic snapshot and typed access challenges from the current page. Optionally attach a bounded screenshot for a vision-capable model.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    includeScreenshot: {type: boolean, default: false}
                required: [sessionId]
            outputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    generation: {type: integer, minimum: 1}
                    observationDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                    url: {type: string, maxLength: 2048}
                    title: {type: string}
                    text: {type: string, maxLength: 49152}
                    elements:
                        type: array
                        maxItems: 180
                        items:
                            type: object
                            additionalProperties: false
                            properties:
                                ref: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
                                role: {type: string}
                                name: {type: string}
                                context: {type: string}
                                inViewport: {type: boolean}
                                bounds: {type: object}
                                state: {type: object}
                                destinationScope: {type: string, enum: [same_origin, external_origin]}
                                destinationPath: {type: string, pattern: '^/', maxLength: 2048}
                            required: [ref, role, name, context, inViewport, bounds, state]
                    challenges:
                        type: array
                        maxItems: 4
                        uniqueItems: true
                        items: {type: string, enum: [captcha, mfa, anti_bot]}
                    requiresHuman: {type: boolean}
                    modelMedia:
                        type: object
                        additionalProperties: false
                        properties:
                            mediaType: {type: string, const: image/jpeg}
                            contentBase64: {type: string}
                            detail: {type: string, const: low}
                            width: {type: [number, 'null']}
                            height: {type: [number, 'null']}
                        required: [mediaType, contentBase64, detail, width, height]
                required: [sessionId, generation, observationDigest, url, title, text, elements, challenges, requiresHuman]
            permissions: [browser:observe]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
        camoufox-follow-link:
            name: camoufox-follow-link
            description: Follow one exact anchor from the current snapshot within the active authorized target without activating a form or mutation control.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
                    intent: {type: string, minLength: 3, maxLength: 500}
                required: [sessionId, target, intent]
            permissions: [browser:session, browser:observe, network:http]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
            timeout: 45000000000
        camoufox-click:
            name: camoufox-click
            description: Click one exact current snapshot reference without committing a stable external business operation.
            inputSchema: &interaction_input
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
                    generation: {type: integer, minimum: 1}
                    x: {type: number, minimum: 0, maximum: 10000}
                    'y': {type: number, minimum: 0, maximum: 10000}
                    intent: {type: string, minLength: 3, maxLength: 500}
                    idempotencyKey: {type: string, minLength: 8, maxLength: 128}
                required: [sessionId, intent, idempotencyKey]
                oneOf:
                    - required: [target]
                    - required: [generation, x, 'y']
            outputSchema: &interaction_output
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    success: {type: boolean}
                    duplicate: {type: boolean}
                    receipt: {type: string, minLength: 8, maxLength: 128}
                    progress:
                        type: object
                        additionalProperties: false
                        properties:
                            changed: {type: boolean}
                            beforeDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                            afterDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                            intentDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
                        required: [changed, beforeDigest, afterDigest]
                required: [sessionId, success, duplicate, receipt, progress]
            permissions: [browser:interact, network:http]
            externalOperationPolicy: forbidden
            idempotency: required
            retry: {maxAttempts: 1}
            risk: write
            sideEffect: write
            semanticArguments: {intent: intent}
        camoufox-commit:
            name: camoufox-commit
            description: Click one enabled button from the latest snapshot to commit the final approved, externally observable operation. Never target a textbox or editable field; fill it with camoufox-fill, take a fresh snapshot, then target the resulting submit or save button.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    target:
                        type: string
                        pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'
                        x-openseal-observationRef: {roles: [button], requireEnabled: true}
                    intent: {type: string, minLength: 3, maxLength: 500}
                    idempotencyKey: {type: string, minLength: 8, maxLength: 128}
                required: [sessionId, target, intent, idempotencyKey]
            outputSchema: *interaction_output
            permissions: [browser:interact, network:http]
            externalOperationPolicy: required
            idempotency: required
            retry: {maxAttempts: 1}
            risk: external
            sideEffect: external
            semanticArguments: {intent: intent}
        camoufox-fill:
            name: camoufox-fill
            description: Click and type into one exact current non-secret editable control with human cadence. Use this for comment, post, message, and form text; it changes only the local form and never submits it. Take a fresh snapshot afterward to obtain the current submit or save button before camoufox-commit.
            inputSchema: &fill_input
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
                    value: {type: string, maxLength: 20000}
                    intent: {type: string, minLength: 3, maxLength: 500}
                    idempotencyKey: {type: string, minLength: 8, maxLength: 128}
                required: [sessionId, target, value, intent, idempotencyKey]
            outputSchema: *interaction_output
            permissions: [browser:interact]
            externalOperationPolicy: forbidden
            idempotency: required
            retry: {maxAttempts: 1}
            risk: write
            sideEffect: write
            semanticArguments: {body: value, target: target, intent: intent}
        camoufox-fill-secret:
            name: camoufox-fill-secret
            description: Fill one exact login control from an authorized credential binding without exposing the value.
            credentials:
                - {kind: http_basic_auth, name: username}
                - {kind: http_basic_auth, name: password}
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
                    credentialField: {type: string, enum: [username, password]}
                    intent: {type: string, minLength: 3, maxLength: 500}
                    idempotencyKey: {type: string, minLength: 8, maxLength: 128}
                required: [sessionId, target, credentialField, intent, idempotencyKey]
            outputSchema: *interaction_output
            permissions: [browser:interact, credential:use]
            externalOperationPolicy: forbidden
            idempotency: required
            retry: {maxAttempts: 1}
            risk: write
            sideEffect: write
            semanticArguments: {target: target, intent: intent}
        camoufox-select:
            name: camoufox-select
            description: Set one exact native select control to a value or visible label.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
                    value: {type: string, maxLength: 1000}
                    intent: {type: string, minLength: 3, maxLength: 500}
                    idempotencyKey: {type: string, minLength: 8, maxLength: 128}
                required: [sessionId, target, value, intent, idempotencyKey]
            outputSchema: *interaction_output
            permissions: [browser:interact]
            externalOperationPolicy: forbidden
            idempotency: required
            retry: {maxAttempts: 1}
            risk: write
            sideEffect: write
            semanticArguments: {target: target, intent: intent}
        camoufox-scroll:
            name: camoufox-scroll
            description: Scroll the current viewport by a bounded pixel delta to reveal lazy content without risking an unbounded pointer operation.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    dx: {type: number, default: 0}
                    dy: {type: number, default: 0}
                required: [sessionId]
            permissions: [browser:observe]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
        camoufox-screenshot:
            name: camoufox-screenshot
            description: Capture a bounded PNG screenshot of the current viewport or full page as evidence.
            inputSchema:
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                    fullPage: {type: boolean, default: false}
                required: [sessionId]
            permissions: [browser:observe]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
        camoufox-report:
            name: camoufox-report
            description: Return accepted, challenged, or blocked outcome evidence without revealing profile, proxy, cookie, or credential values.
            inputSchema: &session_input
                type: object
                additionalProperties: false
                properties:
                    sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                required: [sessionId]
            permissions: [browser:observe, security:report]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: read
        camoufox-close:
            name: camoufox-close
            description: Release the current Run's exclusive use of its Agent-owned browser session while preserving the authenticated session and profile; this does not change the remote site.
            inputSchema: *session_input
            permissions: [browser:session]
            idempotency: supported
            retry: {maxAttempts: 1}
            risk: read
            sideEffect: none
    category: security
    description: Governed Camoufox stealth browser automation using opaque authorized targets, OS-level fingerprint profiles, and rotating egress identities.
    icon: shield
    id: skill-browser
    installers:
        - id: oci
          kind: oci
          label: Camoufox Skill service image with pinned Camoufox and Firefox
          package: axiomstudio/skill-browser:2.0.21
    name: Browser Skill
    prompt:
        allowedTools:
            - camoufox-health
            - camoufox-start
            - camoufox-navigate
            - camoufox-snapshot
            - camoufox-follow-link
            - camoufox-click
            - camoufox-commit
            - camoufox-fill
            - camoufox-fill-secret
            - camoufox-select
            - camoufox-scroll
            - camoufox-screenshot
            - camoufox-report
            - camoufox-close
        instructions: Start the durable Agent session with an optional authorized relative path; the host derives its isolated Agent identity, target, profile, and egress from governed context. Use the returned sessionId for subsequent actions. Each Run acquires serialized bounded usage of the Agent session. If another Run is using it, wait for release or expiry and retry; do not select another identity. Release usage with camoufox-close when the bounded work ends; the Agent session and authenticated profile remain available for later Runs. Follow ordinary anchors from the current snapshot with camoufox-follow-link; it remains inside the active authorized target and does not require write authority. Use camoufox-navigate with an HTTP(S) URL only when no current link exists, or provide targetId when strict configured origin/path scope is desired. Take a new snapshot after every interaction or navigation. Use camoufox-fill for editable textboxes and fields; filling never submits. After filling, take a fresh snapshot and use camoufox-commit only on the enabled submit or save button for the final approved external operation. Never pass a textbox reference to camoufox-commit. Use camoufox-click only for non-final mutation-capable controls. A third-party access challenge requires human completion; pause automation when one is reported.
        userInvocable: true
    requirements:
        compute:
            limits: {cpu: 2000m, memory: 4Gi}
            requests: {cpu: 250m, memory: 1Gi}
        operatingSystems: [linux]
        storage:
            - name: camoufox-profile
              durability: persistent
              minimumCapacity: 2Gi
              mountPath: /var/lib/openseal-camoufox
              retention: retain
              writableGroup: 1000
    source:
        format: axiom.skill/v1
        homepage: https://github.com/daijro/camoufox
        license: MIT
        publisher: Axiom Studio
        reference: skill-browser
        resolvedVersion: 2.0.21
    tags: [anti-detect, browser, camoufox, firefox, stealth]
    transport:
        endpoint: skill-browser
        kind: tool
    version: 2.0.21
kind: SkillDefinition
