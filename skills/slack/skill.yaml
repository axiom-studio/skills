apiVersion: skills.axiom.dev/v1
kind: Skill
metadata:
  id: skill-slack
  name: Slack Skill
  description: Send messages and interact with Slack channels
  author: Axiom Studio
  authorEmail: engineering@axiomstudio.ai
  version: 1.0.0
  license: MIT
  category: communication
  tags:
    - slack
    - notifications
    - messaging
    - chat
  icon: message-circle
  color: "#4A154B"
spec:
  executorType: grpc
  credentialType: slack_bot_token
  nodeTypes:
    - slack-send-message
    - slack-read-messages
    - slack-channel-list
    - slack-add-reaction
    - slack-remove-reaction
    - slack-update-message
    - slack-delete-message
    - slack-create-channel
    - slack-rename-channel
    - slack-archive-channel
    - slack-set-channel-topic
    - slack-set-channel-purpose
    - slack-send-ephemeral-message
    - slack-list-users
  inputs:
    slack-send-message:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
      - name: message
        type: string
        description: Message text to send
        required: true
        source: input
      - name: threadTs
        type: string
        description: Thread timestamp for replying in a thread
        required: false
        source: input
    slack-read-messages:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
      - name: limit
        type: integer
        description: Maximum number of messages to retrieve
        required: false
        source: input
        default: 10
    slack-channel-list:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: types
        type: string
        description: Channel types to filter (public_channel, private_channel)
        required: false
        source: input
    slack-add-reaction:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
      - name: timestamp
        type: string
        description: Message timestamp to react to
        required: true
        source: input
      - name: emoji
        type: string
        description: Reaction emoji name
        required: true
        source: input
    slack-remove-reaction:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
      - name: timestamp
        type: string
        description: Message timestamp to remove reaction from
        required: true
        source: input
      - name: emoji
        type: string
        description: Reaction emoji name
        required: true
        source: input
    slack-update-message:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
      - name: timestamp
        type: string
        description: Message timestamp to update
        required: true
        source: input
      - name: text
        type: string
        description: New message text
        required: true
        source: input
    slack-delete-message:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
      - name: timestamp
        type: string
        description: Message timestamp to delete
        required: true
        source: input
    slack-create-channel:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: name
        type: string
        description: New channel name
        required: true
        source: input
      - name: isPrivate
        type: boolean
        description: Create as private channel
        required: false
        source: input
        default: false
    slack-rename-channel:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
      - name: name
        type: string
        description: New channel name
        required: true
        source: input
    slack-archive-channel:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
    slack-set-channel-topic:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
      - name: topic
        type: string
        description: New channel topic
        required: true
        source: input
    slack-set-channel-purpose:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
      - name: purpose
        type: string
        description: New channel purpose
        required: true
        source: input
    slack-send-ephemeral-message:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: channel
        type: string
        description: Slack channel ID or name
        required: true
        source: input
      - name: user
        type: string
        description: User ID to receive the ephemeral message
        required: true
        source: input
      - name: text
        type: string
        description: Message text
        required: true
        source: input
    slack-list-users:
      - name: token
        type: string
        description: Slack Bot User OAuth Token
        required: true
        source: connection
        binding: vault://slack-credentials
      - name: limit
        type: integer
        description: Maximum number of users to return
        required: false
        source: input
        default: 100
  grpc:
    port: 50054
    docker:
      image: axiomstudio/skill-slack:1.0.0
  dependencies:
    standard:
      - logger
      - secrets
  permissions:
    - slack:read
    - slack:write
