apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        slack-add-reaction:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Add Reaction
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    emoji:
                        description: Reaction emoji name
                        type: string
                    timestamp:
                        description: Message timestamp to react to
                        type: string
                required:
                    - channel
                    - emoji
                    - timestamp
                type: object
            name: slack-add-reaction
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-archive-channel:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Archive Channel
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                required:
                    - channel
                type: object
            name: slack-archive-channel
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-channel-list:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
                  oauth2:
                    provider: slack
                    subject: installation
                    scopes: [app_mentions:read, channels:history, chat:write, groups:history, im:history, mpim:history]
            description: Slack Channel List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    cursor:
                        description: Opaque cursor returned by the previous page
                        type: string
                    limit:
                        default: 100
                        description: Maximum channels to request from Slack
                        maximum: 200
                        minimum: 1
                        type: integer
                    query:
                        description: Optional case-insensitive channel name filter
                        type: string
                    types:
                        description: Channel types to filter (public_channel, private_channel)
                        type: string
                type: object
            name: slack-channel-list
            outputSchema:
                additionalProperties: false
                properties:
                    channels:
                        items:
                            additionalProperties: true
                            properties:
                                description:
                                    type: string
                                id:
                                    type: string
                                name:
                                    type: string
                            required: [id, name]
                            type: object
                        type: array
                    count:
                        type: integer
                    nextCursor:
                        type: string
                    success:
                        type: boolean
                required: [success, channels, count, nextCursor]
                type: object
            permissions:
                - slack:read
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        slack-create-channel:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Create Channel
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    isPrivate:
                        default: false
                        description: Create as private channel
                        type: boolean
                    name:
                        description: New channel name
                        type: string
                required:
                    - name
                type: object
            name: slack-create-channel
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-delete-message:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Delete Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    timestamp:
                        description: Message timestamp to delete
                        type: string
                required:
                    - channel
                    - timestamp
                type: object
            name: slack-delete-message
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        slack-list-users:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack List Users
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    limit:
                        default: 100
                        description: Maximum number of users to return
                        type: integer
                type: object
            name: slack-list-users
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        slack-read-messages:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Read Messages
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    limit:
                        default: 10
                        description: Maximum number of messages to retrieve
                        type: integer
                required:
                    - channel
                type: object
            name: slack-read-messages
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        slack-remove-reaction:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Remove Reaction
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    emoji:
                        description: Reaction emoji name
                        type: string
                    timestamp:
                        description: Message timestamp to remove reaction from
                        type: string
                required:
                    - channel
                    - emoji
                    - timestamp
                type: object
            name: slack-remove-reaction
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-rename-channel:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Rename Channel
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    name:
                        description: New channel name
                        type: string
                required:
                    - channel
                    - name
                type: object
            name: slack-rename-channel
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-send-ephemeral-message:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Send Ephemeral Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    text:
                        description: Message text
                        type: string
                    user:
                        description: User ID to receive the ephemeral message
                        type: string
                required:
                    - channel
                    - text
                    - user
                type: object
            name: slack-send-ephemeral-message
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-send-message:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Send Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    message:
                        description: Message text to send
                        type: string
                    threadTs:
                        description: Thread timestamp for replying in a thread
                        type: string
                required:
                    - channel
                    - message
                type: object
            name: slack-send-message
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-set-channel-purpose:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Set Channel Purpose
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    purpose:
                        description: New channel purpose
                        type: string
                required:
                    - channel
                    - purpose
                type: object
            name: slack-set-channel-purpose
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-set-channel-topic:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Set Channel Topic
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    topic:
                        description: New channel topic
                        type: string
                required:
                    - channel
                    - topic
                type: object
            name: slack-set-channel-topic
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-update-message:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Update Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    text:
                        description: New message text
                        type: string
                    timestamp:
                        description: Message timestamp to update
                        type: string
                required:
                    - channel
                    - text
                    - timestamp
                type: object
            name: slack-update-message
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    conversationAdapters:
        conversations:
            protocolVersion: openseal.conversation.adapter/v1
            name: Slack conversations
            description: Verify Slack Events API requests and deliver durable replies through Slack Web API.
            provider: slack
            endpointModes: [channel, direct]
            inboundEventTypes: [conversation.message.received]
            features: [mentions, threads]
            credentials:
                - name: slack_bot_token
                  kind: slack_bot_token
                  oauth2:
                    provider: slack
                    subject: installation
                    scopes: [app_mentions:read, channels:history, chat:write, groups:history, im:history, mpim:history]
                - name: slack_signing_secret
                  kind: slack_signing_secret
            destinationDiscovery:
                - action: slack-channel-list
                  mode: channel
                  itemsPath: channels
                  idPath: id
                  displayNamePath: name
                  descriptionPath: description
                  cursorArgument: cursor
                  limitArgument: limit
                  queryArgument: query
                  nextCursorPath: nextCursor
            delivery:
                operations: [message.send]
                ordering: thread
                idempotency: required
                supportsAcknowledgementLookup: true
                supportsRetryAfter: true
            transport:
                kind: plugin
                ingressEndpoint: slack.conversation.ingress
                deliveryEndpoint: slack.conversation.deliver
                ingressCredentials: [slack_signing_secret]
                deliveryCredentials: [slack_bot_token]
    callbackAdapters:
        interactions:
            protocolVersion: openseal.callback.adapter/v1
            name: Slack interactions
            description: Verify signed Slack interactions and normalize governed approval decisions.
            provider: slack
            eventTypes: [approval.decided]
            credentials:
                - name: slack_signing_secret
                  kind: slack_signing_secret
            transport:
                kind: plugin
                ingressEndpoint: slack.callback.ingress
                ingressCredentials: [slack_signing_secret]
    category: communication
    description: Send messages and interact with Slack channels
    icon: message-circle
    id: skill-slack
    installers:
        - id: oci
          kind: oci
          label: Slack Skill service image
          package: axiomstudio/skill-slack:2.2.2
    name: Slack Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        identity: https://github.com/axiom-studio/skills::skill-slack
        license: MIT
        publisher: Axiom Studio
        registry: https://github.com/axiom-studio/skills
        reference: skill-slack
        resolvedVersion: 2.2.2
    tags:
        - chat
        - messaging
        - notifications
        - slack
    transport:
        endpoint: skill-slack
        kind: tool
    version: 2.2.2
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
