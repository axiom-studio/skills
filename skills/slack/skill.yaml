apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        slack-add-reaction:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Add Reaction
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    emoji:
                        description: Reaction emoji name
                        type: string
                    timestamp:
                        description: Message timestamp to react to
                        type: string
                required:
                    - channel
                    - emoji
                    - timestamp
                type: object
            name: slack-add-reaction
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-archive-channel:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Archive Channel
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                required:
                    - channel
                type: object
            name: slack-archive-channel
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-channel-list:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Channel List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    types:
                        description: Channel types to filter (public_channel, private_channel)
                        type: string
                type: object
            name: slack-channel-list
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        slack-create-channel:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Create Channel
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    isPrivate:
                        default: false
                        description: Create as private channel
                        type: boolean
                    name:
                        description: New channel name
                        type: string
                required:
                    - name
                type: object
            name: slack-create-channel
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-delete-message:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Delete Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    timestamp:
                        description: Message timestamp to delete
                        type: string
                required:
                    - channel
                    - timestamp
                type: object
            name: slack-delete-message
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        slack-list-users:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack List Users
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    limit:
                        default: 100
                        description: Maximum number of users to return
                        type: integer
                type: object
            name: slack-list-users
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        slack-read-messages:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Read Messages
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    limit:
                        default: 10
                        description: Maximum number of messages to retrieve
                        type: integer
                required:
                    - channel
                type: object
            name: slack-read-messages
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        slack-remove-reaction:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Remove Reaction
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    emoji:
                        description: Reaction emoji name
                        type: string
                    timestamp:
                        description: Message timestamp to remove reaction from
                        type: string
                required:
                    - channel
                    - emoji
                    - timestamp
                type: object
            name: slack-remove-reaction
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-rename-channel:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Rename Channel
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    name:
                        description: New channel name
                        type: string
                required:
                    - channel
                    - name
                type: object
            name: slack-rename-channel
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-send-ephemeral-message:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Send Ephemeral Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    text:
                        description: Message text
                        type: string
                    user:
                        description: User ID to receive the ephemeral message
                        type: string
                required:
                    - channel
                    - text
                    - user
                type: object
            name: slack-send-ephemeral-message
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-send-message:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Send Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    message:
                        description: Message text to send
                        type: string
                    threadTs:
                        description: Thread timestamp for replying in a thread
                        type: string
                required:
                    - channel
                    - message
                type: object
            name: slack-send-message
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-set-channel-purpose:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Set Channel Purpose
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    purpose:
                        description: New channel purpose
                        type: string
                required:
                    - channel
                    - purpose
                type: object
            name: slack-set-channel-purpose
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-set-channel-topic:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Set Channel Topic
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    topic:
                        description: New channel topic
                        type: string
                required:
                    - channel
                    - topic
                type: object
            name: slack-set-channel-topic
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        slack-update-message:
            credentials:
                - kind: slack_bot_token
                  name: slack_bot_token
            description: Slack Update Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channel:
                        description: Slack channel ID or name
                        type: string
                    text:
                        description: New message text
                        type: string
                    timestamp:
                        description: Message timestamp to update
                        type: string
                required:
                    - channel
                    - text
                    - timestamp
                type: object
            name: slack-update-message
            permissions:
                - slack:read
                - slack:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: communication
    description: Send messages and interact with Slack channels
    icon: message-circle
    id: skill-slack
    installers:
        - id: oci
          kind: oci
          label: Slack Skill service image
          package: axiomstudio/skill-slack:1.0.0
    name: Slack Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-slack
        resolvedVersion: 1.0.0
    tags:
        - chat
        - messaging
        - notifications
        - slack
    transport:
        endpoint: skill-slack
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
