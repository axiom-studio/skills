apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        airbyte-connection-create:
            credentials:
                - kind: airbyte-credential
                  name: airbyte-credential
            description: Airbyte Connection Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    configurations:
                        description: Stream configurations
                        type: object
                    destinationId:
                        description: Destination ID
                        type: string
                    sourceId:
                        description: Source ID
                        type: string
                    syncSchedule:
                        description: Sync schedule configuration
                        type: object
                    workspaceId:
                        description: Workspace ID
                        type: string
                required:
                    - destinationId
                    - sourceId
                    - workspaceId
                type: object
            name: airbyte-connection-create
            permissions:
                - airbyte:read
                - airbyte:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        airbyte-connection-list:
            credentials:
                - kind: airbyte-credential
                  name: airbyte-credential
            description: Airbyte Connection List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    workspaceId:
                        description: Workspace ID
                        type: string
                required:
                    - workspaceId
                type: object
            name: airbyte-connection-list
            permissions:
                - airbyte:read
                - airbyte:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airbyte-connection-sync:
            credentials:
                - kind: airbyte-credential
                  name: airbyte-credential
            description: Airbyte Connection Sync
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    connectionId:
                        description: Connection ID
                        type: string
                required:
                    - connectionId
                type: object
            name: airbyte-connection-sync
            permissions:
                - airbyte:read
                - airbyte:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        airbyte-destination-create:
            credentials:
                - kind: airbyte-credential
                  name: airbyte-credential
            description: Airbyte Destination Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    connectionConfiguration:
                        description: Destination-specific configuration
                        type: object
                    destinationDefinitionId:
                        description: Destination definition ID
                        type: string
                    name:
                        description: Destination name
                        type: string
                    workspaceId:
                        description: Workspace ID
                        type: string
                required:
                    - connectionConfiguration
                    - destinationDefinitionId
                    - name
                    - workspaceId
                type: object
            name: airbyte-destination-create
            permissions:
                - airbyte:read
                - airbyte:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        airbyte-destination-list:
            credentials:
                - kind: airbyte-credential
                  name: airbyte-credential
            description: Airbyte Destination List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    workspaceId:
                        description: Workspace ID
                        type: string
                required:
                    - workspaceId
                type: object
            name: airbyte-destination-list
            permissions:
                - airbyte:read
                - airbyte:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airbyte-job-list:
            credentials:
                - kind: airbyte-credential
                  name: airbyte-credential
            description: Airbyte Job List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    connectionId:
                        description: Connection ID to filter jobs
                        type: string
                    limit:
                        default: 10
                        description: Maximum number of jobs to return
                        type: integer
                type: object
            name: airbyte-job-list
            permissions:
                - airbyte:read
                - airbyte:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airbyte-job-status:
            credentials:
                - kind: airbyte-credential
                  name: airbyte-credential
            description: Airbyte Job Status
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    jobId:
                        description: Job ID
                        type: string
                required:
                    - jobId
                type: object
            name: airbyte-job-status
            permissions:
                - airbyte:read
                - airbyte:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airbyte-source-create:
            credentials:
                - kind: airbyte-credential
                  name: airbyte-credential
            description: Airbyte Source Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    connectionConfiguration:
                        description: Source-specific configuration
                        type: object
                    name:
                        description: Source name
                        type: string
                    sourceDefinitionId:
                        description: Source definition ID
                        type: string
                    workspaceId:
                        description: Workspace ID
                        type: string
                required:
                    - connectionConfiguration
                    - name
                    - sourceDefinitionId
                    - workspaceId
                type: object
            name: airbyte-source-create
            permissions:
                - airbyte:read
                - airbyte:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        airbyte-source-list:
            credentials:
                - kind: airbyte-credential
                  name: airbyte-credential
            description: Airbyte Source List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    workspaceId:
                        description: Workspace ID
                        type: string
                required:
                    - workspaceId
                type: object
            name: airbyte-source-list
            permissions:
                - airbyte:read
                - airbyte:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
