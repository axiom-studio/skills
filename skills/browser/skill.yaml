apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        browser-click:
            description: Click one exact element from the latest browser snapshot
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    idempotencyKey:
                        description: Unique key preventing duplicate execution of this exact action
                        maxLength: 128
                        minLength: 8
                        type: string
                    intent:
                        description: Exact externally visible outcome authorized by the caller
                        maxLength: 500
                        minLength: 3
                        type: string
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                    target:
                        description: Exact stable reference returned by the latest snapshot
                        pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'
                        type: string
                    timeoutSeconds:
                        default: 25
                        maximum: 30
                        minimum: 1
                        type: integer
                    writeAuthorized:
                        description: Explicit authorization for this potentially consequential browser mutation
                        type: boolean
                required:
                    - sessionId
                    - target
                    - intent
                    - writeAuthorized
                    - idempotencyKey
                type: object
            name: browser-click
            permissions:
                - browser:interact
                - network:http
            retry:
                maxAttempts: 1
            risk: external
            semanticArguments:
                target: target
            sideEffect: external
        browser-close:
            description: Explicitly close one browser session and its child processes
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                required:
                    - sessionId
                type: object
            name: browser-close
            permissions:
                - browser:session
            retry:
                maxAttempts: 1
            risk: write
            sideEffect: none
        browser-fill:
            description: Clear and fill one exact non-secret form control
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    idempotencyKey:
                        description: Unique key preventing duplicate execution of this exact action
                        maxLength: 128
                        minLength: 8
                        type: string
                    intent:
                        description: Exact purpose and expected effect of filling this control
                        maxLength: 500
                        minLength: 3
                        type: string
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                    target:
                        description: Exact stable reference returned by the latest snapshot
                        pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'
                        type: string
                    timeoutSeconds:
                        default: 25
                        maximum: 30
                        minimum: 1
                        type: integer
                    value:
                        description: Non-secret literal value; passwords, tokens, cookies, and authorization values must use browser-fill-secret
                        maxLength: 20000
                        type: string
                    writeAuthorized:
                        description: Explicit authorization for this potentially consequential browser mutation
                        type: boolean
                required:
                    - sessionId
                    - target
                    - intent
                    - writeAuthorized
                    - idempotencyKey
                    - value
                type: object
            name: browser-fill
            permissions:
                - browser:interact
            retry:
                maxAttempts: 1
            risk: external
            semanticArguments:
                body: value
                target: target
            sideEffect: external
        browser-fill-secret:
            credentials:
                - kind: http_basic_auth
                  name: username
                - kind: http_basic_auth
                  name: password
            description: Fill one exact login control from an authorized HTTP basic authentication credential without exposing its value
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    credentialField:
                        description: Exact field from the authorized credential; the secret value is resolved only for execution
                        enum:
                            - username
                            - password
                        type: string
                    idempotencyKey:
                        description: Unique key preventing duplicate execution of this exact action
                        maxLength: 128
                        minLength: 8
                        type: string
                    intent:
                        description: Exact purpose and expected effect of filling this control
                        maxLength: 500
                        minLength: 3
                        type: string
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                    target:
                        description: Exact stable reference returned by the latest snapshot
                        pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'
                        type: string
                    timeoutSeconds:
                        default: 25
                        maximum: 30
                        minimum: 1
                        type: integer
                    writeAuthorized:
                        description: Explicit authorization to use the bound login credential for this exact destination
                        type: boolean
                required:
                    - sessionId
                    - target
                    - credentialField
                    - intent
                    - writeAuthorized
                    - idempotencyKey
                type: object
            name: browser-fill-secret
            permissions:
                - browser:interact
                - credential:use
            retry:
                maxAttempts: 1
            risk: external
            semanticArguments:
                target: target
            sideEffect: external
        browser-health:
            description: Report service, engine, workspace, proxy, and cleanup readiness
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties: {}
                type: object
            name: browser-health
            permissions:
                - browser:health
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        browser-open:
            description: Create or reuse an isolated session and navigate to a validated HTTP or HTTPS URL
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    profileName:
                        description: Optional persistent named profile within the configured browser workspace
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                    timeoutSeconds:
                        default: 30
                        maximum: 30
                        minimum: 1
                        type: integer
                    url:
                        description: Exact HTTP or HTTPS destination without embedded credentials
                        maxLength: 4096
                        type: string
                    viewportHeight:
                        default: 900
                        maximum: 1080
                        minimum: 320
                        type: integer
                    viewportWidth:
                        default: 1440
                        maximum: 1920
                        minimum: 320
                        type: integer
                required:
                    - sessionId
                    - url
                type: object
            name: browser-open
            permissions:
                - browser:navigate
                - network:http
            retry:
                maxAttempts: 1
            risk: read
            semanticArguments:
                target: url
            sideEffect: read
        browser-read:
            description: Return bounded agent-readable text from the current rendered page
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    maxCharacters:
                        default: 50000
                        maximum: 100000
                        minimum: 1
                        type: integer
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                required:
                    - sessionId
                type: object
            name: browser-read
            permissions:
                - browser:read
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        browser-screenshot:
            description: Return one bounded PNG screenshot when the session is not secret-tainted
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                required:
                    - sessionId
                type: object
            name: browser-screenshot
            permissions:
                - browser:read
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        browser-select:
            description: Select one exact non-secret option in a control from the latest snapshot
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    idempotencyKey:
                        description: Unique key preventing duplicate execution of this exact action
                        maxLength: 128
                        minLength: 8
                        type: string
                    intent:
                        description: Exact purpose and expected effect of changing this selection
                        maxLength: 500
                        minLength: 3
                        type: string
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                    target:
                        description: Exact stable reference returned by the latest snapshot
                        pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'
                        type: string
                    timeoutSeconds:
                        default: 25
                        maximum: 30
                        minimum: 1
                        type: integer
                    value:
                        description: Exact option value to select
                        maxLength: 2000
                        type: string
                    writeAuthorized:
                        description: Explicit authorization for this potentially consequential browser mutation
                        type: boolean
                required:
                    - sessionId
                    - target
                    - value
                    - intent
                    - writeAuthorized
                    - idempotencyKey
                type: object
            name: browser-select
            permissions:
                - browser:interact
            retry:
                maxAttempts: 1
            risk: external
            semanticArguments:
                body: value
                target: target
            sideEffect: external
        browser-session-status:
            description: Report bounded non-secret state for one browser session
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                required:
                    - sessionId
                type: object
            name: browser-session-status
            permissions:
                - browser:session
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        browser-snapshot:
            description: Return a bounded accessibility snapshot with stable generation-scoped element references
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    interactiveOnly:
                        default: false
                        type: boolean
                    maxDepth:
                        default: 8
                        maximum: 12
                        minimum: 1
                        type: integer
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                required:
                    - sessionId
                type: object
            name: browser-snapshot
            permissions:
                - browser:read
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        browser-type:
            description: Type a non-secret literal into one exact control from the latest snapshot
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    idempotencyKey:
                        description: Unique key preventing duplicate execution of this exact action
                        maxLength: 128
                        minLength: 8
                        type: string
                    intent:
                        description: Exact purpose and expected effect of typing this text
                        maxLength: 500
                        minLength: 3
                        type: string
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                    target:
                        description: Exact stable reference returned by the latest snapshot
                        pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'
                        type: string
                    timeoutSeconds:
                        default: 25
                        maximum: 30
                        minimum: 1
                        type: integer
                    value:
                        description: Non-secret literal text; secrets must use browser-fill with credentialField
                        maxLength: 20000
                        type: string
                    writeAuthorized:
                        description: Explicit authorization for this potentially consequential browser mutation
                        type: boolean
                required:
                    - sessionId
                    - target
                    - value
                    - intent
                    - writeAuthorized
                    - idempotencyKey
                type: object
            name: browser-type
            permissions:
                - browser:interact
            retry:
                maxAttempts: 1
            risk: external
            semanticArguments:
                body: value
                target: target
            sideEffect: external
        browser-wait:
            description: Wait for a bounded load state, exact visible text, or duration
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    condition:
                        description: load, text, or duration
                        enum:
                            - load
                            - text
                            - duration
                        type: string
                    loadState:
                        default: domcontentloaded
                        enum:
                            - load
                            - domcontentloaded
                            - networkidle
                        type: string
                    milliseconds:
                        description: Duration to wait when condition is duration
                        maximum: 30000
                        minimum: 1
                        type: integer
                    sessionId:
                        description: Isolated browser session identifier
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
                        type: string
                    text:
                        description: Exact text to wait for when condition is text
                        maxLength: 2000
                        type: string
                    timeoutSeconds:
                        default: 25
                        maximum: 30
                        minimum: 1
                        type: integer
                required:
                    - sessionId
                    - condition
                type: object
            name: browser-wait
            permissions:
                - browser:read
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
    category: browser-automation
    description: Governed durable Chromium navigation and interaction for autonomous agents
    icon: globe
    id: skill-browser
    installers:
        - id: oci
          kind: oci
          label: Browser Skill service image with pinned agent-browser and Chromium
          package: axiomstudio/skill-browser:1.1.9
    name: Browser Skill
    requirements:
        compute:
            limits:
                cpu: 1000m
                memory: 1Gi
            requests:
                cpu: 100m
                memory: 256Mi
        operatingSystems:
            - linux
        storage:
            - durability: persistent
              minimumCapacity: 1Gi
              mountPath: /var/lib/openseal-browser
              name: browser-profile
              retention: retain
              writableGroup: 1001
    source:
        format: axiom.skill/v1
        homepage: https://github.com/vercel-labs/agent-browser
        license: MIT
        publisher: Axiom Studio
        reference: skill-browser
        resolvedVersion: 1.1.9
    tags:
        - accessibility
        - automation
        - browser
        - chromium
        - web
    transport:
        endpoint: skill-browser
        kind: tool
    version: 1.1.9
diagnostics:
    - code: governed_agent_browser
      message: agent-browser is wrapped behind narrow actions and a dial-time SSRF proxy; unrestricted CLI, JavaScript, CDP, storage, cookie, header, executable, and launch-flag controls are not exposed.
      severity: info
kind: SkillDefinition
