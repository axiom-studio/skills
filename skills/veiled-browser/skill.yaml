apiVersion: openseal.dev/v1alpha1
definition:
  actions:
    veiled-browser-health:
      name: veiled-browser-health
      description: Report governed VeilBrowser assessment readiness without exposing target, profile, or proxy configuration.
      inputSchema: {type: object, additionalProperties: false}
      permissions: [browser:session]
      idempotency: supported
      retry: {maxAttempts: 1}
      risk: read
      sideEffect: read
    veiled-browser-start:
      name: veiled-browser-start
      description: Start an isolated persistent VeilBrowser session against one configured target using opaque profile and egress identities.
      inputSchema:
        type: object
        additionalProperties: false
        properties:
          sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
          targetId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
          path: {type: string, pattern: '^/', maxLength: 2048, default: /}
          profileId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
          proxyPoolId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
        required: [sessionId, targetId, profileId, proxyPoolId]
      permissions: [browser:session, network:http]
      idempotency: forbidden
      retry: {maxAttempts: 1}
      risk: read
      sideEffect: read
      timeout: 45000000000
    veiled-browser-snapshot:
      name: veiled-browser-snapshot
      description: Capture a bounded accessibility snapshot and typed access challenges from the current page.
      inputSchema: &session_input
        type: object
        additionalProperties: false
        properties:
          sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
        required: [sessionId]
      permissions: [browser:observe]
      idempotency: supported
      retry: {maxAttempts: 1}
      risk: read
      sideEffect: read
    veiled-browser-click:
      name: veiled-browser-click
      description: Click one exact current snapshot reference without committing a stable external business operation.
      inputSchema: &interaction_input
        type: object
        additionalProperties: false
        properties:
          sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
          target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
          intent: {type: string, minLength: 3, maxLength: 500}
          writeAuthorized: {type: boolean}
          idempotencyKey: {type: string, minLength: 8, maxLength: 128}
        required: [sessionId, target, intent, writeAuthorized, idempotencyKey]
      permissions: [browser:interact, network:http]
      externalOperationPolicy: forbidden
      idempotency: required
      retry: {maxAttempts: 1}
      risk: external
      sideEffect: external
    veiled-browser-commit:
      name: veiled-browser-commit
      description: Click the final control that commits one approved, stable, externally observable operation.
      inputSchema: *interaction_input
      permissions: [browser:interact, network:http]
      externalOperationPolicy: required
      idempotency: required
      retry: {maxAttempts: 1}
      risk: external
      sideEffect: external
    veiled-browser-fill:
      name: veiled-browser-fill
      description: Clear and fill one exact current non-secret control using VeilBrowser input.
      inputSchema:
        type: object
        additionalProperties: false
        properties:
          sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
          target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
          value: {type: string, maxLength: 20000}
          intent: {type: string, minLength: 3, maxLength: 500}
          writeAuthorized: {type: boolean}
          idempotencyKey: {type: string, minLength: 8, maxLength: 128}
        required: [sessionId, target, value, intent, writeAuthorized, idempotencyKey]
      permissions: [browser:interact]
      externalOperationPolicy: forbidden
      idempotency: required
      retry: {maxAttempts: 1}
      risk: external
      sideEffect: external
      semanticArguments: {body: value, target: target}
    veiled-browser-fill-secret:
      name: veiled-browser-fill-secret
      description: Fill one exact login control from an authorized credential binding without exposing the value.
      credentials:
        - {kind: http_basic_auth, name: username}
        - {kind: http_basic_auth, name: password}
      inputSchema:
        type: object
        additionalProperties: false
        properties:
          sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
          target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
          credentialField: {type: string, enum: [username, password]}
          intent: {type: string, minLength: 3, maxLength: 500}
          writeAuthorized: {type: boolean}
          idempotencyKey: {type: string, minLength: 8, maxLength: 128}
        required: [sessionId, target, credentialField, intent, writeAuthorized, idempotencyKey]
      permissions: [browser:interact, credential:use]
      externalOperationPolicy: forbidden
      idempotency: required
      retry: {maxAttempts: 1}
      risk: external
      sideEffect: external
      semanticArguments: {target: target}
    veiled-browser-solve-synthetic:
      name: veiled-browser-solve-synthetic
      description: Exercise one configured synthetic challenge on a platform-owned assessment target.
      inputSchema:
        type: object
        additionalProperties: false
        properties:
          sessionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
          challengeId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
          target: {type: string, pattern: '^s[1-9][0-9]*:e[1-9][0-9]*$'}
          attestation: {type: string, enum: [authorized-platform-test]}
        required: [sessionId, challengeId, target, attestation]
      permissions: [browser:interact, security:test]
      externalOperationPolicy: forbidden
      idempotency: forbidden
      retry: {maxAttempts: 1}
      risk: write
      sideEffect: external
    veiled-browser-report:
      name: veiled-browser-report
      description: Return accepted, challenged, or blocked outcome evidence without revealing fingerprint, proxy, cookie, or credential values.
      inputSchema: *session_input
      permissions: [browser:observe, security:report]
      idempotency: supported
      retry: {maxAttempts: 1}
      risk: read
      sideEffect: read
    veiled-browser-close:
      name: veiled-browser-close
      description: Close an isolated assessment session while preserving its configured browser profile.
      inputSchema: *session_input
      permissions: [browser:session]
      idempotency: supported
      retry: {maxAttempts: 1}
      risk: write
      sideEffect: none
  category: security
  description: Governed VeilBrowser automation and platform-owned anti-bot assessment using opaque authorized targets, profiles, egress identities, and synthetic challenges.
  icon: shield
  id: skill-veiled-browser
  installers:
    - id: oci
      kind: oci
      label: Veiled Browser Skill service image with pinned VeilBrowser and Chromium
      package: axiomstudio/skill-veiled-browser:1.0.0
  name: Veiled Browser Skill
  prompt:
    allowedTools:
      - veiled-browser-health
      - veiled-browser-start
      - veiled-browser-snapshot
      - veiled-browser-click
      - veiled-browser-commit
      - veiled-browser-fill
      - veiled-browser-fill-secret
      - veiled-browser-solve-synthetic
      - veiled-browser-report
      - veiled-browser-close
    instructions: Use only configured target, profile, proxy-pool, and challenge identifiers. Take a new snapshot after every interaction. Use veiled-browser-commit only for the final approved external operation. A third-party access challenge requires human completion; synthetic solving is restricted to platform-owned assessment targets.
    userInvocable: true
  requirements:
    compute:
      limits: {cpu: 2000m, memory: 2Gi}
      requests: {cpu: 250m, memory: 512Mi}
    operatingSystems: [linux]
    storage:
      - name: veiled-browser-profile
        durability: persistent
        minimumCapacity: 2Gi
        mountPath: /var/lib/openseal-veiled-browser
        retention: retain
        writableGroup: 1000
  source:
    format: axiom.skill/v1
    homepage: https://github.com/acunningham-ship-it/veilbrowser
    license: MIT
    publisher: Axiom Studio
    reference: skill-veiled-browser
    resolvedVersion: 1.0.0
  tags: [anti-bot-testing, browser, chromium, security, veilbrowser]
  transport:
    endpoint: skill-veiled-browser
    kind: tool
  version: 1.0.0
diagnostics:
  - code: governed_veilbrowser
    severity: info
    message: VeilBrowser runs behind opaque target, profile, egress, credential, approval, and challenge policy. Raw JavaScript, CDP, cookies, headers, filesystem, and launch arguments are not public actions.
kind: SkillDefinition
