apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        sf-copy:
            credentials:
                - kind: snowflake-credential
                  name: snowflake-credential
            description: Sf Copy
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    account:
                        description: Snowflake account identifier
                        type: string
                    database:
                        description: Database name
                        type: string
                    direction:
                        description: into_table (load) or from_table (unload)
                        type: string
                    fileFormat:
                        description: File format specification
                        type: string
                    filePath:
                        description: File path in stage
                        type: string
                    onError:
                        description: Error handling (CONTINUE, SKIP_FILE, ABORT_STATEMENT)
                        type: string
                    schema:
                        description: Schema name
                        type: string
                    stageName:
                        description: Stage name
                        type: string
                    tableName:
                        description: Target/source table name
                        type: string
                    user:
                        description: Snowflake username
                        type: string
                    validationMode:
                        description: Validation mode
                        type: string
                    warehouse:
                        description: Warehouse to use
                        type: string
                required:
                    - account
                    - database
                    - direction
                    - schema
                    - stageName
                    - tableName
                    - user
                    - warehouse
                type: object
            name: sf-copy
            permissions:
                - snowflake:read
                - snowflake:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        sf-query:
            credentials:
                - kind: snowflake-credential
                  name: snowflake-credential
            description: Sf Query
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    account:
                        description: Snowflake account identifier
                        type: string
                    args:
                        description: Query parameters
                        type: object
                    database:
                        description: Database name
                        type: string
                    query:
                        description: SQL query to execute
                        type: string
                    role:
                        description: Role to use
                        type: string
                    schema:
                        description: Schema name
                        type: string
                    user:
                        description: Snowflake username
                        type: string
                    warehouse:
                        description: Warehouse to use
                        type: string
                required:
                    - account
                    - database
                    - query
                    - schema
                    - user
                    - warehouse
                type: object
            name: sf-query
            permissions:
                - snowflake:read
                - snowflake:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        sf-stage:
            credentials:
                - kind: snowflake-credential
                  name: snowflake-credential
            description: Sf Stage
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    account:
                        description: Snowflake account identifier
                        type: string
                    action:
                        description: Action (create, drop, list, describe)
                        type: string
                    database:
                        description: Database name
                        type: string
                    fileFormat:
                        description: File format name
                        type: string
                    schema:
                        description: Schema name
                        type: string
                    stageName:
                        description: Stage name
                        type: string
                    stageType:
                        default: internal
                        description: internal or external
                        type: string
                    url:
                        description: External stage URL
                        type: string
                    user:
                        description: Snowflake username
                        type: string
                required:
                    - account
                    - action
                    - database
                    - schema
                    - stageName
                    - user
                type: object
            name: sf-stage
            permissions:
                - snowflake:read
                - snowflake:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        sf-stream:
            credentials:
                - kind: snowflake-credential
                  name: snowflake-credential
            description: Sf Stream
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    account:
                        description: Snowflake account identifier
                        type: string
                    action:
                        description: Action (create, drop, describe, consume)
                        type: string
                    appendOnly:
                        default: false
                        description: Create append-only stream
                        type: boolean
                    database:
                        description: Database name
                        type: string
                    schema:
                        description: Schema name
                        type: string
                    showInitial:
                        default: false
                        description: Show initial rows
                        type: boolean
                    streamName:
                        description: Stream name
                        type: string
                    tableName:
                        description: Source table name (for create)
                        type: string
                    user:
                        description: Snowflake username
                        type: string
                required:
                    - account
                    - action
                    - database
                    - schema
                    - streamName
                    - user
                type: object
            name: sf-stream
            permissions:
                - snowflake:read
                - snowflake:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        sf-warehouse:
            credentials:
                - kind: snowflake-credential
                  name: snowflake-credential
            description: Sf Warehouse
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    account:
                        description: Snowflake account identifier
                        type: string
                    action:
                        description: Action (start, stop, resume, suspend, status, resize)
                        type: string
                    autoResume:
                        default: true
                        description: Enable auto-resume
                        type: boolean
                    autoSuspend:
                        description: Auto-suspend time in minutes
                        type: integer
                    database:
                        description: Database name
                        type: string
                    size:
                        description: Warehouse size for resize
                        type: string
                    user:
                        description: Snowflake username
                        type: string
                    warehouse:
                        description: Warehouse name
                        type: string
                required:
                    - account
                    - action
                    - database
                    - user
                    - warehouse
                type: object
            name: sf-warehouse
            permissions:
                - snowflake:read
                - snowflake:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: data
    description: Snowflake data warehouse operations
    icon: database
    id: skill-snowflake
    installers:
        - id: oci
          kind: oci
          label: Snowflake Skill service image
          package: axiomstudio/skill-snowflake:1.0.0
    name: Snowflake Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-snowflake
        resolvedVersion: 1.0.0
    tags:
        - analytics
        - data-warehouse
        - snowflake
        - sql
    transport:
        endpoint: skill-snowflake
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
