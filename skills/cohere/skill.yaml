apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        cohere-chat:
            credentials:
                - kind: cohere-credential
                  name: cohere-credential
            description: Cohere Chat
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    chatHistory:
                        description: Chat history
                        type: string
                    message:
                        description: User message
                        type: string
                    model:
                        description: Model name
                        type: string
                    preamble:
                        description: System preamble
                        type: string
                    temperature:
                        default: 0.7
                        description: Sampling temperature
                        type: number
                required:
                    - message
                type: object
            name: cohere-chat
            permissions:
                - cohere:read
                - cohere:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        cohere-classify:
            credentials:
                - kind: cohere-credential
                  name: cohere-credential
            description: Cohere Classify
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    examples:
                        description: Classification examples
                        type: string
                    inputs:
                        description: Texts to classify
                        type: string
                    model:
                        description: Classification model
                        type: string
                required:
                    - examples
                    - inputs
                type: object
            name: cohere-classify
            permissions:
                - cohere:read
                - cohere:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        cohere-detect-language:
            credentials:
                - kind: cohere-credential
                  name: cohere-credential
            description: Cohere Detect Language
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    text:
                        description: Text to detect language
                        type: string
                required:
                    - text
                type: object
            name: cohere-detect-language
            permissions:
                - cohere:read
                - cohere:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        cohere-embed:
            credentials:
                - kind: cohere-credential
                  name: cohere-credential
            description: Cohere Embed
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    model:
                        default: embed-english-v3.0
                        description: Embedding model
                        type: string
                    texts:
                        description: Texts to embed
                        type: string
                    truncate:
                        description: Truncate strategy
                        type: string
                required:
                    - texts
                type: object
            name: cohere-embed
            permissions:
                - cohere:read
                - cohere:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        cohere-generate:
            credentials:
                - kind: cohere-credential
                  name: cohere-credential
            description: Cohere Generate
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    k:
                        description: Top-k sampling
                        type: integer
                    maxTokens:
                        description: Maximum tokens to generate
                        type: integer
                    model:
                        default: command
                        description: Model name
                        type: string
                    p:
                        description: Top-p sampling
                        type: number
                    prompt:
                        description: Input prompt
                        type: string
                    stopSequences:
                        description: Stop sequences
                        type: string
                    temperature:
                        default: 0.7
                        description: Sampling temperature
                        type: number
                required:
                    - prompt
                type: object
            name: cohere-generate
            permissions:
                - cohere:read
                - cohere:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        cohere-rerank:
            credentials:
                - kind: cohere-credential
                  name: cohere-credential
            description: Cohere Rerank
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    documents:
                        description: Documents to rerank
                        type: string
                    model:
                        default: rerank-english-v3.0
                        description: Rerank model
                        type: string
                    query:
                        description: Search query
                        type: string
                    topN:
                        default: 10
                        description: Number of top results to return
                        type: integer
                required:
                    - documents
                    - query
                type: object
            name: cohere-rerank
            permissions:
                - cohere:read
                - cohere:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        cohere-summarize:
            credentials:
                - kind: cohere-credential
                  name: cohere-credential
            description: Cohere Summarize
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    format:
                        default: paragraph
                        description: Output format (paragraph, bullets)
                        type: string
                    length:
                        default: medium
                        description: Summary length (short, medium, long)
                        type: string
                    model:
                        description: Summarization model
                        type: string
                    text:
                        description: Text to summarize
                        type: string
                required:
                    - text
                type: object
            name: cohere-summarize
            permissions:
                - cohere:read
                - cohere:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        cohere-tokenize:
            credentials:
                - kind: cohere-credential
                  name: cohere-credential
            description: Cohere Tokenize
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    model:
                        description: Tokenizer model
                        type: string
                    text:
                        description: Text to tokenize
                        type: string
                required:
                    - text
                type: object
            name: cohere-tokenize
            permissions:
                - cohere:read
                - cohere:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: ai
    description: Cohere AI language model operations for Atlas agents
    icon: cpu
    id: skill-cohere
    installers:
        - id: oci
          kind: oci
          label: Cohere Skill service image
          package: axiomstudio/skill-cohere:1.0.0
    name: Cohere Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-cohere
        resolvedVersion: 1.0.0
    tags:
        - ai
        - cohere
        - llm
        - nlp
    transport:
        endpoint: skill-cohere
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
