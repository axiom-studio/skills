apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        s3-bucket-create:
            credentials:
                - kind: s3-credential
                  name: s3-credential
            description: S3 Bucket Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    bucket:
                        description: Bucket name
                        type: string
                    region:
                        description: AWS region
                        type: string
                required:
                    - bucket
                type: object
            name: s3-bucket-create
            permissions:
                - s3:read
                - s3:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        s3-bucket-delete:
            credentials:
                - kind: s3-credential
                  name: s3-credential
            description: S3 Bucket Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    bucket:
                        description: Bucket name
                        type: string
                required:
                    - bucket
                type: object
            name: s3-bucket-delete
            permissions:
                - s3:read
                - s3:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        s3-copy-object:
            credentials:
                - kind: s3-credential
                  name: s3-credential
            description: S3 Copy Object
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    destinationBucket:
                        description: Destination bucket name
                        type: string
                    destinationKey:
                        description: Destination object key
                        type: string
                    sourceBucket:
                        description: Source bucket name
                        type: string
                    sourceKey:
                        description: Source object key
                        type: string
                required:
                    - destinationBucket
                    - destinationKey
                    - sourceBucket
                    - sourceKey
                type: object
            name: s3-copy-object
            permissions:
                - s3:read
                - s3:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        s3-delete:
            credentials:
                - kind: s3-credential
                  name: s3-credential
            description: S3 Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    bucket:
                        description: Bucket name
                        type: string
                    key:
                        description: Object key (omit for bucket deletion)
                        type: string
                required:
                    - bucket
                type: object
            name: s3-delete
            permissions:
                - s3:read
                - s3:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        s3-download:
            credentials:
                - kind: s3-credential
                  name: s3-credential
            description: S3 Download
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    bucket:
                        description: Bucket name
                        type: string
                    key:
                        description: Object key
                        type: string
                required:
                    - bucket
                    - key
                type: object
            name: s3-download
            permissions:
                - s3:read
                - s3:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        s3-list-buckets:
            credentials:
                - kind: s3-credential
                  name: s3-credential
            description: S3 List Buckets
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    region:
                        description: AWS region
                        type: string
                type: object
            name: s3-list-buckets
            permissions:
                - s3:read
                - s3:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        s3-list-objects:
            credentials:
                - kind: s3-credential
                  name: s3-credential
            description: S3 List Objects
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    bucket:
                        description: Bucket name
                        type: string
                    delimiter:
                        description: Delimiter for grouping
                        type: string
                    maxKeys:
                        description: Max keys to return
                        type: integer
                    prefix:
                        description: Key prefix filter
                        type: string
                required:
                    - bucket
                type: object
            name: s3-list-objects
            permissions:
                - s3:read
                - s3:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        s3-presign:
            credentials:
                - kind: s3-credential
                  name: s3-credential
            description: S3 Presign
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    bucket:
                        description: Bucket name
                        type: string
                    expiresIn:
                        default: 3600
                        description: URL expiry seconds
                        type: integer
                    key:
                        description: Object key
                        type: string
                    operation:
                        default: get
                        description: get/put object
                        type: string
                required:
                    - bucket
                    - key
                type: object
            name: s3-presign
            permissions:
                - s3:read
                - s3:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        s3-upload:
            credentials:
                - kind: s3-credential
                  name: s3-credential
            description: S3 Upload
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    acl:
                        description: ACL (private, public-read, etc.)
                        type: string
                    bucket:
                        description: Bucket name
                        type: string
                    content:
                        description: File content (text or base64)
                        type: string
                    contentType:
                        description: Content type
                        type: string
                    key:
                        description: Object key
                        type: string
                    metadata:
                        description: User metadata
                        type: object
                required:
                    - bucket
                    - content
                    - key
                type: object
            name: s3-upload
            permissions:
                - s3:read
                - s3:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: storage
    description: AWS S3 object storage operations for Atlas agents
    icon: hard-drive
    id: skill-s3
    installers:
        - id: oci
          kind: oci
          label: AWS S3 Skill service image
          package: axiomstudio/skill-s3:1.0.0
    name: AWS S3 Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-s3
        resolvedVersion: 1.0.0
    tags:
        - aws
        - objects
        - s3
        - storage
    transport:
        endpoint: skill-s3
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
