apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        telegram-delete-message:
            credentials:
                - kind: telegram_bot
                  name: telegram_bot
            description: Telegram Delete Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    chatId:
                        description: Chat ID
                        type: string
                    messageId:
                        description: Message ID to delete
                        type: integer
                required:
                    - chatId
                    - messageId
                type: object
            name: telegram-delete-message
            permissions:
                - telegram:read
                - telegram:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        telegram-edit-message:
            credentials:
                - kind: telegram_bot
                  name: telegram_bot
            description: Telegram Edit Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    chatId:
                        description: Chat ID
                        type: string
                    messageId:
                        description: Message ID to edit
                        type: integer
                    parseMode:
                        description: Parse mode
                        type: string
                    text:
                        description: New message text
                        type: string
                required:
                    - chatId
                    - messageId
                    - text
                type: object
            name: telegram-edit-message
            permissions:
                - telegram:read
                - telegram:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        telegram-get-chat:
            credentials:
                - kind: telegram_bot
                  name: telegram_bot
            description: Telegram Get Chat
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    chatId:
                        description: Chat ID
                        type: string
                required:
                    - chatId
                type: object
            name: telegram-get-chat
            permissions:
                - telegram:read
                - telegram:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        telegram-get-updates:
            credentials:
                - kind: telegram_bot
                  name: telegram_bot
            description: Telegram Get Updates
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    limit:
                        description: Max updates to return
                        type: integer
                    offset:
                        description: Offset for updates
                        type: integer
                    timeout:
                        description: Long polling timeout
                        type: integer
                type: object
            name: telegram-get-updates
            permissions:
                - telegram:read
                - telegram:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        telegram-send-document:
            credentials:
                - kind: telegram_bot
                  name: telegram_bot
            description: Telegram Send Document
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    caption:
                        description: Document caption
                        type: string
                    chatId:
                        description: Chat ID
                        type: string
                    document:
                        description: Document URL or file ID
                        type: string
                required:
                    - chatId
                    - document
                type: object
            name: telegram-send-document
            permissions:
                - telegram:read
                - telegram:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        telegram-send-message:
            credentials:
                - kind: telegram_bot
                  name: telegram_bot
            description: Telegram Send Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    chatId:
                        description: Chat ID or username
                        type: string
                    disableNotification:
                        default: false
                        description: Disable notifications
                        type: boolean
                    parseMode:
                        description: Parse mode (HTML, Markdown)
                        type: string
                    replyToMessageId:
                        description: Reply to message ID
                        type: integer
                    text:
                        description: Message text
                        type: string
                required:
                    - chatId
                    - text
                type: object
            name: telegram-send-message
            permissions:
                - telegram:read
                - telegram:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        telegram-send-photo:
            credentials:
                - kind: telegram_bot
                  name: telegram_bot
            description: Telegram Send Photo
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    caption:
                        description: Photo caption
                        type: string
                    chatId:
                        description: Chat ID
                        type: string
                    photo:
                        description: Photo URL or file ID
                        type: string
                required:
                    - chatId
                    - photo
                type: object
            name: telegram-send-photo
            permissions:
                - telegram:read
                - telegram:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        telegram-set-webhook:
            credentials:
                - kind: telegram_bot
                  name: telegram_bot
            description: Telegram Set Webhook
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    url:
                        description: Webhook URL
                        type: string
                required:
                    - url
                type: object
            name: telegram-set-webhook
            permissions:
                - telegram:read
                - telegram:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
