        okta-app-assign-user:
            credentials:
                - kind: okta-credential
                  name: okta-credential
            description: Okta App Assign User
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    appId:
                        description: Application ID
                        type: string
                    orgUrl:
                        description: Okta organization URL
                        type: string
                    userId:
                        description: User ID
                        type: string
                required:
                    - appId
                    - orgUrl
                    - userId
                type: object
            name: okta-app-assign-user
            permissions:
                - okta:read
                - okta:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
