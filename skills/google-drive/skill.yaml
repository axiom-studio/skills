apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        gdrive-delete:
            credentials:
                - kind: google-drive-credential
                  name: google-drive-credential
            description: Gdrive Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    fileId:
                        description: File ID
                        type: string
                required:
                    - fileId
                type: object
            name: gdrive-delete
            permissions:
                - googledrive:read
                - googledrive:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        gdrive-download:
            credentials:
                - kind: google-drive-credential
                  name: google-drive-credential
            description: Gdrive Download
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    fileId:
                        description: File ID
                        type: string
                required:
                    - fileId
                type: object
            name: gdrive-download
            permissions:
                - googledrive:read
                - googledrive:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gdrive-folder-create:
            credentials:
                - kind: google-drive-credential
                  name: google-drive-credential
            description: Gdrive Folder Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    name:
                        description: Folder name
                        type: string
                    parentId:
                        description: Parent folder ID
                        type: string
                required:
                    - name
                type: object
            name: gdrive-folder-create
            permissions:
                - googledrive:read
                - googledrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        gdrive-list:
            credentials:
                - kind: google-drive-credential
                  name: google-drive-credential
            description: Gdrive List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    pageSize:
                        default: 100
                        description: Max results
                        type: integer
                    parentId:
                        default: root
                        description: Parent folder ID
                        type: string
                    query:
                        description: Search query
                        type: string
                type: object
            name: gdrive-list
            permissions:
                - googledrive:read
                - googledrive:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gdrive-permission-list:
            credentials:
                - kind: google-drive-credential
                  name: google-drive-credential
            description: Gdrive Permission List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    fileId:
                        description: File ID
                        type: string
                required:
                    - fileId
                type: object
            name: gdrive-permission-list
            permissions:
                - googledrive:read
                - googledrive:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gdrive-search:
            credentials:
                - kind: google-drive-credential
                  name: google-drive-credential
            description: Gdrive Search
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    pageSize:
                        default: 100
                        description: Max results
                        type: integer
                    query:
                        description: Search query
                        type: string
                required:
                    - query
                type: object
            name: gdrive-search
            permissions:
                - googledrive:read
                - googledrive:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gdrive-share:
            credentials:
                - kind: google-drive-credential
                  name: google-drive-credential
            description: Gdrive Share
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    email:
                        description: User email
                        type: string
                    fileId:
                        description: File ID
                        type: string
                    role:
                        description: Role (reader, writer, commenter)
                        type: string
                    type:
                        default: user
                        description: Type (user, group, domain, anyone)
                        type: string
                required:
                    - email
                    - fileId
                    - role
                type: object
            name: gdrive-share
            permissions:
                - googledrive:read
                - googledrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        gdrive-upload:
            credentials:
                - kind: google-drive-credential
                  name: google-drive-credential
            description: Gdrive Upload
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    content:
                        description: File content (base64)
                        type: string
                    mimeType:
                        default: application/octet-stream
                        description: MIME type
                        type: string
                    name:
                        description: File name
                        type: string
                    parentId:
                        description: Parent folder ID
                        type: string
                required:
                    - content
                    - name
                type: object
            name: gdrive-upload
            permissions:
                - googledrive:read
                - googledrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: storage
    description: Google Drive file storage operations for Atlas agents
