apiVersion: openseal.dev/v1alpha1
definition:
  actions:
    render_pdf:
      description: Render a title and report body as a PDF artifact.
      emittedArtifactTypes:
      - report
      idempotency: required
      inputSchema:
        additionalProperties: false
        properties:
          body:
            maxLength: 500000
            minLength: 1
            type: string
          filename:
            pattern: ^[^/\\]{1,240}\.pdf$
            type: string
          requirementName:
            maxLength: 128
            minLength: 1
            type: string
          sources:
            items:
              format: uri
              type: string
            maxItems: 100
            type: array
          title:
            maxLength: 300
            minLength: 1
            type: string
        required:
        - title
        - body
        - filename
        - requirementName
        type: object
      name: render_pdf
      outputSchema:
        additionalProperties: false
        properties:
          artifactRefs:
            items:
              additionalProperties: false
              properties:
                id:
                  type: string
                requirementName:
                  type: string
                version:
                  minimum: 1
                  type: integer
              required:
              - id
              - version
              - requirementName
              type: object
            maxItems: 1
            minItems: 1
            type: array
          pages:
            minimum: 1
            type: integer
        required:
        - artifactRefs
        - pages
        type: object
      retry:
        maxAttempts: 1
      risk: write
      sideEffect: write
  category: documents
  description: Render durable reports into governed PDF artifacts.
  icon: file-text
  id: openseal.document
  installers:
  - id: oci
    kind: oci
    label: Document renderer service image
    package: axiomstudio/skill-openseal-document:1.0.2
  name: Document renderer
  prompt:
    allowedTools:
    - render_pdf
    instructions: Use render_pdf when work requires a durable PDF deliverable. Cite
      sources in the body before rendering.
    userInvocable: true
  requirements:
    alwaysAvailable: true
  tags:
  - pdf
  - report
  - artifact
  transport:
    endpoint: openseal.document
    kind: tool
  version: 1.0.2
kind: SkillDefinition
