apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        heygen-create-video:
            credentials:
                - kind: heygen-credential
                  name: heygen-credential
            description: Heygen Create Video
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    aspectRatio:
                        default: "16:9"
                        description: Output video aspect ratio
                        type: string
                    avatarId:
                        description: HeyGen avatar ID
                        type: string
                    callbackUrl:
                        description: Webhook URL to receive completion notification
                        type: string
                    idempotencyKey:
                        description: Optional idempotency key for safe retries
                        type: string
                    resolution:
                        default: 1080p
                        description: Output video resolution
                        type: string
                    script:
                        description: Text script for the avatar to speak
                        type: string
                    title:
                        description: Display title for the video
                        type: string
                    voiceId:
                        description: Optional voice ID for text-to-speech
                        type: string
                required:
                    - avatarId
                    - script
                type: object
            name: heygen-create-video
            permissions:
                - heygen:video:create
                - heygen:video:read
                - heygen:voice:read
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        heygen-get-video:
            credentials:
                - kind: heygen-credential
                  name: heygen-credential
            description: Heygen Get Video
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    videoId:
                        description: Video ID to retrieve
                        type: string
                required:
                    - videoId
                type: object
            name: heygen-get-video
            permissions:
                - heygen:video:create
                - heygen:video:read
                - heygen:voice:read
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        heygen-list-voices:
            credentials:
                - kind: heygen-credential
                  name: heygen-credential
            description: Heygen List Voices
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    engine:
                        description: Optional voice engine filter
                        type: string
                    gender:
                        description: Optional gender filter
                        type: string
                    language:
                        description: Optional language filter
                        type: string
                    limit:
                        default: 20
                        description: Results per page
                        type: integer
                    type:
                        default: public
                        description: Voice type, public or private
                        type: string
                type: object
            name: heygen-list-voices
            permissions:
                - heygen:video:create
                - heygen:video:read
                - heygen:voice:read
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
    category: ai
    description: HeyGen avatar video generation and voice discovery for Atlas agents
    icon: video
    id: skill-heygen
    installers:
        - id: oci
          kind: oci
          label: HeyGen Skill service image
          package: axiomstudio/skill-heygen:1.0.0
    name: HeyGen Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-heygen
        resolvedVersion: 1.0.0
    tags:
        - ai
        - avatar
        - heygen
        - video
    transport:
        endpoint: skill-heygen
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
