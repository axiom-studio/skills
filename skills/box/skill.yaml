apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        box-delete:
            credentials:
                - kind: box-credential
                  name: box-credential
            description: Box Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    fileId:
                        description: File or folder ID to delete
                        type: string
                required:
                    - fileId
                type: object
            name: box-delete
            permissions:
                - box:read
                - box:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        box-download:
            credentials:
                - kind: box-credential
                  name: box-credential
            description: Box Download
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    fileId:
                        description: File ID to download
                        type: string
                required:
                    - fileId
                type: object
            name: box-download
            permissions:
                - box:read
                - box:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        box-folder-create:
            credentials:
                - kind: box-credential
                  name: box-credential
            description: Box Folder Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    name:
                        description: Folder name
                        type: string
                    parentFolderId:
                        default: "0"
                        description: Parent folder ID
                        type: string
                required:
                    - name
                type: object
            name: box-folder-create
            permissions:
                - box:read
                - box:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        box-list:
            credentials:
                - kind: box-credential
                  name: box-credential
            description: Box List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    folderId:
                        default: "0"
                        description: 'Folder ID (default: 0 for root)'
                        type: string
                    limit:
                        default: 100
                        description: Maximum results to return
                        type: integer
                    offset:
                        default: 0
                        description: Pagination offset
                        type: integer
                type: object
            name: box-list
            permissions:
                - box:read
                - box:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        box-metadata-get:
            credentials:
                - kind: box-credential
                  name: box-credential
            description: Box Metadata Get
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    fileId:
                        description: File ID
                        type: string
                required:
                    - fileId
                type: object
            name: box-metadata-get
            permissions:
                - box:read
                - box:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        box-search:
            credentials:
                - kind: box-credential
                  name: box-credential
            description: Box Search
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    limit:
                        default: 20
                        description: Maximum results
                        type: integer
                    query:
                        description: Search query
                        type: string
                required:
                    - query
                type: object
            name: box-search
            permissions:
                - box:read
                - box:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        box-share:
            credentials:
                - kind: box-credential
                  name: box-credential
            description: Box Share
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    access:
                        default: open
                        description: Access level (open, company, collaborators)
                        type: string
                    fileId:
                        description: File or folder ID
                        type: string
                    permissions:
                        description: Link permissions
                        type: object
                required:
                    - fileId
                type: object
            name: box-share
            permissions:
                - box:read
                - box:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        box-upload:
            credentials:
                - kind: box-credential
                  name: box-credential
            description: Box Upload
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    content:
                        description: File content (base64 encoded)
                        type: string
                    filename:
                        description: File name
                        type: string
                    folderId:
                        description: Destination folder ID
                        type: string
                required:
                    - content
                    - filename
                    - folderId
                type: object
            name: box-upload
            permissions:
                - box:read
                - box:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: storage
    description: Box file storage operations for Atlas agents
    icon: archive
    id: skill-box
    installers:
        - id: oci
          kind: oci
          label: Box Skill service image
          package: axiomstudio/skill-box:1.0.0
    name: Box Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-box
        resolvedVersion: 1.0.0
    tags:
        - box
        - enterprise
        - files
        - storage
    transport:
        endpoint: skill-box
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
