apiVersion: openseal.dev/v1alpha1
definition:
  actions:
    post_reply:
      description: Post one reviewed follow-up to the exact evidence source URL.
      emittedEventTypes:
      - outreach.reply.accepted
      idempotency: required
      inputSchema:
        additionalProperties: false
        properties:
          body:
            maxLength: 20000
            minLength: 1
            type: string
          targetUri:
            format: uri
            maxLength: 2000
            pattern: ^https://
            type: string
        required:
        - targetUri
        - body
        type: object
      name: post_reply
      outputSchema:
        additionalProperties: false
        properties:
          outreachReceipt:
            additionalProperties: false
            properties:
              deliveredAt:
                format: date-time
                type: string
              digest:
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              externalId:
                maxLength: 512
                minLength: 1
                type: string
              externalUri:
                format: uri
                maxLength: 2000
                pattern: ^https://
                type: string
              provider:
                const: http-webhook
                type: string
            required:
            - provider
            - externalId
            - externalUri
            - deliveredAt
            - digest
            type: object
        required:
        - outreachReceipt
        type: object
      permissions:
      - network:https:write
      - communications:source:reply
      retry:
        maxAttempts: 1
      risk: external
      semanticArguments:
        body: body
        target: targetUri
      sideEffect: external
      timeout: 30000000000
  category: communication
  description: Post a reviewed, identity-disclosed reply to an evidence-linked webhook-compatible
    source.
  icon: message-circle
  id: openseal.outreach
  installers:
  - id: oci
    kind: oci
    label: Governed outreach service image
    package: axiomstudio/skill-openseal-outreach:1.0.2
  name: Governed source outreach
  prompt:
    allowedTools:
    - post_reply
    instructions: Use post_reply only inside a governed OutreachThread after source
      policy and approval are satisfied. Preserve the reviewed body, truthful identity
      disclosure, and exact evidence URL.
    userInvocable: true
  requirements:
    alwaysAvailable: true
  tags:
  - outreach
  - webhook
  - approval
  - research
  transport:
    endpoint: openseal.outreach
    kind: tool
  version: 1.0.2
kind: SkillDefinition
