            description: Gcp Storage Download
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    bucket:
                        description: Bucket name
                        type: string
                    objectName:
                        description: Object name to download
                        type: string
                    projectId:
                        description: GCP project ID
                        type: string
                required:
                    - bucket
                    - objectName
                    - projectId
                type: object
            name: gcp-storage-download
            permissions:
                - gcp:read
                - gcp:write
            retry:
                maxAttempts: 1
