                additionalProperties: false
                properties:
                    clusterName:
                        description: Cluster name
                        type: string
                    projectId:
                        description: GCP project ID
                        type: string
                    region:
                        description: Cluster region/zone
                        type: string
                required:
                    - clusterName
                    - projectId
                    - region
                type: object
            name: gcp-gke-get-credentials
            permissions:
                - gcp:read
                - gcp:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gcp-gke-list:
            credentials:
                - kind: gcp_credentials
