        gcp-pubsub-subscribe:
            credentials:
                - kind: gcp_credentials
                  name: gcp_credentials
            description: Gcp Pubsub Subscribe
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    ack:
                        default: true
                        description: Auto-acknowledge messages
                        type: boolean
                    maxMessages:
                        default: 10
                        description: Max messages to pull
                        type: integer
                    projectId:
                        description: GCP project ID
                        type: string
                    subscription:
                        description: Subscription name
                        type: string
                required:
                    - projectId
