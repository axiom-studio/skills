        gcp-storage-upload:
            credentials:
                - kind: gcp_credentials
                  name: gcp_credentials
            description: Gcp Storage Upload
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    bucket:
                        description: Bucket name
                        type: string
                    content:
                        description: File content (text or base64)
                        type: string
                    contentType:
                        default: application/octet-stream
                        description: Content type
                        type: string
                    objectName:
                        description: Destination object name
                        type: string
                    projectId:
                        description: GCP project ID
                        type: string
                required:
                    - bucket
