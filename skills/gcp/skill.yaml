            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    attributes:
                        description: Message attributes
                        type: object
                    message:
                        description: Message body
                        type: string
                    orderingKey:
                        description: Ordering key
                        type: string
                    projectId:
                        description: GCP project ID
                        type: string
                    topic:
                        description: Topic name
                        type: string
                required:
                    - message
