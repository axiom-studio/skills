                    - zone
                type: object
            name: gcp-instance-start
            permissions:
                - gcp:read
                - gcp:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        gcp-instance-stop:
            credentials:
                - kind: gcp_credentials
                  name: gcp_credentials
            description: Gcp Instance Stop
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    instanceName:
                        description: Instance name
                        type: string
                    projectId:
                        description: GCP project ID
                        type: string
                    zone:
                        description: Instance zone
                        type: string
                required:
