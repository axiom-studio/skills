apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        gcp-function-deploy:
            credentials:
                - kind: gcp_credentials
                  name: gcp_credentials
            description: Gcp Function Deploy
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    entryPoint:
                        description: Function entry point
                        type: string
                    environmentVariables:
                        description: Environment variables
                        type: object
                    functionName:
                        description: Function name
                        type: string
                    memoryMB:
                        default: 256
                        description: Memory allocation
                        type: integer
                    projectId:
                        description: GCP project ID
                        type: string
                    region:
                        description: Deployment region
                        type: string
                    runtime:
                        description: Runtime (nodejs18, python311, go121)
                        type: string
                    sourceDir:
                        description: Local source directory
                        type: string
                    sourceUrl:
                        description: Source archive URL
                        type: string
                    timeout:
                        default: 60s
                        description: Function timeout
                        type: string
                    triggerHttp:
                        default: true
                        description: HTTP trigger
                        type: boolean
                required:
                    - entryPoint
                    - functionName
                    - projectId
                    - region
                    - runtime
                type: object
            name: gcp-function-deploy
            permissions:
                - gcp:read
                - gcp:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        gcp-function-invoke:
            credentials:
                - kind: gcp_credentials
                  name: gcp_credentials
            description: Gcp Function Invoke
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    body:
                        description: Request body
                        type: object
                    functionName:
                        description: Function name
                        type: string
                    headers:
                        description: Request headers
                        type: object
                    method:
                        default: POST
                        description: HTTP method
                        type: string
                    projectId:
                        description: GCP project ID
                        type: string
                    region:
                        description: Function region
                        type: string
                required:
                    - functionName
                    - projectId
                    - region
                type: object
            name: gcp-function-invoke
            permissions:
                - gcp:read
                - gcp:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        gcp-function-list:
            credentials:
                - kind: gcp_credentials
                  name: gcp_credentials
            description: Gcp Function List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    projectId:
                        description: GCP project ID
                        type: string
                    region:
                        description: Filter by region
                        type: string
                required:
