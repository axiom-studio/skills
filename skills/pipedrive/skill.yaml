apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        pipedrive-api-request:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Api Request
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    baseURL:
                        default: https://api.pipedrive.com
                        description: Optional Pipedrive API base URL
                        type: string
                    body:
                        description: JSON request body
                        type: object
                    method:
                        default: GET
                        description: HTTP method
                        type: string
                    path:
                        description: API path, for example /api/v2/deals
                        type: string
                    query:
                        description: Query parameters
                        type: object
                required:
                    - method
                    - path
                type: object
            name: pipedrive-api-request
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        pipedrive-create-activity:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Create Activity
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    data:
                        description: Additional Pipedrive activity fields
                        type: object
                    dealId:
                        description: Linked deal ID
                        type: integer
                    dueDate:
                        description: Due date
                        type: string
                    dueTime:
                        description: Due time
                        type: string
                    orgId:
                        description: Linked organization ID
                        type: integer
                    personId:
                        description: Linked person ID
                        type: integer
                    subject:
                        description: Activity subject
                        type: string
                    type:
                        description: Activity type
                        type: string
                required:
                    - subject
                type: object
            name: pipedrive-create-activity
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        pipedrive-create-deal:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Create Deal
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    currency:
                        description: Currency code
                        type: string
                    data:
                        description: Additional Pipedrive deal fields
                        type: object
                    orgId:
                        description: Linked organization ID
                        type: integer
                    personId:
                        description: Linked person ID
                        type: integer
                    pipelineId:
                        description: Pipeline ID
                        type: integer
                    stageId:
                        description: Stage ID
                        type: integer
                    title:
                        description: Deal title
                        type: string
                    value:
                        description: Deal value
                        type: number
                required:
                    - title
                type: object
            name: pipedrive-create-deal
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        pipedrive-create-organization:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Create Organization
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    data:
                        description: Additional Pipedrive organization fields
                        type: object
                    name:
                        description: Organization name
                        type: string
                    ownerId:
                        description: Owner user ID
                        type: integer
                required:
                    - name
                type: object
            name: pipedrive-create-organization
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        pipedrive-create-person:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Create Person
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    data:
                        description: Additional Pipedrive person fields
                        type: object
                    email:
                        description: Email address
                        type: string
                    name:
                        description: Person name
                        type: string
                    orgId:
                        description: Organization ID
                        type: integer
                    phone:
                        description: Phone number
                        type: string
                required:
                    - name
                type: object
            name: pipedrive-create-person
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        pipedrive-create-record:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Create Record
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    data:
                        description: Record fields
                        type: object
                    entity:
                        description: Entity type to create
                        type: string
                required:
                    - data
                    - entity
                type: object
            name: pipedrive-create-record
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        pipedrive-delete-record:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Delete Record
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    entity:
                        description: Entity type to delete
                        type: string
                    id:
                        description: Record ID
                        type: string
                required:
                    - entity
                    - id
                type: object
            name: pipedrive-delete-record
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        pipedrive-get:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Get
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    entity:
                        description: Entity type to fetch
                        type: string
                    id:
                        description: Entity ID
                        type: string
                required:
                    - entity
                    - id
                type: object
            name: pipedrive-get
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        pipedrive-list:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    entity:
                        description: Entity type to list
                        type: string
                    filters:
                        description: Query filters
                        type: object
                required:
                    - entity
                type: object
            name: pipedrive-list
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        pipedrive-search:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Search
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    baseURL:
                        default: https://api.pipedrive.com
                        description: Optional Pipedrive API base URL
                        type: string
                    exactMatch:
                        default: false
                        description: Whether to return exact matches only
                        type: boolean
                    fields:
                        description: Comma-separated fields to search
                        type: string
                    itemTypes:
                        description: Comma-separated item types
                        type: string
                    limit:
                        default: 100
                        description: Maximum results
                        type: integer
                    term:
                        description: Search term
                        type: string
                required:
                    - term
                type: object
            name: pipedrive-search
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        pipedrive-update-deal:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Update Deal
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    data:
                        description: Deal fields to update
                        type: object
                    dealId:
                        description: Deal ID
                        type: string
                required:
                    - data
                    - dealId
                type: object
            name: pipedrive-update-deal
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        pipedrive-update-record:
            credentials:
                - kind: pipedrive-credential
                  name: pipedrive-credential
            description: Pipedrive Update Record
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    data:
                        description: Record fields to update
                        type: object
                    entity:
                        description: Entity type to update
                        type: string
                    id:
                        description: Record ID
                        type: string
                required:
                    - data
                    - entity
                    - id
                type: object
            name: pipedrive-update-record
            permissions:
                - pipedrive:read
                - pipedrive:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: crm
    description: Pipedrive CRM operations for Atlas agents - search, deals, persons, organizations, and activities
    icon: kanban
    id: skill-pipedrive
    installers:
        - id: oci
          kind: oci
          label: Pipedrive Skill service image
          package: axiomstudio/skill-pipedrive:1.0.0
    name: Pipedrive Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-pipedrive
        resolvedVersion: 1.0.0
    tags:
        - crm
        - pipedrive
        - pipeline
        - sales
    transport:
        endpoint: skill-pipedrive
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
