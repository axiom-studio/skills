apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        gitlab-issue-create:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Issue Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    assigneeIds:
                        description: Assignee user IDs
                        type: string
                    description:
                        description: Issue description
                        type: string
                    dueDate:
                        description: Due date (YYYY-MM-DD)
                        type: string
                    labels:
                        description: Labels to apply
                        type: string
                    projectId:
                        description: Project ID
                        type: string
                    title:
                        description: Issue title
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - projectId
                    - title
                type: object
            name: gitlab-issue-create
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        gitlab-issue-list:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Issue List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    assignee:
                        description: Filter by assignee
                        type: string
                    labels:
                        description: Filter by labels
                        type: string
                    projectId:
                        description: Project ID
                        type: string
                    state:
                        default: opened
                        description: Issue state
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - projectId
                type: object
            name: gitlab-issue-list
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gitlab-job-list:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Job List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    pipelineId:
                        description: Pipeline ID
                        type: integer
                    projectId:
                        description: Project ID
                        type: string
                    scope:
                        description: Job scopes (created, pending, running, failed, success)
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - pipelineId
                    - projectId
                type: object
            name: gitlab-job-list
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gitlab-job-logs:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Job Logs
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    jobId:
                        description: Job ID
                        type: integer
                    projectId:
                        description: Project ID
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - jobId
                    - projectId
                type: object
            name: gitlab-job-logs
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gitlab-mr-create:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Mr Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    assigneeIds:
                        description: User IDs to assign
                        type: string
                    description:
                        description: MR description
                        type: string
                    labels:
                        description: Labels to apply
                        type: string
                    projectId:
                        description: Project ID
                        type: string
                    removeSourceBranch:
                        default: false
                        description: Remove source branch after merge
                        type: boolean
                    reviewerIds:
                        description: Reviewer user IDs
                        type: string
                    sourceBranch:
                        description: Source branch name
                        type: string
                    squash:
                        default: false
                        description: Squash commits on merge
                        type: boolean
                    targetBranch:
                        description: Target branch name
                        type: string
                    title:
                        description: MR title
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - projectId
                    - sourceBranch
                    - targetBranch
                    - title
                type: object
            name: gitlab-mr-create
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        gitlab-mr-list:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Mr List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    author:
                        description: Filter by author
                        type: string
                    labels:
                        description: Filter by labels
                        type: string
                    projectId:
                        description: Project ID
                        type: string
                    state:
                        default: opened
                        description: MR state (opened, closed, merged, all)
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - projectId
                type: object
            name: gitlab-mr-list
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gitlab-mr-merge:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Mr Merge
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    mrIid:
                        description: MR internal ID
                        type: integer
                    projectId:
                        description: Project ID
                        type: string
                    shouldRemoveSourceBranch:
                        default: false
                        description: Remove source branch
                        type: boolean
                    squashCommitMessage:
                        description: Custom squash message
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - mrIid
                    - projectId
                type: object
            name: gitlab-mr-merge
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        gitlab-pipeline-status:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Pipeline Status
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    pipelineId:
                        description: Pipeline ID
                        type: integer
                    projectId:
                        description: Project ID
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - pipelineId
                    - projectId
                type: object
            name: gitlab-pipeline-status
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gitlab-pipeline-trigger:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Pipeline Trigger
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    projectId:
                        description: Project ID or path
                        type: string
                    ref:
                        description: Branch or tag name
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                    variables:
                        description: Pipeline variables
                        type: object
                required:
                    - projectId
                    - ref
                type: object
            name: gitlab-pipeline-trigger
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        gitlab-project-get:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Project Get
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    projectId:
                        description: Project ID or path
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - projectId
                type: object
            name: gitlab-project-get
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gitlab-project-list:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Project List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    membership:
                        default: true
                        description: Only return projects with membership
                        type: boolean
                    owned:
                        default: false
                        description: Only return owned projects
                        type: boolean
                    perPage:
                        default: 20
                        description: Results per page
                        type: integer
                    search:
                        description: Search query
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                type: object
            name: gitlab-project-list
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gitlab-repo-file:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Repo File
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    filePath:
                        description: File path in repo
                        type: string
                    projectId:
                        description: Project ID
                        type: string
                    ref:
                        description: Branch or commit SHA
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - filePath
                    - projectId
                    - ref
                type: object
            name: gitlab-repo-file
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        gitlab-variable-list:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Variable List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    projectId:
                        description: Project ID
                        type: string
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - projectId
                type: object
            name: gitlab-variable-list
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        gitlab-variable-set:
            credentials:
                - kind: gitlab_token
                  name: gitlab_token
            description: Gitlab Variable Set
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    environmentScope:
                        default: '*'
                        description: Environment scope
                        type: string
                    key:
                        description: Variable key
                        type: string
                    masked:
                        default: false
                        description: Mask in logs
                        type: boolean
                    projectId:
                        description: Project ID
                        type: string
                    protected:
                        default: false
                        description: Only for protected branches
                        type: boolean
                    url:
                        default: https://gitlab.com
                        description: GitLab URL
                        type: string
                required:
                    - key
                    - projectId
                type: object
            name: gitlab-variable-set
            permissions:
                - gitlab:read
                - gitlab:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: devops
    description: GitLab repository and CI/CD operations for Atlas agents
    icon: git-branch
    id: skill-gitlab
    installers:
