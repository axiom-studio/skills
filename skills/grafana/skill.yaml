apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        grafana-alert-rule-create:
            credentials:
                - kind: grafana-credential
                  name: grafana-credential
            description: Grafana Alert Rule Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    condition:
                        description: Alert condition
                        type: string
                    data:
                        description: Alert query data
                        type: string
                    execErrState:
                        default: Alerting
                        description: Execution error state
                        type: string
                    folderUid:
                        description: Folder UID
                        type: string
                    for:
                        default: 5m
                        description: Duration before firing
                        type: string
                    noDataState:
                        default: NoData
                        description: No data state (NoData, Alerting, OK)
                        type: string
                    title:
                        description: Alert rule title
                        type: string
                    url:
                        description: Grafana URL
                        type: string
                required:
                    - condition
                    - data
                    - folderUid
                    - title
                    - url
                type: object
            name: grafana-alert-rule-create
            permissions:
                - grafana:read
                - grafana:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        grafana-alert-rule-list:
            credentials:
                - kind: grafana-credential
                  name: grafana-credential
            description: Grafana Alert Rule List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    folderUid:
                        description: Filter by folder UID
                        type: string
                    url:
                        description: Grafana URL
                        type: string
                required:
                    - url
                type: object
            name: grafana-alert-rule-list
            permissions:
                - grafana:read
                - grafana:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        grafana-annotation-create:
            credentials:
                - kind: grafana-credential
                  name: grafana-credential
            description: Grafana Annotation Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    dashboardId:
                        description: Dashboard ID
                        type: integer
                    panelId:
                        description: Panel ID
                        type: integer
                    tags:
                        description: Annotation tags
                        type: string
                    text:
                        description: Annotation text
                        type: string
                    time:
                        description: Timestamp (ms)
                        type: integer
                    timeEnd:
                        description: End timestamp (ms)
                        type: integer
                    url:
                        description: Grafana URL
                        type: string
                required:
                    - text
                    - url
                type: object
            name: grafana-annotation-create
            permissions:
                - grafana:read
                - grafana:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        grafana-dashboard-create:
            credentials:
                - kind: grafana-credential
                  name: grafana-credential
            description: Grafana Dashboard Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    panels:
                        description: Panel configurations
                        type: string
                    refresh:
                        description: Auto-refresh interval
                        type: string
                    templating:
                        description: Template variables
                        type: object
                    time:
                        description: Default time range
                        type: object
                    title:
                        description: Dashboard title
                        type: string
                    url:
                        description: Grafana URL
                        type: string
                required:
                    - title
                    - url
                type: object
            name: grafana-dashboard-create
            permissions:
                - grafana:read
                - grafana:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        grafana-dashboard-delete:
            credentials:
                - kind: grafana-credential
                  name: grafana-credential
            description: Grafana Dashboard Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    uid:
                        description: Dashboard UID
                        type: string
                    url:
                        description: Grafana URL
                        type: string
                required:
                    - uid
                    - url
                type: object
            name: grafana-dashboard-delete
            permissions:
                - grafana:read
                - grafana:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        grafana-dashboard-list:
            credentials:
                - kind: grafana-credential
                  name: grafana-credential
            description: Grafana Dashboard List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    folderId:
                        description: Filter by folder ID
                        type: integer
                    tag:
                        description: Filter by tags
                        type: string
                    url:
                        description: Grafana URL
                        type: string
                required:
                    - url
                type: object
            name: grafana-dashboard-list
            permissions:
                - grafana:read
                - grafana:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        grafana-dashboard-update:
            credentials:
                - kind: grafana-credential
                  name: grafana-credential
            description: Grafana Dashboard Update
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    dashboard:
                        description: Dashboard JSON
                        type: object
                    overwrite:
                        default: false
                        description: Overwrite existing
                        type: boolean
                    uid:
                        description: Dashboard UID
                        type: string
                    url:
                        description: Grafana URL
                        type: string
                required:
                    - dashboard
                    - uid
                    - url
                type: object
            name: grafana-dashboard-update
            permissions:
                - grafana:read
                - grafana:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        grafana-datasource-create:
            credentials:
                - kind: grafana-credential
                  name: grafana-credential
            description: Grafana Datasource Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    access:
                        default: proxy
                        description: Access mode (proxy, direct)
                        type: string
                    datasourceUrl:
                        description: Datasource URL
                        type: string
                    jsonData:
                        description: Type-specific config
                        type: object
                    name:
                        description: Datasource name
                        type: string
                    type:
                        description: Type (prometheus, influxdb, etc.)
                        type: string
                    url:
                        description: Grafana URL
                        type: string
                required:
                    - datasourceUrl
                    - name
                    - type
                    - url
                type: object
            name: grafana-datasource-create
            permissions:
                - grafana:read
                - grafana:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        grafana-datasource-list:
            credentials:
                - kind: grafana-credential
                  name: grafana-credential
            description: Grafana Datasource List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    url:
                        description: Grafana URL
                        type: string
                required:
                    - url
                type: object
            name: grafana-datasource-list
            permissions:
                - grafana:read
                - grafana:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
    category: monitoring
    description: Grafana visualization operations for Atlas agents
