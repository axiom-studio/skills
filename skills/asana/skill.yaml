            sideEffect: destructive
        asana-task-list:
            credentials:
                - kind: asana_token
                  name: asana_token
            description: Asana Task List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    assignee:
                        description: Filter by assignee gid
                        type: string
                    completed:
