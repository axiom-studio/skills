apiVersion: skills.axiom.dev/v1
kind: Skill
metadata:
  id: openseal.source
  name: Source Feed Observer
  description: Observe authorized RSS and Atom feeds with durable provenance
  author: OpenSeal Contributors
  version: 1.0.2
  license: Apache-2.0
  category: research
  tags: [rss, atom, monitoring, evidence]
  icon: rss
spec:
  executorType: grpc
  nodeTypes: [openseal.source]
  inputs:
    openseal.source:
      - {name: url, type: string, required: true, source: input}
      - {name: maxItems, type: integer, required: false, source: default, default: 25}
  grpc:
    port: 50121
    docker:
      image: axiomstudio/skill-openseal-source:1.0.2
  permissions: [network:https:read, evidence:write]
