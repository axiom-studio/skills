apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        zoom-meeting-create:
            credentials:
                - kind: zoom-credential
                  name: zoom-credential
            description: Zoom Meeting Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Zoom account ID
                        type: string
                    duration:
                        description: Duration in minutes
                        type: integer
                    password:
                        description: Meeting password
                        type: string
                    settings:
                        description: Meeting settings
                        type: object
                    startTime:
                        description: Start time (ISO 8601)
                        type: string
                    timezone:
                        description: Timezone
                        type: string
                    topic:
                        description: Meeting topic
                        type: string
                    type:
                        default: 2
                        description: Meeting type (1=instant, 2=scheduled)
                        type: integer
                required:
                    - accountId
                    - topic
                type: object
            name: zoom-meeting-create
            permissions:
                - zoom:read
                - zoom:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        zoom-meeting-delete:
            credentials:
                - kind: zoom-credential
                  name: zoom-credential
            description: Zoom Meeting Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Zoom account ID
                        type: string
                    meetingId:
                        description: Meeting ID
                        type: string
                required:
                    - accountId
                    - meetingId
                type: object
            name: zoom-meeting-delete
            permissions:
                - zoom:read
                - zoom:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        zoom-meeting-get:
            credentials:
                - kind: zoom-credential
                  name: zoom-credential
            description: Zoom Meeting Get
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Zoom account ID
                        type: string
                    meetingId:
                        description: Meeting ID
                        type: string
                required:
                    - accountId
                    - meetingId
                type: object
            name: zoom-meeting-get
            permissions:
                - zoom:read
                - zoom:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        zoom-meeting-list:
            credentials:
                - kind: zoom-credential
                  name: zoom-credential
            description: Zoom Meeting List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Zoom account ID
                        type: string
                    type:
                        description: Meeting type filter
                        type: string
                    userId:
                        default: me
                        description: User ID
                        type: string
                required:
                    - accountId
                type: object
            name: zoom-meeting-list
            permissions:
                - zoom:read
                - zoom:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        zoom-participant-list:
            credentials:
                - kind: zoom-credential
                  name: zoom-credential
            description: Zoom Participant List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Zoom account ID
                        type: string
                    meetingId:
                        description: Meeting ID
                        type: string
                required:
                    - accountId
                    - meetingId
                type: object
            name: zoom-participant-list
            permissions:
                - zoom:read
                - zoom:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        zoom-recording-list:
            credentials:
                - kind: zoom-credential
                  name: zoom-credential
            description: Zoom Recording List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Zoom account ID
                        type: string
                    meetingId:
                        description: Meeting ID
                        type: string
                required:
                    - accountId
                type: object
            name: zoom-recording-list
            permissions:
                - zoom:read
                - zoom:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        zoom-user-list:
            credentials:
                - kind: zoom-credential
                  name: zoom-credential
            description: Zoom User List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Zoom account ID
                        type: string
                    status:
                        description: User status filter
                        type: string
                required:
                    - accountId
                type: object
            name: zoom-user-list
            permissions:
                - zoom:read
                - zoom:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        zoom-webinar-create:
            credentials:
                - kind: zoom-credential
                  name: zoom-credential
            description: Zoom Webinar Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Zoom account ID
                        type: string
                    duration:
                        description: Duration in minutes
                        type: integer
                    password:
                        description: Webinar password
                        type: string
                    startTime:
                        description: Start time (ISO 8601)
                        type: string
                    topic:
                        description: Webinar topic
                        type: string
                required:
                    - accountId
                    - duration
                    - startTime
                    - topic
                type: object
            name: zoom-webinar-create
            permissions:
                - zoom:read
                - zoom:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
