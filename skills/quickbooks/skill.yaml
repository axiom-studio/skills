apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        quickbooks-customer:
            description: Quickbooks Customer
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    displayName:
                        description: Customer display name
                        type: string
                    email:
                        description: Customer email address
                        type: string
                required:
                    - displayName
                type: object
            name: quickbooks-customer
            permissions:
                - quickbooks:read
                - quickbooks:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        quickbooks-expense:
            description: Quickbooks Expense
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Expense account ID
                        type: string
                    amount:
                        description: Expense amount
                        type: number
                required:
                    - accountId
                    - amount
                type: object
            name: quickbooks-expense
            permissions:
                - quickbooks:read
                - quickbooks:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        quickbooks-invoice:
            description: Quickbooks Invoice
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    customerId:
                        description: QuickBooks customer ID
                        type: string
                    lineItems:
                        description: Array of line items with amount and description
                        type: object
                required:
                    - customerId
                    - lineItems
                type: object
            name: quickbooks-invoice
            permissions:
                - quickbooks:read
                - quickbooks:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        quickbooks-report:
            description: Quickbooks Report
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    endDate:
                        description: Report end date (YYYY-MM-DD)
                        type: string
                    reportType:
                        description: Type of report (profit-and-loss, balance-sheet, cash-flow)
                        type: string
                    startDate:
                        description: Report start date (YYYY-MM-DD)
                        type: string
                required:
                    - reportType
                type: object
            name: quickbooks-report
            permissions:
                - quickbooks:read
                - quickbooks:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: finance
    description: Manage invoices, expenses, and financial data through QuickBooks
    icon: file-invoice
    id: quickbooks
    installers:
        - id: oci
          kind: oci
          label: QuickBooks Skill service image
          package: axiomstudio/skill-quickbooks:1.0.0
    name: QuickBooks Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: quickbooks
        resolvedVersion: 1.0.0
    tags:
        - accounting
        - finance
        - invoicing
        - quickbooks
    transport:
        endpoint: quickbooks
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
