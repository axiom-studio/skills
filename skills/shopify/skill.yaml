apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        shopify-customer:
            credentials:
                - kind: shopify_api
                  name: shopify_api
            description: Shopify Customer
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (list, get, create, update, delete)
                        type: string
                    customerId:
                        description: Customer ID
                        type: string
                    email:
                        description: Customer email
                        type: string
                    storeUrl:
                        description: Shopify store URL
                        type: string
                required:
                    - action
                    - storeUrl
                type: object
            name: shopify-customer
            permissions:
                - shopify:read
                - shopify:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        shopify-fulfillment:
            credentials:
                - kind: shopify_api
                  name: shopify_api
            description: Shopify Fulfillment
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (list, get, create, update, track)
                        type: string
                    fulfillmentId:
                        description: Fulfillment ID
                        type: string
                    notifyCustomer:
                        default: true
                        description: Notify customer
                        type: boolean
                    orderId:
                        description: Order ID
                        type: string
                    storeUrl:
                        description: Shopify store URL
                        type: string
                    trackingCompany:
                        description: Tracking company
                        type: string
                    trackingNumber:
                        description: Tracking number
                        type: string
                required:
                    - action
                    - storeUrl
                type: object
            name: shopify-fulfillment
            permissions:
                - shopify:read
                - shopify:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        shopify-inventory:
            credentials:
                - kind: shopify_api
                  name: shopify_api
            description: Shopify Inventory
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (list, get, set, adjust)
                        type: string
                    inventoryItemId:
                        description: Inventory item ID
                        type: string
                    locationId:
                        description: Location ID
                        type: string
                    quantity:
                        description: Quantity
                        type: integer
                    storeUrl:
                        description: Shopify store URL
                        type: string
                required:
                    - action
                    - storeUrl
                type: object
            name: shopify-inventory
            permissions:
                - shopify:read
                - shopify:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        shopify-order:
            credentials:
                - kind: shopify_api
                  name: shopify_api
            description: Shopify Order
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (list, get, update, fulfill)
                        type: string
                    limit:
                        description: Max results
                        type: integer
                    orderId:
                        description: Order ID
                        type: string
                    status:
                        description: Status filter
                        type: string
                    storeUrl:
                        description: Shopify store URL
                        type: string
                required:
                    - action
                    - storeUrl
                type: object
            name: shopify-order
            permissions:
                - shopify:read
                - shopify:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        shopify-product:
            credentials:
                - kind: shopify_api
                  name: shopify_api
            description: Shopify Product
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (list, get, create, update, delete)
                        type: string
                    limit:
                        description: Max results
                        type: integer
                    productId:
                        description: Product ID
                        type: string
                    storeUrl:
                        description: Shopify store URL
                        type: string
                required:
                    - action
                    - storeUrl
                type: object
            name: shopify-product
            permissions:
                - shopify:read
                - shopify:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
