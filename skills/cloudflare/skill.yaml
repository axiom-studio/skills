apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        cf-d1-list:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf D1 List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Cloudflare account ID
                        type: string
                required:
                    - accountId
                type: object
            name: cf-d1-list
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        cf-d1-query:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf D1 Query
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Cloudflare account ID
                        type: string
                    databaseId:
                        description: Database UUID
                        type: string
                    query:
                        description: SQL query to execute
                        type: string
                required:
                    - accountId
                    - databaseId
                    - query
                type: object
            name: cf-d1-query
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        cf-dns-create:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf Dns Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    content:
                        description: Record content/value
                        type: string
                    name:
                        description: Record name
                        type: string
                    priority:
                        description: Priority for MX records
                        type: integer
                    proxied:
                        default: false
                        description: Proxy through Cloudflare
                        type: boolean
                    ttl:
                        default: 1
                        description: TTL in seconds (1 = automatic)
                        type: integer
                    type:
                        description: Record type (A, AAAA, CNAME, MX, TXT, etc.)
                        type: string
                    zoneId:
                        description: Zone ID
                        type: string
                required:
                    - content
                    - name
                    - type
                    - zoneId
                type: object
            name: cf-dns-create
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        cf-dns-delete:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf Dns Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    recordId:
                        description: Record ID to delete
                        type: string
                    zoneId:
                        description: Zone ID
                        type: string
                required:
                    - recordId
                    - zoneId
                type: object
            name: cf-dns-delete
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        cf-dns-list:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf Dns List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    name:
                        description: Filter by record name
                        type: string
                    type:
                        description: Filter by record type (A, AAAA, CNAME, etc.)
                        type: string
                    zoneId:
                        description: Zone ID
                        type: string
                required:
                    - zoneId
                type: object
            name: cf-dns-list
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        cf-dns-update:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf Dns Update
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    content:
                        description: Record content/value
                        type: string
                    name:
                        description: Record name
                        type: string
                    proxied:
                        description: Proxy through Cloudflare
                        type: boolean
                    recordId:
                        description: Record ID to update
                        type: string
                    ttl:
                        description: TTL in seconds
                        type: integer
                    type:
                        description: Record type
                        type: string
                    zoneId:
                        description: Zone ID
                        type: string
                required:
                    - content
                    - name
                    - recordId
                    - type
                    - zoneId
                type: object
            name: cf-dns-update
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        cf-r2-download:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf R2 Download
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Cloudflare account ID
                        type: string
                    bucket:
                        description: R2 bucket name
                        type: string
                    objectName:
                        description: Object name
                        type: string
                required:
                    - accountId
                    - bucket
                    - objectName
                type: object
            name: cf-r2-download
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        cf-r2-list:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf R2 List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Cloudflare account ID
                        type: string
                required:
                    - accountId
                type: object
            name: cf-r2-list
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        cf-r2-upload:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf R2 Upload
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Cloudflare account ID
                        type: string
                    bucket:
                        description: R2 bucket name
                        type: string
                    content:
                        description: File content
                        type: string
                    contentType:
                        default: application/octet-stream
                        description: Content type
                        type: string
                    objectName:
                        description: Object name
                        type: string
                required:
                    - accountId
                    - bucket
                    - content
                    - objectName
                type: object
            name: cf-r2-upload
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        cf-waf-create-rule:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf Waf Create Rule
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (block, challenge, allow, log)
                        type: string
                    description:
                        description: Rule description
                        type: string
                    expression:
                        description: Firewall rule expression
                        type: string
                    zoneId:
                        description: Zone ID
                        type: string
                required:
                    - action
                    - expression
                    - zoneId
                type: object
            name: cf-waf-create-rule
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        cf-waf-list:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf Waf List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    zoneId:
                        description: Zone ID
                        type: string
                required:
                    - zoneId
                type: object
            name: cf-waf-list
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        cf-worker-deploy:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf Worker Deploy
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Cloudflare account ID
                        type: string
                    bindings:
                        description: Environment variable bindings
                        type: object
                    compatibilityDate:
                        description: Compatibility date
                        type: string
                    compatibilityFlags:
                        description: Compatibility flags
                        type: string
                    durableObjects:
                        description: Durable Object bindings
                        type: object
                    kvNamespaces:
                        description: KV namespace bindings
                        type: object
                    script:
                        description: Worker JavaScript code
                        type: string
                    workerName:
                        description: Worker name
                        type: string
                required:
                    - accountId
                    - script
                    - workerName
                type: object
            name: cf-worker-deploy
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        cf-worker-list:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf Worker List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Cloudflare account ID
                        type: string
                required:
                    - accountId
                type: object
            name: cf-worker-list
            permissions:
                - cloudflare:read
                - cloudflare:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        cf-zone-list:
            credentials:
                - kind: cloudflare-credential
                  name: cloudflare-credential
            description: Cf Zone List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    accountId:
                        description: Filter by account ID
                        type: string
                    name:
                        description: Filter by zone name
                        type: string
                    status:
                        description: Filter by zone status (active, pending)
