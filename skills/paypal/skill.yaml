        paypal-invoice-create:
            credentials:
                - kind: paypal-credential
                  name: paypal-credential
            description: Paypal Invoice Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    amount:
                        description: Invoice amount
                        type: string
                    sandbox:
                        default: false
                        description: Use sandbox environment
                        type: boolean
                    toEmail:
                        description: Recipient email
                        type: string
                required:
                    - amount
                    - toEmail
                type: object
            name: paypal-invoice-create
            permissions:
                - paypal:read
                - paypal:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
