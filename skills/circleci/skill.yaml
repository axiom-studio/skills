apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        circleci-context-list:
            credentials:
                - kind: circleci-credential
                  name: circleci-credential
            description: Circleci Context List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    orgSlug:
                        description: Organization slug
                        type: string
                required:
                    - orgSlug
                type: object
            name: circleci-context-list
            permissions:
                - circleci:read
                - circleci:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
