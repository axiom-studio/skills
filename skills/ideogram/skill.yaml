apiVersion: skills.axiom.dev/v1
kind: Skill
metadata:
  id: skill-ideogram
  name: Ideogram Skill
  description: Ideogram AI image generation for Atlas agents
  author: Axiom Studio
  authorEmail: engineering@axiomstudio.ai
  version: 1.0.0
  license: MIT
  category: ai
  tags:
    - ideogram
    - ai
    - image-generation
    - design
  icon: image
  color: "#111827"
spec:
  executorType: grpc
  credentialType: generic
  nodeTypes:
    - ideogram-generate
  inputs:
    ideogram-generate:
      - name: apiKey
        type: string
        description: Ideogram API key
        required: true
        source: connection
        binding: vault://ideogram-credentials
      - name: textPrompt
        type: string
        description: Natural-language prompt for image generation
        required: true
        source: input
      - name: resolution
        type: string
        description: Output image resolution
        required: false
        source: input
        default: "2048x2048"
      - name: renderingSpeed
        type: string
        description: Rendering quality/speed tradeoff
        required: false
        source: input
        default: "DEFAULT"
      - name: enableCopyrightDetection
        type: boolean
        description: Opt into Ideogram copyright detection
        required: false
        source: input
        default: false
  grpc:
    port: 50131
    docker:
      image: axiomstudio/skill-ideogram:1.0.0
  dependencies:
    standard:
      - logger
      - secrets
  permissions:
    - ideogram:generate
