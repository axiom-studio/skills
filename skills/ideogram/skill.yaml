apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        ideogram-generate:
            credentials:
                - kind: ideogram-credential
                  name: ideogram-credential
            description: Ideogram Generate
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    enableCopyrightDetection:
                        default: false
                        description: Opt into Ideogram copyright detection
                        type: boolean
                    renderingSpeed:
                        default: DEFAULT
                        description: Rendering quality/speed tradeoff
                        type: string
                    resolution:
                        default: 2048x2048
                        description: Output image resolution
                        type: string
                    textPrompt:
                        description: Natural-language prompt for image generation
                        type: string
                required:
                    - textPrompt
                type: object
            name: ideogram-generate
            permissions:
                - ideogram:generate
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: ai
    description: Ideogram AI image generation for Atlas agents
    icon: image
    id: skill-ideogram
    installers:
        - id: oci
          kind: oci
          label: Ideogram Skill service image
          package: axiomstudio/skill-ideogram:1.0.0
    name: Ideogram Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-ideogram
        resolvedVersion: 1.0.0
    tags:
        - ai
        - design
        - ideogram
        - image-generation
    transport:
        endpoint: skill-ideogram
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
