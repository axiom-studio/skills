            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    queueUrl:
                        description: Queue URL
                        type: string
                    region:
                        description: AWS region
                        type: string
                required:
                    - queueUrl
                    - region
                type: object
            name: sqs-queue-delete
            permissions:
                - sqs:read
                - sqs:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        sqs-queue-list:
            credentials:
                - kind: sqs-credential
                  name: sqs-credential
            description: Sqs Queue List
            idempotency: supported
            inputSchema:
