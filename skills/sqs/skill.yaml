                        description: Default visibility timeout
                        type: integer
                required:
                    - queueName
                    - region
                type: object
            name: sqs-queue-create
            permissions:
                - sqs:read
                - sqs:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        sqs-queue-delete:
