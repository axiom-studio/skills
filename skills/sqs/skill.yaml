                type: object
            name: sqs-queue-list
            permissions:
                - sqs:read
                - sqs:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        sqs-queue-purge:
            credentials:
                - kind: sqs-credential
