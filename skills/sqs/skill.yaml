apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        sqs-dead-letter-queue:
            credentials:
                - kind: sqs-credential
                  name: sqs-credential
            description: Sqs Dead Letter Queue
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    dlqUrl:
                        description: Dead letter queue URL
                        type: string
                    maxReceiveCount:
                        default: 10
                        description: Max receive count
                        type: integer
                    queueUrl:
                        description: Queue URL
                        type: string
                    region:
                        description: AWS region
                        type: string
                required:
                    - queueUrl
                    - region
                type: object
            name: sqs-dead-letter-queue
            permissions:
                - sqs:read
                - sqs:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        sqs-delete-message:
            credentials:
                - kind: sqs-credential
                  name: sqs-credential
            description: Sqs Delete Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    queueUrl:
                        description: Queue URL
                        type: string
                    receiptHandle:
                        description: Receipt handle
                        type: string
                    region:
                        description: AWS region
                        type: string
                required:
                    - queueUrl
                    - receiptHandle
                    - region
                type: object
            name: sqs-delete-message
            permissions:
                - sqs:read
                - sqs:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        sqs-queue-attributes:
            credentials:
                - kind: sqs-credential
