                        type: string
                    region:
                        description: AWS region
                        type: string
                required:
                    - queueUrl
                    - region
                type: object
            name: sqs-queue-purge
            permissions:
                - sqs:read
                - sqs:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        sqs-receive-message:
            credentials:
                - kind: sqs-credential
                  name: sqs-credential
            description: Sqs Receive Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    maxNumberOfMessages:
                        default: 1
                        description: Max messages (1-10)
                        type: integer
                    queueUrl:
                        description: Queue URL
                        type: string
                    region:
                        description: AWS region
                        type: string
                    visibilityTimeout:
                        description: Visibility timeout
                        type: integer
                    waitTimeSeconds:
                        description: Long polling wait time
                        type: integer
                required:
                    - queueUrl
                    - region
                type: object
            name: sqs-receive-message
            permissions:
                - sqs:read
                - sqs:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
