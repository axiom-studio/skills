                - kind: sqs-credential
                  name: sqs-credential
            description: Sqs Send Message
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    delaySeconds:
                        description: Delay in seconds
                        type: integer
                    groupId:
                        description: FIFO group ID
                        type: string
                    messageAttributes:
                        description: Message attributes
                        type: object
                    messageBody:
                        description: Message body
                        type: string
                    queueUrl:
                        description: Queue URL
                        type: string
                    region:
                        description: AWS region
                        type: string
                required:
                    - messageBody
                    - queueUrl
                    - region
                type: object
            name: sqs-send-message
            permissions:
                - sqs:read
                - sqs:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
