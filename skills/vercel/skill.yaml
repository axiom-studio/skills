                    - domain
                    - projectId
                type: object
            name: vercel-domain-add
            permissions:
                - vercel:read
                - vercel:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        vercel-domain-list:
            credentials:
                - kind: vercel-credential
