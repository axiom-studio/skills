apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        vercel-deploy:
            credentials:
                - kind: vercel-credential
                  name: vercel-credential
            description: Vercel Deploy
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    files:
                        description: Files to deploy
                        type: string
                    name:
                        description: Deployment name
                        type: string
                    projectId:
                        description: Project ID
                        type: string
                    ref:
                        description: Git ref (branch/tag)
                        type: string
                    target:
                        default: preview
                        description: Target (production, preview)
                        type: string
                required:
                    - files
                type: object
            name: vercel-deploy
            permissions:
                - vercel:read
                - vercel:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        vercel-deployment-get:
            credentials:
                - kind: vercel-credential
                  name: vercel-credential
            description: Vercel Deployment Get
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    deploymentId:
                        description: Deployment ID
                        type: string
                    projectId:
                        description: Project ID
                        type: string
                required:
                    - deploymentId
                type: object
            name: vercel-deployment-get
            permissions:
                - vercel:read
                - vercel:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
