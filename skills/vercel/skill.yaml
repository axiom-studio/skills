                    projectId:
                        description: Project ID
                        type: string
                required:
                    - projectId
                type: object
            name: vercel-env-list
            permissions:
                - vercel:read
                - vercel:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        vercel-env-set:
            credentials:
                - kind: vercel-credential
                  name: vercel-credential
            description: Vercel Env Set
            idempotency: required
            inputSchema:
                additionalProperties: false
