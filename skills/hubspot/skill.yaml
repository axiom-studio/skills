apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        hs-company-create:
            credentials:
                - kind: hubspot_api
                  name: hubspot_api
            description: Hs Company Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    address:
                        description: Street address
                        type: string
                    annualRevenue:
                        description: Annual revenue
                        type: number
                    city:
                        description: City
                        type: string
                    country:
                        description: Country
                        type: string
                    domain:
                        description: Company domain
                        type: string
                    industry:
                        description: Company industry
                        type: string
                    name:
                        description: Company name
                        type: string
                    numberOfEmployees:
                        description: Number of employees
                        type: integer
                    phone:
                        description: Company phone
                        type: string
                    properties:
                        description: Additional custom properties
                        type: object
                    state:
                        description: State
                        type: string
                    zip:
                        description: Zip code
                        type: string
                required:
                    - name
                type: object
            name: hs-company-create
            permissions:
                - hubspot:read
                - hubspot:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        hs-contact-create:
            credentials:
                - kind: hubspot_api
                  name: hubspot_api
            description: Hs Contact Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    company:
                        description: Contact company name
                        type: string
                    email:
                        description: Contact email
                        type: string
                    firstName:
                        description: Contact first name
                        type: string
                    lastName:
                        description: Contact last name
                        type: string
                    phone:
                        description: Contact phone number
                        type: string
                    properties:
                        description: Additional custom properties
                        type: object
                required:
                    - email
                type: object
            name: hs-contact-create
            permissions:
                - hubspot:read
                - hubspot:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        hs-contact-search:
            credentials:
                - kind: hubspot_api
                  name: hubspot_api
            description: Hs Contact Search
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    limit:
                        default: 100
                        description: Maximum results
                        type: integer
                    properties:
                        description: Properties to return
                        type: string
                    query:
                        description: Search query
                        type: string
                required:
                    - query
                type: object
            name: hs-contact-search
            permissions:
                - hubspot:read
                - hubspot:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        hs-contact-update:
            credentials:
                - kind: hubspot_api
                  name: hubspot_api
            description: Hs Contact Update
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    company:
                        description: New company
                        type: string
                    contactId:
                        description: Contact ID or email
                        type: string
                    email:
                        description: New email
                        type: string
                    firstName:
                        description: New first name
                        type: string
                    lastName:
                        description: New last name
                        type: string
                    phone:
                        description: New phone
                        type: string
                    properties:
                        description: Additional properties to update
                        type: object
                required:
                    - contactId
                type: object
            name: hs-contact-update
            permissions:
                - hubspot:read
                - hubspot:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        hs-deal-create:
            credentials:
                - kind: hubspot_api
                  name: hubspot_api
            description: Hs Deal Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    amount:
                        description: Deal amount
                        type: number
                    closeDate:
                        description: Expected close date (YYYY-MM-DD)
                        type: string
                    companyId:
                        description: Associated company ID
                        type: string
                    contactId:
                        description: Associated contact ID
                        type: string
                    currency:
                        default: USD
                        description: Currency code
                        type: string
                    dealName:
                        description: Deal name
                        type: string
                    dealPipeline:
                        description: Deal pipeline ID
                        type: string
                    properties:
                        description: Additional custom properties
                        type: object
                    stage:
                        description: Deal stage
                        type: string
                required:
                    - dealName
                type: object
            name: hs-deal-create
            permissions:
                - hubspot:read
                - hubspot:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        hs-deal-update:
            credentials:
                - kind: hubspot_api
                  name: hubspot_api
            description: Hs Deal Update
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    amount:
                        description: New deal amount
                        type: number
                    closeDate:
                        description: New close date
                        type: string
                    dealId:
                        description: Deal ID to update
                        type: string
                    dealName:
                        description: New deal name
                        type: string
                    properties:
                        description: Additional properties to update
                        type: object
                    stage:
                        description: New deal stage
                        type: string
                required:
                    - dealId
                type: object
            name: hs-deal-update
            permissions:
                - hubspot:read
                - hubspot:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        hs-engagement:
            credentials:
                - kind: hubspot_api
                  name: hubspot_api
            description: Hs Engagement
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    body:
                        description: Engagement content
                        type: string
                    companyId:
                        description: Associated company ID
                        type: string
                    contactId:
                        description: Associated contact ID
                        type: string
                    dealId:
                        description: Associated deal ID
                        type: string
                    dueDate:
                        description: Due date for tasks/meetings
                        type: string
                    engagementType:
                        description: Type (NOTE, CALL, EMAIL, TASK, MEETING)
                        type: string
                    ownerId:
                        description: Owner ID
                        type: string
                    properties:
                        description: Additional custom properties
                        type: object
                    status:
                        description: Engagement status
                        type: string
                    subject:
                        description: Engagement subject
                        type: string
                    ticketId:
                        description: Associated ticket ID
                        type: string
                required:
                    - body
                    - engagementType
                type: object
            name: hs-engagement
            permissions:
                - hubspot:read
                - hubspot:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        hs-ticket-create:
            credentials:
                - kind: hubspot_api
                  name: hubspot_api
            description: Hs Ticket Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    category:
                        description: Ticket category
                        type: string
                    companyId:
                        description: Associated company ID
                        type: string
                    contactId:
                        description: Associated contact ID
                        type: string
                    content:
                        description: Ticket description
                        type: string
                    ownerId:
                        description: Assigned owner ID
                        type: string
                    priority:
                        default: MEDIUM
                        description: Ticket priority (LOW, MEDIUM, HIGH, URGENT)
                        type: string
                    properties:
                        description: Additional custom properties
                        type: object
                    status:
                        default: NEW
                        description: Ticket status (NEW, IN_PROGRESS, CLOSED)
                        type: string
                    subject:
                        description: Ticket subject
                        type: string
                required:
                    - content
                    - subject
                type: object
            name: hs-ticket-create
            permissions:
                - hubspot:read
                - hubspot:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: crm
    description: HubSpot CRM operations for Atlas agents - contacts, deals, companies, tickets
    icon: users
    id: skill-hubspot
    installers:
        - id: oci
          kind: oci
          label: HubSpot Skill service image
          package: axiomstudio/skill-hubspot:1.0.0
    name: HubSpot Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-hubspot
        resolvedVersion: 1.0.0
    tags:
        - crm
        - hubspot
        - marketing
        - sales
    transport:
        endpoint: skill-hubspot
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
