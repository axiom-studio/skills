apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        git-branch-list:
            description: Git Branch List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    all:
                        default: false
                        description: Include remote branches
                        type: boolean
                    pattern:
                        description: Filter branches by pattern
                        type: string
                    remote:
                        description: Filter by remote name
                        type: string
                    repositoryPath:
                        description: Path to the git repository
                        type: string
                required:
                    - repositoryPath
                type: object
            name: git-branch-list
            permissions:
                - git:read
                - git:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        git-clone:
            credentials:
                - kind: git-credential
                  name: git-credential
            description: Git Clone
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    branch:
                        default: ""
                        description: 'Branch to clone (default: default branch)'
                        type: string
                    depth:
                        default: 0
                        description: Clone depth (shallow clone)
                        type: integer
                    repositoryUrl:
                        description: Git repository URL to clone
                        type: string
                    targetDirectory:
                        default: ./
                        description: Target directory for cloned repository
                        type: string
                required:
                    - repositoryUrl
                type: object
            name: git-clone
            permissions:
                - git:read
                - git:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        git-commit:
            description: Git Commit
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    amend:
                        default: false
                        description: Amend previous commit
                        type: boolean
                    authorEmail:
                        description: Author email for commit
                        type: string
                    authorName:
                        description: Author name for commit
                        type: string
                    files:
                        default: []
                        description: Files to commit (empty for all)
                        type: string
                    message:
                        description: Commit message
                        type: string
                    repositoryPath:
                        description: Path to the git repository
                        type: string
                required:
                    - message
                    - repositoryPath
                type: object
            name: git-commit
            permissions:
                - git:read
                - git:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        git-pull:
            description: Git Pull
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    branch:
                        description: Branch to pull
                        type: string
                    rebase:
                        default: false
                        description: Use rebase instead of merge
                        type: boolean
                    remote:
                        default: origin
                        description: 'Remote name (default: origin)'
                        type: string
                    repositoryPath:
                        description: Path to the git repository
                        type: string
                required:
                    - repositoryPath
                type: object
            name: git-pull
            permissions:
                - git:read
                - git:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        git-push:
            credentials:
                - kind: git-credential
                  name: git-credential
            description: Git Push
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    branch:
                        description: Branch to push
                        type: string
                    force:
                        default: false
                        description: Force push
                        type: boolean
                    remote:
                        default: origin
                        description: 'Remote name (default: origin)'
                        type: string
                    repositoryPath:
                        description: Path to the git repository
                        type: string
                required:
                    - repositoryPath
                type: object
            name: git-push
            permissions:
                - git:read
                - git:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        git-status:
            description: Git Status
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    porcelain:
                        default: v1
                        description: Porcelain format version
                        type: string
                    repositoryPath:
                        description: Path to the git repository
                        type: string
                    short:
                        default: true
                        description: Short format output
                        type: boolean
                required:
                    - repositoryPath
                type: object
            name: git-status
            permissions:
                - git:read
                - git:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
    category: devops
    description: Git repository operations for Atlas agents - clone, commit, push, pull, branch, status
    icon: git-branch
    id: skill-git
    installers:
        - id: oci
          kind: oci
          label: Git Skill service image
          package: axiomstudio/skill-git:1.0.0
    name: Git Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-git
        resolvedVersion: 1.0.0
    tags:
        - devops
        - git
        - scm
        - version-control
    transport:
        endpoint: skill-git
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
