apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        argocd-app-create:
            credentials:
                - kind: argocd-credential
                  name: argocd-credential
            description: Argocd App Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    destNamespace:
                        description: Destination namespace
                        type: string
                    destServer:
                        description: Destination cluster URL
                        type: string
                    name:
                        description: Application name
                        type: string
                    path:
                        description: Application path in repo
                        type: string
                    project:
                        default: default
                        description: Project name
                        type: string
                    prune:
                        default: false
                        description: Auto-prune
                        type: boolean
                    repoUrl:
                        description: Git repository URL
                        type: string
                    revision:
                        default: HEAD
                        description: Git revision
                        type: string
                    selfHeal:
                        default: false
                        description: Self-heal
                        type: boolean
                    server:
                        description: ArgoCD server address
                        type: string
                    syncPolicy:
                        description: Sync policy (automated, manual)
                        type: string
                required:
                    - destNamespace
                    - destServer
                    - name
                    - path
                    - repoUrl
                    - server
                type: object
            name: argocd-app-create
            permissions:
                - argocd:read
                - argocd:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
