apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        zendesk-macro:
            credentials:
                - kind: zendesk_api
                  name: zendesk_api
            description: Zendesk Macro
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    macroId:
                        description: Macro ID for get/apply
                        type: integer
                    operation:
                        description: Operation (list, get, apply)
                        type: string
                    subdomain:
                        description: Zendesk subdomain
                        type: string
                    ticketId:
                        description: Ticket ID for apply
                        type: integer
                required:
                    - operation
                    - subdomain
                type: object
            name: zendesk-macro
            permissions:
                - zendesk:read
                - zendesk:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        zendesk-ticket-create:
            credentials:
                - kind: zendesk_api
                  name: zendesk_api
            description: Zendesk Ticket Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    customFields:
                        description: Custom field values
                        type: string
                    description:
                        description: Ticket description
                        type: string
                    priority:
                        description: Priority (low, normal, high, urgent)
                        type: string
                    requester:
                        description: New requester details
                        type: object
                    requesterId:
                        description: Existing user ID
                        type: integer
                    status:
                        description: Status
                        type: string
                    subdomain:
                        description: Zendesk subdomain
                        type: string
                    subject:
                        description: Ticket subject
                        type: string
                    tags:
                        description: Array of tags
                        type: string
                    type:
                        description: Type (question, incident, problem, task)
                        type: string
                required:
                    - description
                    - subdomain
                    - subject
                type: object
            name: zendesk-ticket-create
            permissions:
                - zendesk:read
                - zendesk:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        zendesk-ticket-search:
            credentials:
                - kind: zendesk_api
                  name: zendesk_api
            description: Zendesk Ticket Search
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    assignee:
                        description: Filter by assignee
                        type: string
                    page:
                        default: 1
                        description: Page number
                        type: integer
                    perPage:
                        default: 100
                        description: Results per page
                        type: integer
                    priority:
                        description: Filter by priority
                        type: string
                    query:
                        description: Search query
                        type: string
                    requester:
                        description: Filter by requester
                        type: string
                    status:
                        description: Filter by status
                        type: string
                    subdomain:
                        description: Zendesk subdomain
                        type: string
                    tags:
                        description: Filter by tags
                        type: string
                    type:
                        description: Filter by type
                        type: string
                required:
                    - subdomain
                type: object
            name: zendesk-ticket-search
            permissions:
                - zendesk:read
                - zendesk:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        zendesk-ticket-update:
            credentials:
                - kind: zendesk_api
                  name: zendesk_api
            description: Zendesk Ticket Update
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    assigneeId:
                        description: Assign to user ID
                        type: integer
                    comment:
                        description: Add a comment
                        type: string
                    description:
                        description: New description
                        type: string
                    priority:
                        description: New priority
                        type: string
                    status:
                        description: New status
                        type: string
                    subdomain:
                        description: Zendesk subdomain
                        type: string
                    subject:
                        description: New subject
                        type: string
                    tags:
                        description: Replace existing tags
                        type: string
                    ticketId:
                        description: Ticket ID to update
                        type: integer
                    type:
                        description: New type
                        type: string
                required:
                    - subdomain
                    - ticketId
                type: object
            name: zendesk-ticket-update
            permissions:
                - zendesk:read
                - zendesk:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        zendesk-user:
            credentials:
                - kind: zendesk_api
                  name: zendesk_api
            description: Zendesk User
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    name:
                        description: User name
                        type: string
                    notes:
                        description: User notes
                        type: string
                    operation:
                        description: Operation (get, create, update, search, list)
                        type: string
                    phone:
                        description: Phone number
                        type: string
                    role:
                        description: Role (end-user, agent, admin)
                        type: string
                    subdomain:
                        description: Zendesk subdomain
                        type: string
                    tags:
                        description: User tags
                        type: string
                    userEmail:
                        description: User email
                        type: string
                    userId:
                        description: User ID for get/update
                        type: integer
                required:
                    - operation
                    - subdomain
                type: object
            name: zendesk-user
            permissions:
                - zendesk:read
                - zendesk:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        zendesk-view:
            credentials:
                - kind: zendesk_api
                  name: zendesk_api
            description: Zendesk View
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    operation:
                        description: Operation (list, get, tickets)
                        type: string
                    page:
                        description: Page number for tickets
                        type: integer
                    subdomain:
                        description: Zendesk subdomain
                        type: string
                    viewId:
                        description: View ID for get/tickets
                        type: integer
                required:
                    - operation
                    - subdomain
                type: object
            name: zendesk-view
            permissions:
                - zendesk:read
                - zendesk:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: support
    description: Zendesk support ticket operations for Atlas agents
    icon: life-buoy
    id: skill-zendesk
    installers:
        - id: oci
          kind: oci
          label: Zendesk Skill service image
          package: axiomstudio/skill-zendesk:1.0.0
    name: Zendesk Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-zendesk
        resolvedVersion: 1.0.0
    tags:
        - helpdesk
        - support
        - tickets
        - zendesk
    transport:
        endpoint: skill-zendesk
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
