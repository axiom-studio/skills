apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        linear-comment:
            credentials:
                - kind: linear_api
                  name: linear_api
            description: Linear Comment
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    body:
                        description: Comment body (Markdown)
                        type: string
                    issueId:
                        description: Issue ID
                        type: string
                required:
                    - body
                    - issueId
                type: object
            name: linear-comment
            permissions:
                - linear:read
                - linear:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        linear-cycle:
            credentials:
                - kind: linear_api
                  name: linear_api
            description: Linear Cycle
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    cycleId:
                        description: Cycle ID (required for get operations)
                        type: string
                    operation:
                        description: Operation (list, get, getIssues)
                        type: string
                    teamId:
                        description: Team ID
                        type: string
                required:
                    - operation
                type: object
            name: linear-cycle
            permissions:
                - linear:read
                - linear:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        linear-issue-create:
            credentials:
                - kind: linear_api
                  name: linear_api
            description: Linear Issue Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    assigneeId:
                        description: Assignee user ID
                        type: string
                    description:
                        description: Issue description
                        type: string
                    labelIds:
                        description: Label IDs
                        type: string
                    priority:
                        default: 0
                        description: Priority (-2=urgent, 0=normal)
                        type: integer
                    projectId:
                        description: Project ID
                        type: string
                    teamId:
                        description: Team ID
                        type: string
                    title:
                        description: Issue title
                        type: string
                required:
                    - teamId
                    - title
                type: object
            name: linear-issue-create
            permissions:
                - linear:read
                - linear:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        linear-issue-search:
            credentials:
                - kind: linear_api
                  name: linear_api
            description: Linear Issue Search
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    maxResults:
                        default: 50
                        description: Maximum results
                        type: integer
                    query:
                        description: Linear search query
                        type: string
                    teamId:
                        description: Filter by team ID
                        type: string
                required:
                    - query
                type: object
            name: linear-issue-search
            permissions:
                - linear:read
                - linear:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        linear-issue-update:
            credentials:
                - kind: linear_api
                  name: linear_api
            description: Linear Issue Update
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    assigneeId:
                        description: New assignee ID
                        type: string
                    description:
                        description: New description
                        type: string
                    issueId:
                        description: Issue ID to update
                        type: string
                    priority:
                        description: New priority
                        type: integer
                    stateId:
                        description: New state ID
                        type: string
                    title:
                        description: New title
                        type: string
                required:
                    - issueId
                type: object
            name: linear-issue-update
            permissions:
                - linear:read
                - linear:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        linear-project:
            credentials:
                - kind: linear_api
                  name: linear_api
            description: Linear Project
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    operation:
                        description: Operation (list, get, getIssues)
                        type: string
                    projectId:
                        description: Project ID (required for get operations)
                        type: string
                    teamId:
                        description: Team ID
                        type: string
                required:
                    - operation
                type: object
            name: linear-project
            permissions:
                - linear:read
                - linear:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: project-management
    description: Linear issue tracking operations for Atlas agents
    icon: check-square
    id: skill-linear
    installers:
        - id: oci
          kind: oci
          label: Linear Skill service image
          package: axiomstudio/skill-linear:1.0.0
    name: Linear Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-linear
        resolvedVersion: 1.0.0
    tags:
        - agile
        - issues
        - linear
        - tracking
    transport:
        endpoint: skill-linear
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
