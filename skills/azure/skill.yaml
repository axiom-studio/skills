apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        azure-aks-get-credentials:
            credentials:
                - kind: azure_credentials
                  name: azure_credentials
            description: Azure Aks Get Credentials
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    clusterName:
                        description: AKS cluster name
                        type: string
                    resourceGroup:
                        description: Resource group name
                        type: string
                    subscriptionId:
                        description: Azure subscription ID
                        type: string
                required:
                    - clusterName
                    - resourceGroup
                    - subscriptionId
                type: object
            name: azure-aks-get-credentials
            permissions:
                - azure:read
                - azure:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        azure-aks-list:
            credentials:
                - kind: azure_credentials
