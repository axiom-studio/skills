                        type: object
                    functionAppName:
                        description: Function app name
                        type: string
                    functionName:
                        description: Function name
                        type: string
                    headers:
                        description: Request headers
                        type: object
                    method:
                        default: POST
                        description: HTTP method
                        type: string
