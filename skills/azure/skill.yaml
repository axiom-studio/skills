                        description: Destination blob name
                        type: string
                    container:
                        description: Container name
                        type: string
                    content:
                        description: File content (text or base64)
                        type: string
                    contentType:
                        default: application/octet-stream
                        description: Content type (e.g., application/json)
                        type: string
                    storageAccount:
                        description: Storage account name
                        type: string
                    subscriptionId:
                        description: Azure subscription ID
                        type: string
                required:
                    - blobName
                    - container
                    - content
                    - storageAccount
                    - subscriptionId
                type: object
            name: azure-blob-upload
            permissions:
                - azure:read
                - azure:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
