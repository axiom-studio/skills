            description: Azure Aks List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    resourceGroup:
                        description: Filter by resource group name
                        type: string
                    subscriptionId:
                        description: Azure subscription ID
                        type: string
                required:
                    - subscriptionId
                type: object
            name: azure-aks-list
            permissions:
                - azure:read
                - azure:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
