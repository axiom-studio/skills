apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        discord-channel:
            credentials:
                - kind: discord_bot_token
                  name: discord_bot_token
            description: Discord Channel
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (create, list, get, delete, update)
                        type: string
                    channelId:
                        description: Channel ID (required for get/delete/update)
                        type: string
                    channelType:
                        default: text
                        description: Channel type (text, voice, category, announcement)
                        type: string
                    guildId:
                        description: Server/Guild ID
                        type: string
                    name:
                        description: Channel name (required for create)
                        type: string
                    nsfw:
                        default: false
                        description: Mark as NSFW
                        type: boolean
                    reason:
                        description: Audit log reason
                        type: string
                    topic:
                        description: Channel topic
                        type: string
                required:
                    - action
                    - guildId
                type: object
            name: discord-channel
            permissions:
                - discord:manage
                - discord:read
                - discord:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        discord-embed:
            credentials:
                - kind: discord_bot_token
                  name: discord_bot_token
            description: Discord Embed
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    authorIcon:
                        description: Author icon URL
                        type: string
                    authorName:
                        description: Author name
                        type: string
                    authorURL:
                        description: Author URL
                        type: string
                    channelId:
                        description: Channel ID
                        type: string
                    color:
                        default: '#5865F2'
                        description: Embed color in hex
                        type: string
                    content:
                        description: Message content above embed
                        type: string
                    description:
                        description: Embed description
                        type: string
                    fields:
                        description: Array of embed fields
                        type: string
                    footerIcon:
                        description: Footer icon URL
                        type: string
                    footerText:
                        description: Footer text
                        type: string
                    image:
                        description: Main image URL
                        type: string
                    thumbnail:
                        description: Thumbnail image URL
                        type: string
                    timestamp:
                        default: true
                        description: Include current timestamp
                        type: boolean
                    title:
                        description: Embed title
                        type: string
                    url:
                        description: Embed title URL
                        type: string
                required:
                    - channelId
                    - description
                    - title
                type: object
            name: discord-embed
            permissions:
                - discord:manage
                - discord:read
                - discord:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        discord-react:
            credentials:
                - kind: discord_bot_token
                  name: discord_bot_token
            description: Discord React
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channelId:
                        description: Channel ID
                        type: string
                    emoji:
                        description: Emoji to react with
                        type: string
                    emojiName:
                        description: Custom emoji name
                        type: string
                    emojiType:
                        default: unicode
                        description: Type of emoji (unicode, custom)
                        type: string
                    messageId:
                        description: Message ID to react to
                        type: string
                required:
                    - channelId
                    - emoji
                    - messageId
                type: object
            name: discord-react
            permissions:
                - discord:manage
                - discord:read
                - discord:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        discord-send:
            credentials:
                - kind: discord_bot_token
                  name: discord_bot_token
            description: Discord Send
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    channelId:
                        description: Channel ID to send message
                        type: string
                    content:
                        description: Message content
                        type: string
                    mentionUser:
                        default: false
                        description: Mention user when replying
                        type: boolean
                    replyTo:
                        description: Message ID to reply to
                        type: string
                    tts:
                        default: false
                        description: Send as text-to-speech
                        type: boolean
                required:
                    - channelId
                    - content
                type: object
            name: discord-send
            permissions:
                - discord:manage
                - discord:read
                - discord:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        discord-user:
            credentials:
                - kind: discord_bot_token
                  name: discord_bot_token
            description: Discord User
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (get, kick, ban, unban, timeout, get-role, add-role, remove-role)
                        type: string
                    deleteDays:
                        default: 0
                        description: Days of messages to delete on ban (0-7)
                        type: integer
                    duration:
                        description: Timeout duration in seconds
                        type: integer
                    guildId:
                        description: Server/Guild ID
                        type: string
                    reason:
                        description: Audit log reason
                        type: string
                    roleId:
                        description: Role ID (required for role operations)
                        type: string
                    userId:
                        description: User ID
                        type: string
                required:
                    - action
                    - guildId
                    - userId
                type: object
            name: discord-user
            permissions:
                - discord:manage
                - discord:read
                - discord:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        discord-webhook:
            description: Discord Webhook
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    avatarUrl:
                        description: Override webhook avatar URL
                        type: string
                    content:
                        description: Message content
                        type: string
                    threadId:
                        description: Send to specific thread
                        type: string
                    tts:
                        default: false
                        description: Send as text-to-speech
                        type: boolean
                    username:
                        description: Override webhook username
                        type: string
                    wait:
                        default: false
                        description: Wait for server confirmation
                        type: boolean
                    webhookUrl:
                        description: Discord webhook URL
                        type: string
                required:
                    - content
                    - webhookUrl
                type: object
            name: discord-webhook
            permissions:
                - discord:manage
                - discord:read
                - discord:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: communication
    description: Discord messaging operations for Atlas agents
    icon: message-square
    id: skill-discord
    installers:
        - id: oci
          kind: oci
          label: Discord Skill service image
          package: axiomstudio/skill-discord:1.0.0
    name: Discord Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-discord
        resolvedVersion: 1.0.0
    tags:
        - bot
        - chat
        - discord
        - messaging
    transport:
        endpoint: skill-discord
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
