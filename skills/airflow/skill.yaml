apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        airflow-connection-list:
            credentials:
                - kind: airflow-credential
                  name: airflow-credential
            description: Airflow Connection List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    baseUrl:
                        description: Airflow web URL
                        type: string
                required:
                    - baseUrl
                type: object
            name: airflow-connection-list
            permissions:
                - airflow:read
                - airflow:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airflow-dag-list:
            credentials:
                - kind: airflow-credential
                  name: airflow-credential
            description: Airflow Dag List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    baseUrl:
                        description: Airflow web URL
                        type: string
                    paused:
                        description: Filter by paused status
                        type: boolean
                    tags:
                        description: Filter DAGs by tags
                        type: string
                required:
                    - baseUrl
                type: object
            name: airflow-dag-list
            permissions:
                - airflow:read
                - airflow:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airflow-dag-pause:
            credentials:
                - kind: airflow-credential
                  name: airflow-credential
            description: Airflow Dag Pause
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    baseUrl:
                        description: Airflow web URL
                        type: string
                    dagId:
                        description: DAG ID to pause
                        type: string
                required:
                    - baseUrl
                    - dagId
                type: object
            name: airflow-dag-pause
            permissions:
                - airflow:read
                - airflow:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        airflow-dag-status:
            credentials:
                - kind: airflow-credential
                  name: airflow-credential
            description: Airflow Dag Status
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    baseUrl:
                        description: Airflow web URL
                        type: string
                    dagId:
                        description: DAG ID
                        type: string
                    dagRunId:
                        description: DAG run ID
                        type: string
                required:
                    - baseUrl
                    - dagId
                    - dagRunId
                type: object
            name: airflow-dag-status
            permissions:
                - airflow:read
                - airflow:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airflow-dag-trigger:
            credentials:
                - kind: airflow-credential
                  name: airflow-credential
            description: Airflow Dag Trigger
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    baseUrl:
                        description: Airflow web URL
                        type: string
                    conf:
                        description: DAG run configuration
                        type: object
                    dagId:
                        description: DAG ID to trigger
                        type: string
                    logicalDate:
                        description: Logical date for the run
                        type: string
                required:
                    - baseUrl
                    - dagId
                type: object
            name: airflow-dag-trigger
            permissions:
                - airflow:read
                - airflow:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        airflow-dag-unpause:
            credentials:
                - kind: airflow-credential
                  name: airflow-credential
            description: Airflow Dag Unpause
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    baseUrl:
                        description: Airflow web URL
                        type: string
                    dagId:
                        description: DAG ID to unpause
                        type: string
                required:
                    - baseUrl
                    - dagId
                type: object
            name: airflow-dag-unpause
            permissions:
                - airflow:read
                - airflow:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        airflow-run-list:
            credentials:
                - kind: airflow-credential
                  name: airflow-credential
            description: Airflow Run List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    baseUrl:
                        description: Airflow web URL
                        type: string
                    dagId:
                        description: DAG ID
                        type: string
                required:
                    - baseUrl
                type: object
            name: airflow-run-list
            permissions:
                - airflow:read
                - airflow:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airflow-task-list:
            credentials:
                - kind: airflow-credential
                  name: airflow-credential
            description: Airflow Task List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    baseUrl:
                        description: Airflow web URL
                        type: string
                    dagId:
                        description: DAG ID
                        type: string
                required:
                    - baseUrl
                    - dagId
                type: object
            name: airflow-task-list
            permissions:
                - airflow:read
                - airflow:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        airflow-task-logs:
            credentials:
                - kind: airflow-credential
                  name: airflow-credential
            description: Airflow Task Logs
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    baseUrl:
                        description: Airflow web URL
                        type: string
                    dagId:
                        description: DAG ID
                        type: string
                    dagRunId:
                        description: DAG run ID
                        type: string
                    taskId:
                        description: Task ID
                        type: string
                    tryNumber:
                        description: Try number
                        type: integer
                required:
                    - baseUrl
                    - dagId
                    - dagRunId
                    - taskId
                type: object
            name: airflow-task-logs
            permissions:
                - airflow:read
                - airflow:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
    category: data
    description: Apache Airflow workflow orchestration for Atlas agents
    icon: wind
    id: skill-airflow
    installers:
        - id: oci
          kind: oci
          label: Apache Airflow Skill service image
          package: axiomstudio/skill-airflow:1.0.0
    name: Apache Airflow Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-airflow
        resolvedVersion: 1.0.0
    tags:
        - airflow
        - dag
        - orchestration
        - workflow
    transport:
        endpoint: skill-airflow
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
