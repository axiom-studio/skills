apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        google-calendar-create-event:
            credentials:
                - kind: google_access_token
                  name: google_access_token
                  oauth2:
                    provider: google
                    scopes:
                        - https://www.googleapis.com/auth/calendar.events
                    subject: user
            description: Create event in Google Calendar.
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    body:
                        additionalProperties: true
                        description: Google API request body for this exact operation. Use the service's documented JSON fields.
                        type: object
                    calendarId:
                        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method. If you want to access the primary calendar of the currently logged in user, use the "primary" keyword.
                        maxLength: 1024
                        minLength: 1
                        type: string
                    conferenceDataVersion:
                        description: Version number of conference data supported by the API client. Version 0 assumes no conference data support and ignores conference data in the event's body. Version 1 enables support for copying of ConferenceData as well as for creating new conferences using the createRequest field of conferenceData. The default is 0.
                        maximum: 1
                        minimum: 0
                        type: integer
                    eventLabelVersion:
                        description: Version number of the event label feature supported by the API client. Version 0 assumes no event label support and processes the colorId field for color management. Version 1 enables support for event labels, and processes the eventLabelId in the event's body. In this case, the colorId field is ignored. The default is 0.
                        maximum: 1
                        minimum: 0
                        type: integer
                    fields:
                        description: Google partial response fields projection. Select fields from this operation's response schema; request parameters and metadata values are not response field names.
                        maxLength: 8192
                        type: string
                    maxAttendees:
                        description: The maximum number of attendees to include in the response. If there are more than the specified number of attendees, only the participant is returned. Optional.
                        minimum: 1
                        type: integer
                    sendNotifications:
                        description: |-
                            Deprecated. Please use sendUpdates instead.

                            Whether to send notifications about the creation of the new event. Note that some emails might still be sent even if you set the value to false. The default is false.
                        type: boolean
                    sendUpdates:
                        description: 'Whether to send notifications about the creation of the new event. Note that some emails might still be sent. The default is false. all: Notifications are sent to all guests. externalOnly: Notifications are sent to non-Google Calendar guests only. none: No notifications are sent. Warning: Using the value none can have significant adverse effects, including events not syncing to external calendars or events being lost altogether for some users. For calendar migration tasks, consider using the events.import method instead.'
                        enum:
                            - all
                            - externalOnly
                            - none
                        maxLength: 8192
                        type: string
                    supportsAttachments:
                        description: Whether API client performing operation supports event attachments. Optional. The default is False.
                        type: boolean
                required:
                    - body
                    - calendarId
                type: object
            name: google-calendar-create-event
            outputSchema:
                additionalProperties: true
                type: object
            permissions:
                - google:calendar:external
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        google-calendar-delete-event:
            credentials:
                - kind: google_access_token
                  name: google_access_token
                  oauth2:
                    provider: google
                    scopes:
                        - https://www.googleapis.com/auth/calendar.events
                    subject: user
            description: Delete event in Google Calendar.
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    calendarId:
                        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method. If you want to access the primary calendar of the currently logged in user, use the "primary" keyword.
                        maxLength: 1024
                        minLength: 1
                        type: string
                    eventId:
                        description: Event identifier.
                        maxLength: 1024
                        minLength: 1
                        type: string
                    fields:
                        description: Google partial response fields projection. Select fields from this operation's response schema; request parameters and metadata values are not response field names.
                        maxLength: 8192
                        type: string
                    sendNotifications:
                        description: |-
                            Deprecated. Please use sendUpdates instead.

                            Whether to send notifications about the deletion of the event. Note that some emails might still be sent even if you set the value to false. The default is false.
                        type: boolean
                    sendUpdates:
                        description: 'Guests who should receive notifications about the deletion of the event. all: Notifications are sent to all guests. externalOnly: Notifications are sent to non-Google Calendar guests only. none: No notifications are sent. For calendar migration tasks, consider using the Events.import method instead.'
                        enum:
                            - all
                            - externalOnly
                            - none
                        maxLength: 8192
                        type: string
                required:
                    - calendarId
                    - eventId
                type: object
            name: google-calendar-delete-event
            outputSchema:
                additionalProperties: true
                type: object
            permissions:
                - google:calendar:destructive
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        google-calendar-get-event:
            credentials:
                - kind: google_access_token
                  name: google_access_token
                  oauth2:
                    provider: google
                    scopes:
                        - https://www.googleapis.com/auth/calendar.events
                    subject: user
            description: Get event in Google Calendar.
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    alwaysIncludeEmail:
                        description: Deprecated and ignored. A value will always be returned in the email field for the organizer, creator and attendees, even if no real email address is available (i.e. a generated, non-working value will be provided).
                        type: boolean
                    calendarId:
                        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method. If you want to access the primary calendar of the currently logged in user, use the "primary" keyword.
                        maxLength: 1024
                        minLength: 1
                        type: string
                    eventId:
                        description: Event identifier.
                        maxLength: 1024
                        minLength: 1
                        type: string
                    fields:
                        description: Google partial response fields projection. Select fields from this operation's response schema; request parameters and metadata values are not response field names.
                        maxLength: 8192
                        type: string
                    maxAttendees:
                        description: The maximum number of attendees to include in the response. If there are more than the specified number of attendees, only the participant is returned. Optional.
                        minimum: 1
                        type: integer
                    timeZone:
                        description: Time zone used in the response. Optional. The default is the time zone of the calendar.
                        maxLength: 8192
                        type: string
                required:
                    - calendarId
                    - eventId
                type: object
            name: google-calendar-get-event
            outputSchema:
                additionalProperties: true
                type: object
            permissions:
                - google:calendar:read
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        google-calendar-list-calendars:
            credentials:
                - kind: google_access_token
                  name: google_access_token
                  oauth2:
                    provider: google
                    scopes:
                        - https://www.googleapis.com/auth/calendar.calendarlist.readonly
                    subject: user
            description: List calendars in Google Calendar.
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    fields:
                        description: Google partial response fields projection. Select fields from this operation's response schema; request parameters and metadata values are not response field names.
                        maxLength: 8192
                        type: string
                    maxResults:
                        description: Maximum number of entries returned on one result page. By default the value is 100 entries. The page size can never be larger than 250 entries. Optional.
                        minimum: 1
                        type: integer
                    minAccessRole:
                        description: 'The minimum access role for the user in the returned entries. Optional. The default is no restriction. freeBusyReader: The user can read free/busy information. owner: The user can read and modify events and access control lists. reader: The user can read events that are not private. writer: The user can read and modify events. writerWithoutPrivateAccess: The user can read and modify events that aren''t private. The user can read free/busy information about private events. The user can''t modify private events.'
                        enum:
                            - freeBusyReader
                            - owner
                            - reader
                            - writer
                            - writerWithoutPrivateAccess
                        maxLength: 8192
                        type: string
                    pageToken:
                        description: Token specifying which result page to return. Optional.
                        maxLength: 8192
                        type: string
                    showDeleted:
                        description: Whether to include deleted calendar list entries in the result. Optional. The default is False.
                        type: boolean
                    showHidden:
                        description: Whether to show hidden entries. Optional. The default is False.
                        type: boolean
                    showOwnOrganizationOnly:
                        description: Whether to show only entries for calendars from the organization. This parameter is only applicable to Google Workspace users. Optional. The default is False.
                        type: boolean
                    syncToken:
                        description: |-
                            Token obtained from the nextSyncToken field returned on the last page of results from the previous list request. It makes the result of this list request contain only entries that have changed since then. If only read-only fields such as calendar properties or ACLs have changed, the entry won't be returned. All entries deleted and hidden since the previous list request will always be in the result set and it is not allowed to set showDeleted neither showHidden to False.
                            To ensure client state consistency minAccessRole and showOwnOrganizationOnly query parameters cannot be specified together with nextSyncToken.
                            If the syncToken expires, the server will respond with a 410 GONE response code and the client should clear its storage and perform a full synchronization without any syncToken.
                            Learn more about incremental synchronization.
                            Optional. The default is to return all entries.
                        maxLength: 8192
                        type: string
                type: object
            name: google-calendar-list-calendars
            outputSchema:
                additionalProperties: true
                type: object
            permissions:
                - google:calendar:read
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        google-calendar-list-events:
            credentials:
                - kind: google_access_token
                  name: google_access_token
                  oauth2:
                    provider: google
                    scopes:
                        - https://www.googleapis.com/auth/calendar.events
                    subject: user
            description: List events in Google Calendar.
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    alwaysIncludeEmail:
                        description: Deprecated and ignored.
                        type: boolean
                    calendarId:
                        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method. If you want to access the primary calendar of the currently logged in user, use the "primary" keyword.
                        maxLength: 1024
                        minLength: 1
                        type: string
                    eventTypes:
                        description: 'Event types to return. Optional. This parameter can be repeated multiple times to return events of different types. If unset, returns all event types. birthday: Special all-day events with an annual recurrence. default: Regular events. focusTime: Focus time events. fromGmail: Events from Gmail. outOfOffice: Out of office events. workingLocation: Working location events.'
                        items:
                            enum:
                                - birthday
                                - default
                                - focusTime
                                - fromGmail
                                - outOfOffice
                                - workingLocation
                            maxLength: 8192
                            type: string
                        maxItems: 100
                        type: array
                    fields:
                        description: Google partial response fields projection. Select fields from this operation's response schema; request parameters and metadata values are not response field names.
                        maxLength: 8192
                        type: string
                    iCalUID:
                        description: Specifies an event ID in the iCalendar format to be provided in the response. Optional. Use this if you want to search for an event by its iCalendar ID.
                        maxLength: 8192
                        type: string
                    maxAttendees:
                        description: The maximum number of attendees to include in the response. If there are more than the specified number of attendees, only the participant is returned. Optional.
                        minimum: 1
                        type: integer
                    maxResults:
                        description: Maximum number of events returned on one result page. The number of events in the resulting page may be less than this value, or none at all, even if there are more events matching the query. Incomplete pages can be detected by a non-empty nextPageToken field in the response. By default the value is 250 events. The page size can never be larger than 2500 events. Optional.
                        minimum: 1
                        type: integer
                    orderBy:
                        description: 'The order of the events returned in the result. Optional. The default is an unspecified, stable order. startTime: Order by the start date/time (ascending). This is only available when querying single events (i.e. the parameter singleEvents is True) updated: Order by last modification time (ascending).'
                        enum:
                            - startTime
                            - updated
                        maxLength: 8192
                        type: string
                    pageToken:
                        description: Token specifying which result page to return. Optional.
                        maxLength: 8192
                        type: string
                    privateExtendedProperty:
                        description: Extended properties constraint specified as propertyName=value. Matches only private properties. This parameter might be repeated multiple times to return events that match all given constraints.
                        items:
                            maxLength: 8192
                            type: string
                        maxItems: 100
                        type: array
                    q:
                        description: "Free text search terms to find events that match these terms in the following fields:\n\n- summary \n- description \n- location \n- attendee's displayName \n- attendee's email \n- organizer's displayName \n- organizer's email \n- workingLocationProperties.officeLocation.buildingId \n- workingLocationProperties.officeLocation.deskId \n- workingLocationProperties.officeLocation.label \n- workingLocationProperties.customLocation.label \nThese search terms also match predefined keywords against all display title translations of working location, out-of-office, and focus-time events. For example, searching for \"Office\" or \"Bureau\" returns working location events of type officeLocation, whereas searching for \"Out of office\" or \"Abwesend\" returns out-of-office events. Optional."
                        maxLength: 8192
                        type: string
                    sharedExtendedProperty:
                        description: Extended properties constraint specified as propertyName=value. Matches only shared properties. This parameter might be repeated multiple times to return events that match all given constraints.
                        items:
                            maxLength: 8192
                            type: string
                        maxItems: 100
                        type: array
                    showDeleted:
                        description: Whether to include deleted events (with status equals "cancelled") in the result. Cancelled instances of recurring events (but not the underlying recurring event) will still be included if showDeleted and singleEvents are both False. If showDeleted and singleEvents are both True, only single instances of deleted events (but not the underlying recurring events) are returned. Optional. The default is False.
                        type: boolean
                    showHiddenInvitations:
                        description: Whether to include hidden invitations in the result. Optional. The default is False.
                        type: boolean
                    singleEvents:
                        description: Whether to expand recurring events into instances and only return single one-off events and instances of recurring events, but not the underlying recurring events themselves. Optional. The default is False.
                        type: boolean
                    syncToken:
                        description: "Token obtained from the nextSyncToken field returned on the last page of results from the previous list request. It makes the result of this list request contain only entries that have changed since then. All events deleted since the previous list request will always be in the result set and it is not allowed to set showDeleted to False.\nThere are several query parameters that cannot be specified together with nextSyncToken to ensure consistency of the client state.\n\nThese are: \n- iCalUID \n- orderBy \n- privateExtendedProperty \n- q \n- sharedExtendedProperty \n- timeMin \n- timeMax \n- updatedMin All other query parameters should be the same as for the initial synchronization to avoid undefined behavior. If the syncToken expires, the server will respond with a 410 GONE response code and the client should clear its storage and perform a full synchronization without any syncToken.\nLearn more about incremental synchronization.\nOptional. The default is to return all entries."
                        maxLength: 8192
                        type: string
                    timeMax:
                        description: Upper bound (exclusive) for an event's start time to filter by. Optional. The default is not to filter by start time. Must be an RFC3339 timestamp with mandatory time zone offset, for example, 2011-06-03T10:00:00-07:00, 2011-06-03T10:00:00Z. Milliseconds may be provided but are ignored. If timeMin is set, timeMax must be greater than timeMin.
                        maxLength: 8192
                        type: string
                    timeMin:
                        description: Lower bound (exclusive) for an event's end time to filter by. Optional. The default is not to filter by end time. Must be an RFC3339 timestamp with mandatory time zone offset, for example, 2011-06-03T10:00:00-07:00, 2011-06-03T10:00:00Z. Milliseconds may be provided but are ignored. If timeMax is set, timeMin must be smaller than timeMax.
                        maxLength: 8192
                        type: string
                    timeZone:
                        description: Time zone used in the response. Optional. The default is the time zone of the calendar.
                        maxLength: 8192
                        type: string
                    updatedMin:
                        description: Lower bound for an event's last modification time (as a RFC3339 timestamp) to filter by. When specified, entries deleted since this time will always be included regardless of showDeleted. Optional. The default is not to filter by last modification time.
                        maxLength: 8192
                        type: string
                required:
                    - calendarId
                type: object
            name: google-calendar-list-events
            outputSchema:
                additionalProperties: true
                type: object
            permissions:
                - google:calendar:read
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        google-calendar-update-event:
            credentials:
                - kind: google_access_token
                  name: google_access_token
                  oauth2:
                    provider: google
                    scopes:
                        - https://www.googleapis.com/auth/calendar.events
                    subject: user
            description: Update event in Google Calendar.
            idempotency: required
            inputSchema:
                additionalProperties: false
