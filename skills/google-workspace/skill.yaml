                    alwaysIncludeEmail:
                        description: Deprecated and ignored. A value will always be returned in the email field for the organizer, creator and attendees, even if no real email address is available (i.e. a generated, non-working value will be provided).
                        type: boolean
                    body:
                        additionalProperties: true
                        description: Google API request body for this exact operation. Use the service's documented JSON fields.
                        type: object
                    calendarId:
                        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method. If you want to access the primary calendar of the currently logged in user, use the "primary" keyword.
                        maxLength: 1024
                        minLength: 1
                        type: string
                    conferenceDataVersion:
                        description: Version number of conference data supported by the API client. Version 0 assumes no conference data support and ignores conference data in the event's body. Version 1 enables support for copying of ConferenceData as well as for creating new conferences using the createRequest field of conferenceData. The default is 0.
                        maximum: 1
                        minimum: 0
                        type: integer
                    eventId:
                        description: Event identifier.
                        maxLength: 1024
                        minLength: 1
                        type: string
                    eventLabelVersion:
                        description: Version number of the event label feature supported by the API client. Version 0 assumes no event label support and processes the colorId field for color management. Version 1 enables support for event labels, and processes the eventLabelId in the event's body. In this case, the colorId field is ignored. The default is 0.
                        maximum: 1
                        minimum: 0
                        type: integer
                    fields:
                        description: Google partial response fields projection. Select fields from this operation's response schema; request parameters and metadata values are not response field names.
                        maxLength: 8192
                        type: string
                    maxAttendees:
                        description: The maximum number of attendees to include in the response. If there are more than the specified number of attendees, only the participant is returned. Optional.
                        minimum: 1
                        type: integer
                    sendNotifications:
                        description: |-
                            Deprecated. Please use sendUpdates instead.

                            Whether to send notifications about the event update (for example, description changes, etc.). Note that some emails might still be sent even if you set the value to false. The default is false.
                        type: boolean
                    sendUpdates:
                        description: 'Guests who should receive notifications about the event update (for example, title changes, etc.). all: Notifications are sent to all guests. externalOnly: Notifications are sent to non-Google Calendar guests only. none: No notifications are sent. For calendar migration tasks, consider using the Events.import method instead.'
                        enum:
                            - all
                            - externalOnly
                            - none
                        maxLength: 8192
                        type: string
                    supportsAttachments:
                        description: Whether API client performing operation supports event attachments. Optional. The default is False.
                        type: boolean
                required:
                    - body
                    - calendarId
                    - eventId
                type: object
            name: google-calendar-update-event
            outputSchema:
                additionalProperties: true
                type: object
            permissions:
