apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        hf-dataset-download:
            credentials:
                - kind: huggingface-credential
                  name: huggingface-credential
            description: Hf Dataset Download
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    config:
                        description: Dataset config name
                        type: string
                    datasetId:
                        description: Dataset ID
                        type: string
                    split:
                        default: train
                        description: Dataset split (train, test, validation)
                        type: string
                required:
                    - datasetId
                type: object
            name: hf-dataset-download
            permissions:
                - huggingface:read
                - huggingface:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        hf-dataset-list:
            credentials:
                - kind: huggingface-credential
                  name: huggingface-credential
            description: Hf Dataset List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    filter:
                        description: Filter by task or library
                        type: string
                    limit:
                        default: 20
                        description: Max results
                        type: integer
                    search:
                        description: Search query
                        type: string
                type: object
            name: hf-dataset-list
            permissions:
                - huggingface:read
                - huggingface:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        hf-inference:
            credentials:
                - kind: huggingface-credential
                  name: huggingface-credential
            description: Hf Inference
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    inputs:
                        description: Input text/data
                        type: string
                    model:
                        description: Model ID
                        type: string
                    parameters:
                        description: Model parameters
                        type: object
                required:
                    - inputs
                    - model
                type: object
            name: hf-inference
            permissions:
                - huggingface:read
                - huggingface:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        hf-model-download:
            credentials:
                - kind: huggingface-credential
                  name: huggingface-credential
            description: Hf Model Download
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    filename:
                        description: Specific file to download
                        type: string
                    modelId:
                        description: Model ID
                        type: string
                required:
                    - modelId
                type: object
            name: hf-model-download
            permissions:
                - huggingface:read
                - huggingface:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        hf-model-info:
            credentials:
                - kind: huggingface-credential
                  name: huggingface-credential
            description: Hf Model Info
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    modelId:
                        description: Model ID
                        type: string
                required:
                    - modelId
                type: object
            name: hf-model-info
            permissions:
                - huggingface:read
                - huggingface:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        hf-model-list:
            credentials:
                - kind: huggingface-credential
                  name: huggingface-credential
            description: Hf Model List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    filter:
                        description: Filter by task or library
                        type: string
                    limit:
                        default: 20
                        description: Max results
                        type: integer
                    search:
                        description: Search query
                        type: string
                    sort:
                        default: downloads
                        description: Sort by (downloads, likes)
                        type: string
                type: object
            name: hf-model-list
            permissions:
                - huggingface:read
                - huggingface:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        hf-space-create:
            credentials:
                - kind: huggingface-credential
                  name: huggingface-credential
            description: Hf Space Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    sdk:
                        description: SDK (gradio, streamlit, static)
                        type: string
                    spaceId:
                        description: Space ID (user/name)
                        type: string
                    title:
                        description: Space title
                        type: string
                required:
                    - sdk
                    - spaceId
                type: object
            name: hf-space-create
            permissions:
                - huggingface:read
                - huggingface:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        hf-space-list:
            credentials:
                - kind: huggingface-credential
                  name: huggingface-credential
            description: Hf Space List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    author:
                        description: Filter by author
                        type: string
                    limit:
                        default: 20
                        description: Max results
                        type: integer
                    search:
                        description: Search query
                        type: string
                type: object
            name: hf-space-list
            permissions:
                - huggingface:read
                - huggingface:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
    category: ai
    description: Hugging Face model hub operations for Atlas agents
    icon: cpu
    id: skill-huggingface
    installers:
        - id: oci
          kind: oci
          label: Hugging Face Skill service image
          package: axiomstudio/skill-huggingface:1.0.0
    name: Hugging Face Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-huggingface
        resolvedVersion: 1.0.0
    tags:
        - huggingface
        - inference
        - ml
        - models
    transport:
        endpoint: skill-huggingface
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
