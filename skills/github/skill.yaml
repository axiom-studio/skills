apiVersion: openseal.dev/v1alpha1
kind: SkillDefinition
definition:
    id: skill-github
    version: 1.3.1
    name: GitHub Skill
    description: Governed GitHub repository, issue, pull-request, and Actions operations for OpenSeal Agents.
    category: devops
    icon: github
    tags: [github, git, repository, issue, pull-request, actions]
    transport:
        kind: tool
        endpoint: skill-github
    actions:
        github-pull-request-create:
            name: github-pull-request-create
            description: Create an idempotent pull request in one GitHub repository.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, title, head, base]
                properties:
                    owner:
                        type: string
                        pattern: '^[A-Za-z0-9_.-]{1,100}$'
                        description: GitHub organization or user.
                    repository:
                        type: string
                        pattern: '^[A-Za-z0-9_.-]{1,100}$'
                        description: GitHub repository name.
                    title:
                        type: string
                        minLength: 1
                        maxLength: 256
                    body:
                        type: string
                        maxLength: 65536
                    head:
                        type: string
                        pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$'
                        description: Source branch already pushed to GitHub.
                    base:
                        type: string
                        pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$'
                        description: Destination branch.
            outputSchema:
                type: object
                additionalProperties: false
                required: [pullRequest]
                properties:
                    pullRequest:
                        type: object
                        additionalProperties: true
            sideEffect: external
            risk: external
            permissions: [github:pull-requests:write]
            credentials:
                - name: token
                  kind: github_token
            retry:
                maxAttempts: 1
            idempotency: required
        github-pull-request-list:
            name: github-pull-request-list
            description: List bounded pull requests in one GitHub repository.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository]
                properties:
                    owner:
                        type: string
                        pattern: '^[A-Za-z0-9_.-]{1,100}$'
                    repository:
                        type: string
                        pattern: '^[A-Za-z0-9_.-]{1,100}$'
                    state:
                        type: string
                        enum: [open, closed, all]
                        default: open
            outputSchema:
                type: object
                additionalProperties: false
                required: [pullRequests, count]
                properties:
                    pullRequests:
                        type: array
                        maxItems: 50
                        items:
                            type: object
                            additionalProperties: true
                    count:
                        type: integer
                        minimum: 0
                        maximum: 50
            sideEffect: read
            risk: read
            permissions: [github:pull-requests:read]
            credentials:
                - name: token
                  kind: github_token
            retry:
                maxAttempts: 3
            idempotency: supported
        github-pull-request-get:
            name: github-pull-request-get
            description: Read one pull request with its current head/base revisions and bounded summary metadata.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, number]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    number: {type: integer, minimum: 1}
            outputSchema:
                type: object
                additionalProperties: false
                required: [pullRequest]
                properties:
                    pullRequest: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:pull-requests:read]
            credentials:
                - name: token
                  kind: github_token
            retry: {maxAttempts: 3}
            idempotency: supported
        github-pull-request-files:
            name: github-pull-request-files
            description: Read up to 100 changed files and bounded GitHub patch fragments for one pull request.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, number]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    number: {type: integer, minimum: 1}
            outputSchema:
                type: object
                additionalProperties: false
                required: [files, count]
                properties:
                    files:
                        type: array
                        maxItems: 100
                        items: {type: object, additionalProperties: true}
                    count: {type: integer, minimum: 0, maximum: 100}
            sideEffect: read
            risk: read
            permissions: [github:pull-requests:read]
            credentials:
                - name: token
                  kind: github_token
            retry: {maxAttempts: 3}
            idempotency: supported
        github-repository-get:
            name: github-repository-get
            description: Read metadata for one GitHub repository.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository]
                properties:
                    owner:
                        type: string
                        pattern: '^[A-Za-z0-9_.-]{1,100}$'
                    repository:
                        type: string
                        pattern: '^[A-Za-z0-9_.-]{1,100}$'
            outputSchema:
                type: object
                additionalProperties: false
                required: [repository]
                properties:
                    repository:
                        type: object
                        additionalProperties: true
            sideEffect: read
            risk: read
            permissions: [github:repositories:read]
            credentials:
                - name: token
                  kind: github_token
            retry:
                maxAttempts: 3
            idempotency: supported
        github-pull-request-review-create:
            name: github-pull-request-review-create
            description: Submit a COMMENT, APPROVE, or REQUEST_CHANGES review for one exact pull request revision.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, number, event, body]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    number: {type: integer, minimum: 1}
                    event: {type: string, enum: [COMMENT, APPROVE, REQUEST_CHANGES]}
                    body: {type: string, minLength: 1, maxLength: 65536}
                    commitId: {type: string, pattern: '^[a-fA-F0-9]{40}$'}
            outputSchema:
                type: object
                additionalProperties: false
                required: [review]
                properties:
                    review: {type: object, additionalProperties: true}
            sideEffect: external
            risk: external
            permissions: [github:pull-requests:write]
            credentials:
                - name: token
                  kind: github_token
            retry: {maxAttempts: 1}
            idempotency: required
        github-repository-content-get:
            name: github-repository-content-get
            description: Read one text file or directory listing at a branch, tag, or commit.
            inputSchema: &contentGetInput
                type: object
                additionalProperties: false
                required: [owner, repository, path]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    path: {type: string, minLength: 1, maxLength: 1024}
                    ref: {type: string, maxLength: 255}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:contents:read]
            credentials: &githubToken [{name: token, kind: github_token}]
            retry: {maxAttempts: 3}
            idempotency: supported
        github-branch-list:
            name: github-branch-list
            description: List up to 100 branches in one repository.
            inputSchema: &repositoryInput
                type: object
                additionalProperties: false
                required: [owner, repository]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:contents:read]
            credentials: *githubToken
            retry: {maxAttempts: 3}
            idempotency: supported
        github-commit-list:
            name: github-commit-list
            description: List up to 100 commits, optionally filtered by revision or path.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    ref: {type: string, maxLength: 255}
                    path: {type: string, maxLength: 1024}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:contents:read]
            credentials: *githubToken
            retry: {maxAttempts: 3}
            idempotency: supported
        github-issue-list:
            name: github-issue-list
            description: List up to 100 issues with optional state and label filters.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    state: {type: string, enum: [open, closed, all], default: open}
                    labels: {type: string, maxLength: 1024}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:issues:read]
            credentials: *githubToken
            retry: {maxAttempts: 3}
            idempotency: supported
        github-issue-get:
            name: github-issue-get
            description: Read one GitHub issue.
            inputSchema: &numberedInput
                type: object
                additionalProperties: false
                required: [owner, repository, number]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    number: {type: integer, minimum: 1}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:issues:read]
            credentials: *githubToken
            retry: {maxAttempts: 3}
            idempotency: supported
        github-issue-create:
            name: github-issue-create
            description: Create an issue in one repository.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, title]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    title: {type: string, minLength: 1, maxLength: 256}
                    body: {type: string, maxLength: 65536}
                    labels: {type: string, maxLength: 1024}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: external
            risk: external
            permissions: [github:issues:write]
            credentials: *githubToken
            retry: {maxAttempts: 1}
            idempotency: required
        github-issue-update:
            name: github-issue-update
            description: Update an issue title, body, labels, or state.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, number]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    number: {type: integer, minimum: 1}
                    title: {type: string, maxLength: 256}
                    body: {type: string, maxLength: 65536}
                    labels: {type: string, maxLength: 1024}
                    state: {type: string, enum: [open, closed]}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: external
            risk: external
            permissions: [github:issues:write]
            credentials: *githubToken
            retry: {maxAttempts: 1}
            idempotency: supported
        github-issue-comments-list:
            name: github-issue-comments-list
            description: Read up to 100 comments on an issue.
            inputSchema: *numberedInput
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:issues:read]
            credentials: *githubToken
            retry: {maxAttempts: 3}
            idempotency: supported
        github-issue-comment-create:
            name: github-issue-comment-create
            description: Create a comment on an issue.
            inputSchema: &commentInput
                type: object
                additionalProperties: false
                required: [owner, repository, number, body]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    number: {type: integer, minimum: 1}
                    body: {type: string, minLength: 1, maxLength: 65536}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: external
            risk: external
            permissions: [github:issues:write]
            credentials: *githubToken
            retry: {maxAttempts: 1}
            idempotency: required
        github-pull-request-update:
            name: github-pull-request-update
            description: Update pull request title, body, base branch, or state.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, number]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    number: {type: integer, minimum: 1}
                    title: {type: string, maxLength: 256}
                    body: {type: string, maxLength: 65536}
                    base: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$'}
                    state: {type: string, enum: [open, closed]}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: external
            risk: external
            permissions: [github:pull-requests:write]
            credentials: *githubToken
            retry: {maxAttempts: 1}
            idempotency: supported
        github-pull-request-comments-list:
            name: github-pull-request-comments-list
            description: Read up to 100 conversation comments on a pull request.
            inputSchema: *numberedInput
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:pull-requests:read]
            credentials: *githubToken
            retry: {maxAttempts: 3}
            idempotency: supported
        github-pull-request-comment-create:
            name: github-pull-request-comment-create
            description: Create a conversation comment on a pull request.
            inputSchema: *commentInput
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: external
            risk: external
            permissions: [github:pull-requests:write]
            credentials: *githubToken
            retry: {maxAttempts: 1}
            idempotency: required
        github-pull-request-reviews-list:
            name: github-pull-request-reviews-list
            description: Read up to 100 submitted reviews on a pull request.
            inputSchema: *numberedInput
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:pull-requests:read]
            credentials: *githubToken
            retry: {maxAttempts: 3}
            idempotency: supported
        github-pull-request-checks-list:
            name: github-pull-request-checks-list
            description: Read checks for the current pull request head revision.
            inputSchema: *numberedInput
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:checks:read, github:pull-requests:read]
            credentials: *githubToken
            retry: {maxAttempts: 3}
            idempotency: supported
        github-pull-request-merge:
            name: github-pull-request-merge
            description: Merge a pull request, optionally requiring an exact inspected head revision.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, number]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    number: {type: integer, minimum: 1}
                    headSha: {type: string, pattern: '^[a-fA-F0-9]{40}$'}
                    method: {type: string, enum: [merge, squash, rebase], default: merge}
                    commitTitle: {type: string, maxLength: 256}
                    commitMessage: {type: string, maxLength: 65536}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: destructive
            risk: destructive
            permissions: [github:pull-requests:merge]
            credentials: *githubToken
            retry: {maxAttempts: 1}
            idempotency: required
        github-workflow-list:
            name: github-workflow-list
            description: List up to 100 GitHub Actions workflows.
            inputSchema: *repositoryInput
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:actions:read]
            credentials: *githubToken
            retry: {maxAttempts: 3}
            idempotency: supported
        github-workflow-runs-list:
            name: github-workflow-runs-list
            description: List up to 100 recent GitHub Actions workflow runs.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    workflow: {type: string, maxLength: 255}
                    branch: {type: string, maxLength: 255}
                    status: {type: string, maxLength: 64}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: read
            risk: read
            permissions: [github:actions:read]
            credentials: *githubToken
            retry: {maxAttempts: 3}
            idempotency: supported
        github-workflow-dispatch:
            name: github-workflow-dispatch
            description: Dispatch a GitHub Actions workflow on an explicit branch or tag.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, workflow, ref]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    workflow: {type: string, minLength: 1, maxLength: 255}
                    ref: {type: string, minLength: 1, maxLength: 255}
                    inputs: {type: string, maxLength: 65536, description: JSON object of workflow inputs.}
            outputSchema: {type: object, additionalProperties: true}
            sideEffect: external
            risk: external
            permissions: [github:actions:write]
            credentials: *githubToken
            retry: {maxAttempts: 1}
            idempotency: required
        github-branch-create:
            name: github-branch-create
            description: Create a branch from an exact inspected commit. An existing branch is accepted only when it has the same head; it is never replaced.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, branch, sha]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    branch: {type: string, minLength: 1, maxLength: 255}
                    sha: {type: string, pattern: '^[a-fA-F0-9]{40}$'}
            outputSchema: {type: object, additionalProperties: false, required: [branch, sha, replayed], properties: {branch: {type: string}, sha: {type: string}, replayed: {type: boolean}}}
            sideEffect: external
            risk: external
            permissions: [github:contents:write]
            credentials: *githubToken
            retry: {maxAttempts: 1}
            idempotency: required
        github-commit-create:
            name: github-commit-create
            description: Create or update files, delete files, commit all changes together and publish to an explicit existing branch. Requires its exact inspected head SHA. Rejects concurrent branch changes and never force-pushes. Supports normal and executable files with UTF-8 or base64 contents.
            inputSchema:
                type: object
                additionalProperties: false
                required: [owner, repository, branch, expectedHeadSha, message, files]
                properties:
                    owner: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    repository: {type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$'}
                    branch: {type: string, minLength: 1, maxLength: 255}
                    expectedHeadSha: {type: string, pattern: '^[a-fA-F0-9]{40}$'}
                    message: {type: string, minLength: 1, maxLength: 65536}
                    files:
                        type: array
                        minItems: 1
                        maxItems: 100
                        items:
                            type: object
                            additionalProperties: false
                            required: [path]
                            properties:
                                path: {type: string, minLength: 1, maxLength: 1024}
                                content: {type: string, description: Exact file content including whitespace. Required for additions and updates; omit for deletion.}
                                encoding: {type: string, enum: [utf-8, base64]}
                                mode: {type: string, enum: ['100644', '100755']}
                                delete: {type: boolean}
            outputSchema: {type: object, additionalProperties: false, required: [branch, commitSha, treeSha, published, replayed], properties: {branch: {type: string}, commitSha: {type: string}, treeSha: {type: string}, published: {type: boolean}, replayed: {type: boolean}}}
            sideEffect: external
            risk: external
            permissions: [github:contents:write]
            credentials: *githubToken
            retry: {maxAttempts: 1}
            idempotency: required
    callbackAdapters:
        repository-events:
            protocolVersion: openseal.callback.adapter/v1
            name: GitHub repository events
            description: Verify GitHub webhook signatures and normalize pull request, issue, comment, and workflow run triggers.
            provider: github
            eventTypes:
                - github.issue_comment.created
                - github.issue_comment.edited
                - github.issues.closed
                - github.issues.edited
                - github.issues.opened
                - github.issues.reopened
                - github.pull_request.closed
                - github.pull_request.opened
                - github.pull_request.ready_for_review
                - github.pull_request.reopened
                - github.pull_request.synchronize
                - github.workflow_run.completed
                - github.workflow_run.in_progress
                - github.workflow_run.requested
            credentials:
                - name: webhook_secret
                  kind: github_webhook_secret
            transport:
                kind: plugin
                ingressEndpoint: github.callback.ingress
                ingressCredentials: [webhook_secret]
    prompt:
        instructions: "Use GitHub reads to verify repository, issue, pull-request, check, and workflow state. Read the exact pull request, changed files, reviews, and checks before reviewing or merging. Supply the inspected headSha when merging. Use github-branch-create to create an explicitly requested branch from an inspected commit. Use github-commit-create to create, edit or delete files and commit and publish them together; this GitHub API path does not require workspace Git. Read the destination branch head first and supply expectedHeadSha. On a head conflict, inspect the new changes and reconcile before proposing another commit; never overwrite or force-push. Preserve exact file contents and executable modes. Existing bindings do not gain new actions automatically: use the normal setup flow to request github:contents:write when needed. Create or update external GitHub state only when requested. Never request, print, or expose credential values."
        userInvocable: true
        allowedTools: [github-repository-get, github-repository-content-get, github-branch-list, github-branch-create, github-commit-list, github-commit-create, github-issue-list, github-issue-get, github-issue-create, github-issue-update, github-issue-comments-list, github-issue-comment-create, github-pull-request-list, github-pull-request-get, github-pull-request-files, github-pull-request-create, github-pull-request-update, github-pull-request-comments-list, github-pull-request-comment-create, github-pull-request-reviews-list, github-pull-request-review-create, github-pull-request-checks-list, github-pull-request-merge, github-workflow-list, github-workflow-runs-list, github-workflow-dispatch]
    requirements:
        tenancy: shared
    installers:
        - id: oci
          kind: oci
          label: GitHub Skill service image
          package: axiomstudio/skill-github:1.3.1
    source:
        format: axiom.skill/v1
        identity: https://github.com/axiom-studio/skills::skill-github
        registry: https://github.com/axiom-studio/skills
        publisher: Axiom Studio
        license: MIT
        reference: skill-github
        resolvedVersion: 1.3.1
diagnostics:
    - code: forward_ported
      message: Authored as a canonical OpenSeal Skill with bounded GitHub API actions.
      severity: info
