apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        vault-database-creds:
            credentials:
                - kind: vault-credential
                  name: vault-credential
            description: Vault Database Creds
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    address:
                        description: Vault server address
                        type: string
                    mount:
                        default: database
                        description: Database mount path
                        type: string
                    role:
                        description: Database role name
                        type: string
                required:
                    - address
                    - role
                type: object
            name: vault-database-creds
            permissions:
                - vault:read
                - vault:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
