apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        sf-create:
            credentials:
                - kind: salesforce_api
                  name: salesforce_api
            description: Sf Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    data:
                        description: Record data
                        type: object
                    instanceURL:
                        description: Salesforce instance URL
                        type: string
                    objectType:
                        description: Object type (Account, Contact, etc.)
                        type: string
                required:
                    - data
                    - instanceURL
                    - objectType
                type: object
            name: sf-create
            permissions:
                - salesforce:read
                - salesforce:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        sf-delete:
            credentials:
                - kind: salesforce_api
                  name: salesforce_api
            description: Sf Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    instanceURL:
                        description: Salesforce instance URL
                        type: string
                    objectType:
                        description: Object type (Account, Contact, etc.)
                        type: string
                    recordId:
                        description: Record ID
                        type: string
                required:
                    - instanceURL
                    - objectType
                    - recordId
                type: object
            name: sf-delete
            permissions:
                - salesforce:read
                - salesforce:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        sf-describe:
            credentials:
                - kind: salesforce_api
                  name: salesforce_api
            description: Sf Describe
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    instanceURL:
                        description: Salesforce instance URL
                        type: string
                    objectType:
                        description: Object type to describe
                        type: string
                required:
                    - instanceURL
                    - objectType
                type: object
            name: sf-describe
            permissions:
                - salesforce:read
                - salesforce:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        sf-query:
            credentials:
                - kind: salesforce_api
                  name: salesforce_api
            description: Sf Query
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    instanceURL:
                        description: Salesforce instance URL
                        type: string
                    query:
                        description: SOQL query
                        type: string
                required:
                    - instanceURL
                    - query
                type: object
            name: sf-query
            permissions:
                - salesforce:read
                - salesforce:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        sf-soql:
            credentials:
                - kind: salesforce_api
                  name: salesforce_api
            description: Sf Soql
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    fields:
                        description: Fields to select (builder mode)
                        type: string
                    instanceURL:
                        description: Salesforce instance URL
                        type: string
                    limit:
                        description: Max results (builder mode)
                        type: integer
                    mode:
                        default: raw
                        description: Query mode (raw, builder)
                        type: string
                    objectType:
                        description: Object type for builder mode
                        type: string
                    whereClause:
                        description: Where clause (builder mode)
                        type: string
                required:
                    - instanceURL
                type: object
            name: sf-soql
            permissions:
                - salesforce:read
                - salesforce:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        sf-update:
            credentials:
                - kind: salesforce_api
                  name: salesforce_api
            description: Sf Update
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    data:
                        description: Record data to update
                        type: object
                    instanceURL:
                        description: Salesforce instance URL
                        type: string
                    objectType:
                        description: Object type (Account, Contact, etc.)
                        type: string
                    recordId:
                        description: Record ID
                        type: string
                required:
                    - data
                    - instanceURL
                    - objectType
                    - recordId
                type: object
            name: sf-update
            permissions:
                - salesforce:read
                - salesforce:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
