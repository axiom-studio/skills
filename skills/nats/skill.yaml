apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        nats-consumer-create:
            credentials:
                - kind: nats-credential
                  name: nats-credential
            description: Nats Consumer Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    deliverPolicy:
                        description: Deliver policy
                        type: string
                    filterSubject:
                        description: Filter subject
                        type: string
                    name:
                        description: Consumer name
                        type: string
                    stream:
                        description: Stream name
                        type: string
                    url:
                        description: NATS server URL
                        type: string
                required:
                    - name
                    - stream
                    - url
                type: object
            name: nats-consumer-create
            permissions:
                - nats:read
                - nats:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        nats-consumer-list:
            credentials:
                - kind: nats-credential
                  name: nats-credential
            description: Nats Consumer List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    stream:
                        description: Stream name
                        type: string
                    url:
                        description: NATS server URL
                        type: string
                required:
                    - stream
                    - url
                type: object
            name: nats-consumer-list
            permissions:
                - nats:read
                - nats:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        nats-jetstream-create:
            credentials:
                - kind: nats-credential
                  name: nats-credential
            description: Nats Jetstream Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    maxConsumers:
                        description: Max consumers
                        type: integer
                    maxMsgs:
                        description: Max messages
                        type: integer
                    name:
                        description: Stream name
                        type: string
                    retention:
                        description: Retention policy
                        type: string
                    subjects:
                        description: Subjects to store
                        type: string
                    url:
                        description: NATS server URL
                        type: string
                required:
                    - name
                    - subjects
                    - url
                type: object
            name: nats-jetstream-create
            permissions:
                - nats:read
                - nats:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        nats-jetstream-list:
            credentials:
                - kind: nats-credential
                  name: nats-credential
            description: Nats Jetstream List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    url:
                        description: NATS server URL
                        type: string
                required:
                    - url
                type: object
            name: nats-jetstream-list
            permissions:
                - nats:read
                - nats:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        nats-publish:
            credentials:
                - kind: nats-credential
                  name: nats-credential
            description: Nats Publish
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    data:
                        description: Message data
                        type: string
                    headers:
                        description: Message headers
                        type: object
                    subject:
                        description: Subject to publish to
                        type: string
                    url:
                        description: NATS server URL
                        type: string
                required:
                    - data
                    - subject
                    - url
                type: object
            name: nats-publish
            permissions:
                - nats:read
                - nats:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        nats-request:
            credentials:
                - kind: nats-credential
                  name: nats-credential
            description: Nats Request
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    data:
                        description: Request data
                        type: string
                    subject:
                        description: Subject to send request to
                        type: string
                    timeout:
                        default: 5s
                        description: Request timeout
                        type: string
                    url:
                        description: NATS server URL
                        type: string
                required:
                    - data
                    - subject
                    - url
                type: object
            name: nats-request
            permissions:
                - nats:read
                - nats:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        nats-stream-info:
            credentials:
                - kind: nats-credential
                  name: nats-credential
            description: Nats Stream Info
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    stream:
                        description: Stream name
                        type: string
                    url:
                        description: NATS server URL
                        type: string
                required:
                    - stream
                    - url
                type: object
            name: nats-stream-info
            permissions:
                - nats:read
                - nats:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        nats-subscribe:
            credentials:
                - kind: nats-credential
                  name: nats-credential
            description: Nats Subscribe
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    maxMessages:
                        description: Max messages to receive
                        type: integer
                    queue:
                        description: Queue group name
                        type: string
                    subject:
                        description: Subject to subscribe
                        type: string
                    timeout:
                        description: Subscribe timeout
                        type: string
                    url:
                        description: NATS server URL
                        type: string
                required:
                    - subject
                    - url
                type: object
            name: nats-subscribe
            permissions:
                - nats:read
                - nats:write
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: messaging
    description: NATS messaging system operations for Atlas agents
    icon: radio
    id: skill-nats
    installers:
        - id: oci
          kind: oci
          label: NATS Skill service image
          package: axiomstudio/skill-nats:1.0.0
    name: NATS Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-nats
        resolvedVersion: 1.0.0
    tags:
        - jetstream
        - messaging
        - nats
        - pub-sub
    transport:
        endpoint: skill-nats
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
