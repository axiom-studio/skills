                properties: {}
                type: object
            name: do-space-list
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        do-space-upload:
            credentials:
                - kind: digitalocean-credential
                  name: digitalocean-credential
            description: Do Space Upload
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    acl:
                        default: private
                        description: Access control (private, public-read)
                        type: string
                    content:
                        description: File content
                        type: string
                    contentType:
                        default: application/octet-stream
                        description: Content type
                        type: string
                    key:
                        description: Object key
                        type: string
                    space:
                        description: Space name
                        type: string
                required:
                    - content
                    - key
                    - space
                type: object
            name: do-space-upload
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
