apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        do-app-deploy:
            credentials:
                - kind: digitalocean-credential
                  name: digitalocean-credential
            description: Do App Deploy
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    appId:
                        description: App ID
                        type: string
                    forceBuild:
                        default: false
                        description: Force a new build
                        type: boolean
                required:
                    - appId
                type: object
            name: do-app-deploy
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        do-app-list:
            credentials:
                - kind: digitalocean-credential
                  name: digitalocean-credential
            description: Do App List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties: {}
                type: object
            name: do-app-list
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        do-database-list:
            credentials:
                - kind: digitalocean-credential
                  name: digitalocean-credential
            description: Do Database List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties: {}
                type: object
            name: do-database-list
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        do-droplet-create:
            credentials:
                - kind: digitalocean-credential
                  name: digitalocean-credential
            description: Do Droplet Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    backups:
                        description: Enable automated backups
                        type: boolean
                    image:
                        description: Image slug or ID
                        type: string
                    ipv6:
                        description: Enable IPv6
                        type: boolean
                    monitoring:
                        default: true
                        description: Enable monitoring
                        type: boolean
                    name:
                        description: Droplet hostname
                        type: string
                    region:
                        description: Region slug
                        type: string
                    size:
                        description: Size slug (e.g., s-1vcpu-1gb)
                        type: string
                    sshKeys:
                        description: SSH key IDs or fingerprints
                        type: string
                    tags:
                        description: Tags to apply
                        type: string
                    userData:
                        description: Cloud-init user data script
                        type: string
                required:
                    - image
                    - name
                    - region
                    - size
                type: object
            name: do-droplet-create
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        do-droplet-delete:
            credentials:
                - kind: digitalocean-credential
                  name: digitalocean-credential
            description: Do Droplet Delete
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    dropletId:
                        description: Droplet ID to delete
                        type: integer
                required:
                    - dropletId
                type: object
            name: do-droplet-delete
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
            risk: destructive
            sideEffect: destructive
        do-droplet-list:
            credentials:
                - kind: digitalocean-credential
                  name: digitalocean-credential
            description: Do Droplet List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    region:
                        description: Filter by region slug
                        type: string
                    tag:
                        description: Filter by tag name
                        type: string
                type: object
            name: do-droplet-list
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        do-droplet-power:
            credentials:
                - kind: digitalocean-credential
                  name: digitalocean-credential
            description: Do Droplet Power
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (power_on, power_off, reboot, shutdown)
                        type: string
                    dropletId:
                        description: Droplet ID
                        type: integer
                required:
                    - action
                    - dropletId
                type: object
            name: do-droplet-power
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
            risk: production
            sideEffect: external
        do-kubernetes-create:
            credentials:
                - kind: digitalocean-credential
                  name: digitalocean-credential
            description: Do Kubernetes Create
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    autoUpgrade:
                        default: false
                        description: Enable auto-upgrades
                        type: boolean
                    ha:
                        default: false
                        description: Enable high availability
                        type: boolean
                    name:
                        description: Cluster name
                        type: string
                    nodePools:
                        description: Node pool configurations
                        type: string
                    region:
                        description: Region slug
                        type: string
                    version:
                        description: Kubernetes version
                        type: string
                required:
                    - name
                    - nodePools
                    - region
                    - version
                type: object
            name: do-kubernetes-create
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
