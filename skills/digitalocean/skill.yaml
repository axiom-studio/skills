            description: Do Loadbalancer List
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties: {}
                type: object
            name: do-loadbalancer-list
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
            risk: read
            sideEffect: read
        do-space-download:
            credentials:
                - kind: digitalocean-credential
                  name: digitalocean-credential
            description: Do Space Download
            idempotency: supported
            inputSchema:
                additionalProperties: false
                properties:
                    key:
                        description: Object key
                        type: string
                    space:
                        description: Space name
                        type: string
                required:
                    - key
                    - space
                type: object
            name: do-space-download
            permissions:
                - digitalocean:read
                - digitalocean:write
            retry:
                maxAttempts: 1
