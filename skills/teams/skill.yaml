apiVersion: openseal.dev/v1alpha1
definition:
    actions:
        teams-card:
            credentials:
                - kind: teams-credential
                  name: teams-credential
            description: Teams Card
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    actions:
                        description: Array of action buttons
                        type: string
                    sections:
                        description: Array of section objects
                        type: string
                    summary:
                        description: Card summary for accessibility
                        type: string
                    text:
                        description: Card text content
                        type: string
                    themeColor:
                        default: '#6264A7'
                        description: Theme color in hex format
                        type: string
                    title:
                        description: Card title
                        type: string
                required:
                    - text
                    - title
                type: object
            name: teams-card
            permissions:
                - teams:manage
                - teams:read
                - teams:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        teams-channel:
            credentials:
                - kind: teams-credential
                  name: teams-credential
            description: Teams Channel
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (list, get, create, update, delete)
                        type: string
                    channelId:
                        description: Channel ID (required for get/update/delete)
                        type: string
                    description:
                        description: Channel description
                        type: string
                    displayName:
                        description: Channel display name
                        type: string
                    membershipType:
                        default: standard
                        description: Channel type (standard, private, shared)
                        type: string
                    teamId:
                        description: Team ID containing channels
                        type: string
                required:
                    - action
                    - teamId
                type: object
            name: teams-channel
            permissions:
                - teams:manage
                - teams:read
                - teams:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        teams-meeting:
            credentials:
                - kind: teams-credential
                  name: teams-credential
            description: Teams Meeting
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (create, get, cancel, attendees)
                        type: string
                    attendees:
                        description: Comma-separated attendee emails
                        type: string
                    content:
                        description: Meeting content/body
                        type: string
                    endTime:
                        description: Meeting end time (ISO 8601)
                        type: string
                    isOnline:
                        default: true
                        description: Create as online meeting
                        type: boolean
                    meetingId:
                        description: Meeting ID
                        type: string
                    startTime:
                        description: Meeting start time (ISO 8601)
                        type: string
                    subject:
                        description: Meeting subject
                        type: string
                required:
                    - action
                type: object
            name: teams-meeting
            permissions:
                - teams:manage
                - teams:read
                - teams:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        teams-send:
            credentials:
                - kind: teams-credential
                  name: teams-credential
            description: Teams Send
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    mentionUsers:
                        description: Comma-separated user IDs to mention
                        type: string
                    message:
                        description: Message content to send
                        type: string
                    summary:
                        description: Card summary for accessibility
                        type: string
                    themeColor:
                        default: '#6264A7'
                        description: Theme color for the message card
                        type: string
                required:
                    - message
                type: object
            name: teams-send
            permissions:
                - teams:manage
                - teams:read
                - teams:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
        teams-user:
            credentials:
                - kind: teams-credential
                  name: teams-credential
            description: Teams User
            idempotency: required
            inputSchema:
                additionalProperties: false
                properties:
                    action:
                        description: Action (get, list, chat, install-app)
                        type: string
                    appId:
                        description: App ID to install
                        type: string
                    message:
                        description: Chat message content
                        type: string
                    userId:
                        description: User ID or email
                        type: string
                required:
                    - action
                type: object
            name: teams-user
            permissions:
                - teams:manage
                - teams:read
                - teams:send
            retry:
                maxAttempts: 1
            risk: external
            sideEffect: external
    category: communication
    description: Microsoft Teams messaging operations for Atlas agents
    icon: message-circle
    id: skill-teams
    installers:
        - id: oci
          kind: oci
          label: Microsoft Teams Skill service image
          package: axiomstudio/skill-teams:1.0.0
    name: Microsoft Teams Skill
    source:
        format: axiom.skill/v1
        homepage: ""
        license: MIT
        publisher: Axiom Studio
        reference: skill-teams
        resolvedVersion: 1.0.0
    tags:
        - chat
        - messaging
        - microsoft
        - teams
    transport:
        endpoint: skill-teams
        kind: tool
    version: 1.0.0
diagnostics:
    - code: forward_ported
      message: Forward-ported into the canonical OpenSeal Skill contract with conservative action policy.
      severity: info
kind: SkillDefinition
